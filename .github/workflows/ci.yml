---
name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  redaction-gate:
    name: Redaction gate — no private markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Check for forbidden private markers
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys

          # These strings must never appear in the public OSS toolkit
          FORBIDDEN = [
              (re.compile(r'\b' + 'fp' + r'df\b', re.IGNORECASE), 'system name'),
              (re.compile(r'\b' + 'data' + r'bricks\b', re.IGNORECASE), 'data platform name'),
              (re.compile(r'\b' + 'mc' + r'aas\b', re.IGNORECASE), 'managed service name'),
              (re.compile('gsaext_' + 'fp' + 'df_uat|gsaext-' + 'fp' + 'df-uat', re.IGNORECASE), 'UAT share recipient'),
              (re.compile('dbdde' + '48f|58339' + 'e26'), 'service-principal id'),
          ]
          EXTS = {'.py', '.yaml', '.yml', '.json', '.md'}
          SKIP = {'.git', '.github', '__pycache__', 'node_modules'}

          root = pathlib.Path('.')
          hits = []
          for f in root.rglob('*'):
              if any(p in f.parts for p in SKIP):
                  continue
              if f.is_file() and f.suffix in EXTS:
                  text = f.read_text(errors='replace')
                  for pat, label in FORBIDDEN:
                      if pat.search(text):
                          hits.append(f'{f}: contains {label}')
                          break

          if hits:
              print('FAIL: private markers found in OSS toolkit:')
              for h in hits:
                  print(f'  {h}')
              sys.exit(1)
          print(f'OK: scanned {sum(1 for f in root.rglob("*") if f.is_file() and f.suffix in EXTS)} files — no private markers')
          EOF

  cold-start:
    name: Template cold-start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Copy template and run synthetic pipeline
        run: make -C templates/generic-crm-system cold-start
