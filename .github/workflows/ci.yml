---
name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install PyYAML
        run: uv pip install --system pyyaml

      - name: Redaction gate — packs
        run: |
          python scripts/validate.py packs/gsa-fedramp/gsa-fedramp.cdx.json
          python scripts/validate.py packs/cloudgov-paas/cloudgov-paas.cdx.json
