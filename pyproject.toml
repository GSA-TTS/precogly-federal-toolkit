[project]
name = "precogly-federal-toolkit"
version = "0.1.0"
description = "Reusable federal SSP, CycloneDX, and Precogly tooling"
requires-python = ">=3.13,<3.14"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.23.0", "requests>=2.31"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
precogly-toolkit = "precogly_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/precogly_toolkit"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
