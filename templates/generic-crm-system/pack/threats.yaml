  - id: gsa-pages-component-definition-crm-au-3
    name: 'CRM: AU-3 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-3 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github audit logs capture the following information for each event:
      - Event type (what action was performed)
      - Timestamp (when the event occurred)
      - Location information (IP address, geographical location)
      - Source information (browser, application, or API)
      - Outcome of the action (success or failure)
      - User identity (username of the person who performed the action)

      This information is sufficient to support after-the-fact investigations of security incidents.

      Statements:
