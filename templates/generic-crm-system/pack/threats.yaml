  - id: gsa-pages-component-definition-crm-sr-2
    name: 'CRM: SR-2 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-2 on GSA Pages.
      Unfulfilled requirements:

      GSA has developed and implemented a comprehensive Supply Chain Risk Management (SCRM) Plan that addresses risks across the entire lifecycle of IT systems, system components, and system services:

      a. GSA's SCRM Plan includes:
         - A structured approach for managing supply chain risks across the research and development, design, manufacturing, acquisition, delivery, integration, operations and maintenance, and disposal phases
         - Risk assessment methodologies for identifying, analyzing, and prioritizing supply chain risks
         - Specific controls and mitigation strategies for various risk scenarios
         - Roles and responsibilities for implementing supply chain risk management activities
         - Procedures for continuous monitoring of the supply chain
         - Integration with GSA's overall risk management framework
         - Vendor and product assessment procedures
         - Incident response protocols for supply chain events
         - Security requirements for suppliers and service providers
         - Compliance verification mechanisms

      b. GSA's OCISO C-SCRM team reviews and updates the SCRM Plan annually, or more frequently when significant changes occur in the GSA or suppliers' risk environment. Updates are also made in response to:
         - New or emerging threats to the supply chain
         - Changes in federal regulations or policies related to supply chain security
         - Organizational changes that affect supply chain management
         - Results from supply chain risk assessments
         - Lessons learned from supply chain incidents

      c. The SCRM Plan is protected from unauthorized disclosure and modification through:
         - Access controls limiting distribution to authorized personnel
         - Classification and handling requirements
         - Secure storage in GSA's document management systems
         - Version control and change management procedures
         - Regular audits of access and modification logs
         - Training for personnel with access to the plan on proper handling procedures

      The GSA SCRM Plan aligns with NIST SP 800-161, the Federal Acquisition Supply Chain Security Act, and the SECURE Technology Act requirements.

        - supply-chain-risk-management-plan



