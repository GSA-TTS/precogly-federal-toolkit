  - id: gsa-pages-component-definition-crm-sc-22
    name: 'CRM: SC-22 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SC-22 on GSA Pages.
      Unfulfilled requirements:

      This System:

      Cloud.gov implements a fault-tolerant and role-separated DNS infrastructure for name/address resolution services. The platform leverages AWS Route 53 for DNS services, which provides inherent fault tolerance through multiple levels of redundancy.

      DNS fault tolerance is achieved through:
      1. Distributed DNS servers across multiple AWS availability zones
      2. Automated failover between primary and secondary DNS servers
      3. Multiple geographically dispersed DNS endpoints
      4. Anycast routing to the nearest available DNS server
      5. Health checking and automatic removal of unhealthy DNS endpoints

      Role separation is maintained by:
      1. Separating internal DNS resolution functions from external-facing DNS servers
      2. Implementing access controls that restrict which DNS servers can be queried by internal vs. external systems
      3. Using separate DNS zones for internal platform operations and external service endpoints
      4. Following the AWS shared responsibility model for DNS security

      This architecture ensures high availability of DNS services for cloud.gov and applications hosted on the platform, while maintaining appropriate security boundaries between internal and external DNS functions.

        - dns-redundancy

