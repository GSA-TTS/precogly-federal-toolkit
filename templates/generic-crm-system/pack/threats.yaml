      - pm-30_smt.b: Supply chain risk management procedures for GSA IT managed information systems are defined and
      documented within CIO-IT Security-21-117. The guide serves as the Tier 2 (organizational) plan for
      GSA IT in accordance with [NIST SP 800-161, Revision 1](<REDACTED_URL>), “Cybersecurity Supply Chain Risk
      Management Practices for Systems and Organizations.” The guide identifies how the OCISO C-SCRM
      Program within the ICAM Shared Services Division (ISI) of GSA IT manages supplier induced
      information security risks for GSA IT systems throughout their lifecycle, including pre-award
      mitigations and post-award monitoring of risks. The C-SCRM Program’s operational activities are
      supported by Standard Operating Procedures (SOPs) that detail how the program activities are
      executed. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-30_smt.c: CIO-IT Security-21-117 is reviewed/updated annually upon changes to Federal or GSA policies
