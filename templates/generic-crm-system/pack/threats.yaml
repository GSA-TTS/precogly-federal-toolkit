    name: 'CRM: SI-4(5) Responsibility Gap - Cloud.gov'
    description: |-
      A customer responsibility gap exists for SI-4(5) on Cloud.gov.
      Unfulfilled requirements:

      Application owners must establish the SLA with cloud.gov for reporting malicious code detection that effects the application. cloud.gov will detect files matching AV/Malware signatures in customer application deployments, or uploads, but alerts can only be routed to customers during business hours.
  - id: gsa-common-controls-component-definition-crm-ac-1
    name: 'CRM: AC-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AC-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ac-1_smt.a: 1. The GSA access control policy is defined in the GSA Order CIO 2100.1, “GSA Information
      Technology (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities,
      management commitment, coordination among organizational entities, and compliance
      regarding access control for GSA systems. This policy is disseminated GSA-wide via GSA’s
      InSite centralized agency [Directives website](<REDACTED_URL>).
      1. Access control procedures are documented in CIO-IT Security-01-07: Access Control. This
      guide is disseminated GSA-wide via GSA’s InSite centralized agency [IT Security Procedural
      Guides website.](<REDACTED_URL>) ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ac-1_smt.b: Per CIO 2100.1, the CISO is responsible for managing the development and publishing of all
      security policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ac-1_smt.c: The GSA OCISO is responsible for reviewing and updating:
      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. CIO-IT Security-01-07 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ac-2-5
    name: 'CRM: AC-2(5) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AC-2(5) on GSA Common Controls.
      Unfulfilled requirements:

      Inactivity Logout is a policy-based Common Control provided by
      [GSA Order CIO 2104.1](<REDACTED_URL>), “GSA Information Technology (IT)
      General Rules of Behavior” Category Access - (3) Logoff and shutdown your GSA workstation at the
      end of the workday.

      Inactivity logout is behavior- or policy-based and requires users to take physical action to log
      out when they expect to be inactive longer than a defined period of time. A system’s automatic
      enforcement of user inactivity logout is documented by AC-11.
  - id: gsa-common-controls-component-definition-crm-ac-20
    name: 'CRM: AC-20 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AC-20 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners, ISSOs, and ISSMs must document the terms
      and conditions of external system interconnections within a system Interconnection
      Security Agreement (ISA). When a system ISA is required, System Owners, ISSOs, and ISSM must review
      [GSA Order CIO 2104.1](<REDACTED_URL>),
      “GSA Information Technology (IT) General Rules of Behavior,” and determine if a system-
      specific defined Rules of Behavior (RoB) (see PL-4) is required. If a system specific RoB is
      required, the System Owner must ensure the system’s RoB is reflected in the ISA and is
      communicated to all personnel who require system access.

      Statements:
      - ac-20_smt.a: [GSA Order CIO 2100.1](<REDACTED_URL>),
      “GSA Information Technology (IT) Security Policy,” and
      [CIO-IT Security-06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk identify the conditions under which external
      information systems can be accessed via an Interconnection Security Agreement (ISA). The
      system’s approved ISA documents the terms and conditions and control assertions regarding the
      interconnected systems. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ac-20_smt.b: CIO 2100.1 and CIO-IT Security-06-30 require all external systems to be governed by an ISA,
      therefore prohibiting the use of external systems not governed by an ISA. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ac-20-1
    name: 'CRM: AC-20(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AC-20(1) on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners, ISSOs, and ISSMs must
      document in collaboration with the external System Owners the security controls and facilitate signing of an ISA.

      Statements:
      - ac-20.1_smt.a: [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy,” and
      [CIO-IT Security-06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk identify the requirement, via an ISA, to verify
      adequate security controls are in place to use an external information system. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ac-20.1_smt.b: [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy,” and
      [CIO-IT Security-06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk require a signed ISA to be approved by GSA and the
      external system’s organization in order to access the information system. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ac-20-2
    name: 'CRM: AC-20(2) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AC-20(2) on GSA Common Controls.
      Unfulfilled requirements:

      [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT)
      Security Policy,” and [CIO-IT Security-06-32](<REDACTED_URL>):
      Media Protection state that GSA restricts the use of digital storage devices, including
      portable devices, to devices provided by GSA or provided by organizations approved by
      GSA-on-GSA information systems. All portable storage must be encrypted with a Federal
      Information Processing Standard
      [140-3](<REDACTED_URL>)/140-2, “Security
      Requirements for Cryptographic Modules” validated encryption module.
  - id: gsa-common-controls-component-definition-crm-at-1
    name: 'CRM: AT-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - at-1_smt.a: 1. The GSA security awareness training policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance regarding security awareness training for GSA systems. This policy is consistent
      with applicable laws, executive orders, directives, regulations, policies, standards, and
      guidelines. This policy is disseminated GSA-wide via GSA’s InSite centralized agency
      [Directives website.](<REDACTED_URL>)
      1. Security awareness training procedures are documented in CIO-IT Security-05-29: Security and
      Privacy Awareness and Role Based Training Program. This guide is disseminated GSA-wide via
      GSA’s InSite centralized agency [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - at-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - at-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      1. CIO-IT Security-05-29 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-at-2
    name: 'CRM: AT-2 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-2 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** This control's requirements apply and are satisfied by the
      OCISO training program for GSA personnel who are provisioned with an Enterprise Network Account
      (i.e., ENT Long-Name Account [LNA]) and who manage GSA Federal systems. Therefore, System Owners
      can inherit this control entirely to meet these security training requirements.

      Statements:
      - at-2_smt.a: 1. New GSA personnel (i.e., contractors and federal employees) must read and acknowledge
      [GSA Order CIO 2104.1](<REDACTED_URL>), “GSA Information Technology (IT)
      General Rules of Behavior,” within 90 days of receiving their Enterprise Network Account
      (i.e., Long Name Account). After this, they must complete the GSA IT Security and Privacy
      Awareness curriculum annually.
      1. GSA personnel receive additional communications to raise cybersecurity awareness during the
      year. The OCISO and GSA IT communications teams conduct these campaigns in response to
      security trends, significant events, and user feedback. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - at-2_smt.b: The OCISO Policy and Compliance Division (ISP) coordinates campaigns year-round to raise
      cybersecurity awareness. Campaigns include frequent phishing campaigns against different user
      groups, including VIPs and Privileged Users; security vignettes via email; and a robust
      communications campaign during the annual Cybersecurity Awareness month. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - at-2_smt.c: GSA's mandatory IT Security and Privacy Awareness course is updated annually. Updates are based
      on an analysis of security-related trends and user feedback ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - at-2_smt.d: OCISO ISP incorporates insight shared in security incident/breach reports when these reports are
      shared with them This insight will contribute to the goals of the training. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-at-2-2
    name: 'CRM: AT-2(2) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-2(2) on GSA Common Controls.
      Unfulfilled requirements:

      [GSA Order ADM 2400.1](<REDACTED_URL>), “Insider Threat Program,”
      describes GSA’s roles, responsibilities, and policy regarding its insider threat program (ITP).
      ITP personnel, under the Associate Administrator for Mission Assurance, are
      responsible for ensuring insider threat information and training is provided annually at a minimum.

      **Federal System-Specific Expectation:** This control's requirements apply and are satisfied by
      the Office of Mission Assurance (OMA) training program for GSA personnel who are provisioned with
      an Enterprise Network Account (i.e., ENT Long-Name Account [LNA]) and who manage GSA Federal
      systems. Therefore, System Owners can inherit this control entirely to meet these security
      training requirements.
  - id: gsa-common-controls-component-definition-crm-at-2-3
    name: 'CRM: AT-2(3) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-2(3) on GSA Common Controls.
      Unfulfilled requirements:

      OCISO's mandatory Security and Privacy Awareness course supports this control. This course
      teaches students

      1. how to recognize and report phishing attacks, a form of social engineering
      2) how their social media presence could be used against them.

      All GSA personnel are required to take this training. Throughout the year,
      the OCISO sends security vignettes to reinforce the concepts introduced in this course.

      **Federal System-Specific Expectation:** This control's requirements apply and are satisfied by
      the Office of Mission Assurance (OMA) training program for GSA personnel who are provisioned with
      an Enterprise Network Account (i.e., ENT Long-Name Account [LNA]) and who manage GSA Federal
      systems. Therefore, System Owners can inherit this control entirely to meet these security
      training requirements.
  - id: gsa-common-controls-component-definition-crm-at-3
    name: 'CRM: AT-3 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-3 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** Before authorizing system or data access for the defined system roles,
      System Owners must ensure personnel’s role-based security and privacy initial training is completed and is
      conducted annually thereafter.

      Statements:
      - at-3_smt.a: The OCISO manages training for personnel holding roles with significant security responsibilities.
      [CIO-IT Security-05-29](<REDACTED_URL>):
      Security and Privacy Awareness and Role Based Training Program describes these
      roles and the training they must receive throughout the year.

      1. Privileged Users holding a Short Name Account must acknowledge the "Rules of Behavior for
      Privileged Users" before obtaining that account, and annually after that. All other roles receive
      training within six months of their assignment.
      1. System owners must contact the OCISO ISP division for training assistance. OCISO ISP may
      support the system owner's training campaign when their content is relevant to all GSA
      personnel with significant security responsibilities. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - at-3_smt.b: Content briefed to AOs and the GSA Security Community via the OCISO Security Exchange is
      updated quarterly and often speaks to security trends or significant security events. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - at-3_smt.c: OCISO ISP incorporates insight shared in security incident/breach reports when these reports are
      shared with them, and this insight contributes to the goals of the training session. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-at-3-5
    name: 'CRM: AT-3(5) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-3(5) on GSA Common Controls.
      Unfulfilled requirements:

      GSA's Privacy Office requires all account holders to complete training, upon onboarding and
      annually thereafter, that describes how to safeguard personally identifiable information data
      and how to share it securely. The training covers how and where to document the authority to
      process personally identifiable information and how GSA develops and maintains a system of
      records notices, privacy impact assessments, and other related data management documentation.
  - id: gsa-common-controls-component-definition-crm-at-4
    name: 'CRM: AT-4 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AT-4 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners are required to maintain training records
      for any system specific role-based training provided to users of the information system.

      Statements:
      - at-4_smt.a: OCSIO manages training records for GSA employees and contractors who take basic security
      awareness training. Completion records are kept in GSA OLU. If OLU is not used, spreadsheets are
      used to document training status. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - at-4_smt.b: OLU records are kept for at least three years. Any records kept in Google Sheets are kept for at least
      three years. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-au-1
    name: 'CRM: AU-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for AU-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - au-1_smt.a: 1. The GSA audit and accountability policy is defined in GSA Order CIO 2100.1, “GSA Information
      Technology (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities,
      management commitment, coordination among organizational entities, and compliance
      regarding auditing and accountability for GSA systems. This policy is consistent with applicable
      laws, executive orders, directives, regulations, policies, standards, and guidelines. This policy is
      disseminated GSA-wide via GSA’s InSite centralized agency [Directives website](<REDACTED_URL>).
      1. Audit and accountability procedures are documented in CIO-IT Security-01-08: Audit and
      Accountability (AU). This guide is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - au-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - au-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      1. CIO-IT Security-01-08 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ca-1
    name: 'CRM: CA-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ca-1_smt.a: 1. The GSA security assessment and authorization policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance regarding assessing and authorizing systems for GSA. This policy is consistent with
      applicable laws, executive orders, directives, regulations, policies, standards, and guidelines.
      This policy is disseminated GSA-wide via GSA’s InSite centralized agency [Directives website](<REDACTED_URL>).
      1. Security assessment and authorization procedures are documented in CIO-IT Security-06-30:
      Managing Enterprise Cybersecurity Risk. Additional security and assessment guides for specific
      types of systems have been developed and are referenced in CIO-IT Security-06-30. The
      procedures in these guides facilitate the security assessment and authorization of all GSA
      systems. This guide is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ca-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ca-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      1. CIO-IT Security-06-30 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ca-6
    name: 'CRM: CA-6 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-6 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** AOs, System Owners, ISSOs, and ISSMs are
      responsible for updating their security authorization packages and submitting them to the OCISO in
      accordance with the timelines defined in CIO-IT Security-06-30.

      Statements:
      - ca-6_smt.a: The OCISO issues AO Designation Letters, per Services/Staff Offices and other organizations
      identifying their authorizing official for all GSA information systems. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-6_smt.b: If a platform or system providing controls for other systems is authorized to operate, any common
      controls it is providing are authorized, by the assigned AO per part a. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-6_smt.c: [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy,” and
      [CIO-IT-Security 06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk require AOs to review and approve security
      safeguards of information systems and issue ATO approvals for each information system,
      application, or set of common controls under their purview based on the acceptability of the
      implementation of security safeguards in place (risk-management approach). ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-6_smt.d: CIO 2100.1 and CIO-IT Security 06-30 state that final authority to operate or not operate an
      information system, application, or a set of common controls rests with the AO. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-6_smt.e: CIO 2100.1 and CIO-IT Security-06-30 require authorizations to be updated in accordance with the
      timelines defined in CIO-IT Security-06-30 and GSA’s other A&A process guides. As specified in
      CIO-IT Security-06-30, authorizations are updated at least every three years or upon significant
      changes. Systems in ongoing authorization undergo biannual performance metric monitoring
      which fulfills the update requirement. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ca-7
    name: 'CRM: CA-7 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-7 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners, ISSOs, and ISSMs are
      responsible for monitoring and performing assigned system level metrics in accordance with GSA IT Security
      Policies and procedures as defined by CIO-IT Security-06-30, CIO-IT Security-17-80: Vulnerability
      Management Process, and CIO-IT Security-12-66: Information Security Continuous Monitoring Strategy.

      Statements:
      - ca-7_smt.a: The GSA OCISO developed [CIO-IT Security-12-66](<REDACTED_URL>):
      Information Security Continuous Monitoring Strategy (ISCM) & Ongoing Authorization (OA) Program
      and has established system-level metric monitoring requirements, as defined by
      [CIO-IT Security-08-39](<REDACTED_URL>):
      Management Implementation Plan and CIO-IT Security-12-66. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-7_smt.b: The GSA OCISO has established system-level monitoring and control assessment requirements
      within CIO-IT Security-08-39 and CIO-IT Security-12-66. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-7_smt.c: Systems’ ongoing control assessments are performed based on GSA’s ATO processes defined by
      [CIO-IT Security-06-30](<REDACTED_URL>)
      and CIO-IT Security-12-66 for systems accepted into the OA Program.
      Additionally, the OCISO requires systems to complete an annual FISMA Self-Assessment unless
      they have completed a full assessment in the current FY. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-7_smt.d: The GSA OCISO performs ongoing monitoring of system and organization-defined metrics using
      [automated enterprise management tools and manual processes](<REDACTED_URL>) defined by:

      * CIO-IT Security-06-30: Managing Enterprise Risk
      * CIO-IT Security-08-39: Management Implementation Plan
      * CIO-IT Security-09-44: Plan of Action and Milestones (POA&M)
      * CIO-IT Security-17-80: Vulnerability Management Process
      * CIO-IT Security-18-91: Risk Management Strategy (RMS)
      * CIO-IT Security-19-101: External Information System Monitoring

      System Owners, ISSOs, and ISSMs are responsible for monitoring and performing assigned system
      level metrics in accordance with GSA IT Security Policies and procedures. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-7_smt.e: System-assigned ISSOs and ISSMs record and manage the mitigation and remediation of identified
      weaknesses and deficiencies, not associated with accepted risks, in organizational information
      systems’ POA&M per CIO-IT Security-09-44. System-assigned ISSOs and ISSMs continuously
      perform system-level correlation and analysis of assessment results and system risk monitoring
      activities by performing POA&M management in coordination with System Owners and system
      custodians.

      The GSA OCISO performs POA&M reviews upon completion of an A&A and quarterly thereafter.
      System Level quarterly POA&M Review Reports are generated by the OCSIO and are provided to
      ISSOs for quality reviews and process improvement activities. ISSM Management Reports are
      generated quarterly by the OCISO to provide an agency view of status in correcting weaknesses or
      deficiencies associated with the managed information system portfolio. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-7_smt.f: The GSA OCISO has established and defined system-level response action requirements within:

      * CIO-IT Security-06-30: Managing Enterprise Cybersecurity Risk
      * CIO-IT Security-09-44: Plan of Action and Milestones
      * CIO-IT Security-17-80: Vulnerability Management Process

      System Owners, ISSOs, and ISSMs are responsible for managing system-level risk response
      activities as system risks are identified per monitoring and assessment activities. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ca-7_smt.g: The GSA OCISO has established and defined methods for reporting system-level security and
      privacy status within CIO-IT Security-08-39 and CIO-IT Security-12-66. The OCISO conducts
      quarterly AO/CISO briefings during which systems’ cyber hygiene and operational statuses are
      reported to the AOs.

      System Owners, ISSOs, ISSMs, and system custodians are responsible for reporting system-level
      security and privacy statuses per predefined reporting frequencies and mechanisms (e.g., ISSO
      Checklists, POA&Ms, and ad hoc data calls). ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ca-7-1
    name: 'CRM: CA-7(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-7(1) on GSA Common Controls.
      Unfulfilled requirements:

      The OCISO Policy and Compliance Division (ISP) performs operational oversight of the
      agency’s Information Security Continuous Monitoring (ISCM) strategy and Ongoing
      Authorization (OA) Program. ISP performs assessment activities of the information
      systems accepted into the OA Program, per the program’s monitoring
      and reporting requirements and with impartiality.
  - id: gsa-common-controls-component-definition-crm-ca-7-4
    name: 'CRM: CA-7(4) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-7(4) on GSA Common Controls.
      Unfulfilled requirements:

      The OCISO has established [CIO-IT Security-12-66](<REDACTED_URL>):
      Information Security Continuous Monitoring Strategy (ISCM) & Ongoing Authorization (OA) Program
      that includes effective compliance and risk monitoring policies and procedures defined by
      [CIO-IT Security-06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk. The guidance establishes the agency’s assessment,
      authorization, and monitoring requirements for each managed GSA information system.
      The procedural requirements define the continuous monitoring of system controls and relevant
      documents, or records created by the agency in performing lifecycle management activities; Security
      Assessment Reports (SAPs), Plan of Action and Milestones (POA&Ms), Security, System Security
      and Privacy Plans (SSPPs), and System Assessment Reports (SAR).
  - id: gsa-common-controls-component-definition-crm-ca-8
    name: 'CRM: CA-8 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-8 on GSA Common Controls.
      Unfulfilled requirements:

      For systems in scope per the defined parameter, the GSA OCISO PEN Testing team can provide penetration
      testing in support of GSA information systems’ A&A activities and annually per testing requirements defined by
      CIO-IT Security-06-30: Managing Enterprise Cybersecurity Risk and CIO-IT Security-11-51: Conducting
      Penetration Test Exercises. If the GSA OCISO PEN Testing team is used:

      * This control becomes hybrid between the GSA OCISO PEN Testing team and the system.
      * A Penetration Test Rules of Engagement (RoE) is documented prior to starting testing activities to
      minimize the potential for service disruptions, damage, or loss of system integrity. The RoE outlines the
      responsibilities and limitations of the GSA OCISO PEN Testing team and system personnel throughout
      the testing processes.

      **Federal System-Specific Expectation:** For systems that do not have an applicable
      penetration testing requirement, control CA-8 must be documented as not required in the system’s CA-8
      control response.

      If the GSA OCISO PEN Testing team performs a system’s penetration testing, the System Owner, ISSO, and ISSM
      must coordinate with the OCISO PEN Testing team’s penetration testing services.

      AOs/System Owners may elect to contract an external penetration testing vendor for meeting their system’s
      penetration testing requirements, making the control system specific. The third party must complete the
      minimum requirements set forth by CIO-IT Security-11-51. If the penetration testing is performed by an external
      vendor, the resultant report must reflect the external vendor penetration testing of the system boundary.
  - id: gsa-common-controls-component-definition-crm-ca-8-1
    name: 'CRM: CA-8(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for CA-8(1) on GSA Common Controls.
      Unfulfilled requirements:

      The GSA OCISO Penetration Testing Team performs penetration testing activities on behalf of GSA as an
      independent testing agent. The GSA PEN Testing team is free from any perceived or actual conflicts of interest
      with respect to the development, operation, or management of the systems that are the targets of the
      penetration testing activities performed by the team.

      **Federal System-Specific Expectation:** System Owners, ISSOs, and ISSMs must ensure
      assigned systems’ penetration testing requirements are met. If the system’s penetration testing is performed by
      the OCISO PEN Testing team, CA-8(1) is a Common Control provided by the OCSIO. If penetration testing is
      performed by an external vendor, independence must be documented and accepted. Independence is waived
      for all annual testing (i.e., testing can be internally performed).
  - id: gsa-common-controls-component-definition-crm-cm-1
