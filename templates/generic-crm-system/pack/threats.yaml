  - id: gsa-pages-component-definition-crm-mp-6
    name: 'CRM: MP-6 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for MP-6 on GSA Pages.
      Unfulfilled requirements:

      This System:

      GSA OCISO maintains comprehensive procedures for media sanitization as documented in CIO-IT Security-06-32, "Media Protection Guide." These procedures ensure that all media containing sensitive, proprietary, or classified information is properly sanitized prior to disposal, release, or reuse.

      a. GSA uses the following sanitization methods based on the type of media and classification of information:

      Digital Media:
      - Hard drives and solid-state drives: Secure wiping using NIST-approved methods, degaussing for magnetic media, or physical destruction.
      - Removable media (USB drives, DVDs, etc.): Physical destruction through shredding or pulverizing.
      - Mobile devices: Factory reset combined with crypto-erase when available, or physical destruction.

      Non-Digital Media:
      - Paper documents: Cross-cut shredding or incineration.
      - Microfilm/microfiche: Physical destruction through pulverizing or incineration.

      For media containing classified information, GSA follows NSA-approved methods and standards for sanitization or destruction.

      b. GSA employs sanitization mechanisms commensurate with the security category or classification of the information:
      - For low-impact information: Clearing techniques that overwrite storage space with non-sensitive data.
      - For moderate-impact information: Purging techniques such as multiple-pass overwriting or degaussing.
      - For high-impact or classified information: Destruction through shredding, pulverizing, melting, or incineration.

      All media sanitization activities are documented using either GSA Form 7513 (GSA OCISO Sanitization Validation Form and Certificate of Sanitization) or GSA Form 7514 (Sanitization Certification). These forms require verification signatures from the media custodian, supervisor, or ISSO confirming that proper sanitization procedures were followed.

      GSA maintains records of all media sanitization activities for audit and compliance purposes in accordance with NARA record retention requirements.

        - media-sanitization

