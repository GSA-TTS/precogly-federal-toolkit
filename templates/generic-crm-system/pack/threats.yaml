  - id: gsa-pages-component-definition-crm-cp-10
    name: 'CRM: CP-10 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CP-10 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages has implemented comprehensive system recovery and reconstitution capabilities to restore the system to a known state following disruption, compromise, or failure. The system can be recovered within the Recovery Time Objective (RTO) of 24 hours as defined in the System Contingency Plan.

      Recovery and reconstitution procedures include:

      1. **Initial Response and Assessment:**
         - Activate the contingency plan based on severity of the incident
         - Assess the extent of disruption or compromise
         - Notify key stakeholders according to communication procedures

      2. **Recovery Operations:**
         - Restore website content from the most recent viable backup
         - Redeploy site configurations through the CI/CD pipeline
         - Verify integrity of restored data and configurations
         - Implement any necessary interim capabilities while full restoration is in progress

      3. **Reconstitution Activities:**
         - Perform security validation of restored systems
         - Verify functionality of all system components
         - Test publishing workflows to ensure complete restoration
         - Conduct vulnerability scanning to ensure security posture is maintained
         - Deactivate any temporary capabilities implemented during recovery

      4. **Post-Recovery Actions:**
         - Document the incident and recovery actions taken
         - Assess effectiveness of recovery procedures
         - Identify and implement improvements to recovery processes
         - Update the contingency plan based on lessons learned
         - Reestablish continuous monitoring activities

      The system leverages several features to facilitate rapid recovery:
      - Version-controlled infrastructure as code ensures consistent deployment
      - Automated build and deployment pipelines for consistent reconstitution
      - GitHub's distributed version control system for content resilience
      - Cloud-based infrastructure with built-in redundancy
      - Regular testing of recovery procedures to verify effectiveness

      These capabilities ensure GSA Pages can be recovered and reconstituted to a known secure state within the approved time period.

