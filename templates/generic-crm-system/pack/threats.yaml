    name: 'CRM: CA-5 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CA-5 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages maintains a Plan of Action and Milestones document (POA&M) in accordance with GSA policy. The POA&M is a collaborative document maintained by the system owner, GSA IT Security, and other stakeholders. The document is updated at least monthly, or more frequently when new findings or deficiencies are identified through security control assessments, independent assessments, or continuous monitoring activities.

