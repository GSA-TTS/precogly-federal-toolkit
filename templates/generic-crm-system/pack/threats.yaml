      but are not limited to the United States Computer Emergency Readiness Team (US-CERT), National
      Institute of Standards and Technology (NIST), Office of Management and Budget (OMB), Product
      Vendors, and Industry Advisors. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
