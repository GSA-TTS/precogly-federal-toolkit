    name: 'CRM: IA-2(12) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for IA-2(12) on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages integrates with GSA's identity and access management systems to support and accept PIV credentials. The implementation includes:

      1. **GSAauth Integration:**
         - GSA staff authenticate to GitHub and cloud.gov Pages via GSA's GSAauth implementation
         - GSAauth accepts and electronically verifies PIV credentials for GSA staff members
         - The authentication flow validates PIV certificates against GSA's certificate authority
         - Certificate validation includes checks for revocation status and expiration

      2. **Cloud.gov UAA Integration:**
         - Cloud.gov Pages leverages cloud.gov's UAA for authentication
         - UAA supports PIV authentication through its integration with agency identity providers
         - PIV credential verification follows NIST SP 800-157 guidelines

      3. **Technical Validation:**
         - PIV certificates are validated through the federal PKI trust chain
         - Certificate validation includes verification of the digital signature
         - The system checks certificate revocation status using OCSP or CRLs
         - Authentication fails if the PIV credential is expired, revoked, or invalid

      The system supports PIV credentials as a primary authentication method for GSA staff, promoting strong authentication practices across the organization. For contractors and agency partners without PIV cards, strong multi-factor authentication is still enforced through alternative authentication methods like TOTP or security keys.

