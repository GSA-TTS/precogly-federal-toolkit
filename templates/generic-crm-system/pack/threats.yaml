      wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ia-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ia-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      1. CIO-IT Security-01-01 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ir-1
    name: 'CRM: IR-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ir-1_smt.a: 1. The GSA incident response policy is defined in GSA Order CIO 2100.1, “GSA Information
      Technology (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities,
      management commitment, coordination among organizational entities, and compliance
      regarding incident response for GSA systems. This policy is disseminated GSA-wide via GSA’s
      InSite centralized agency
      [Directives website](<REDACTED_URL>).
      1. Incident response procedures are documented in CIO-IT Security-01-02: Incident Response. The
      procedures facilitate implementation of the incident response policy and associated controls.
      This guide is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ir-1_smt.b: 1. The GSA OCISO is responsible for reviewing and updating CIO 2100.1 annually.
      1. The GSA OCISO is responsible for reviewing and updating CIO-IT Security 01-02 biennially. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ir-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      1. CIO-IT Security-01-02 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ir-2
    name: 'CRM: IR-2 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-2 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners are responsible for ensuring
      personnel assigned to an incident response role per their System or Service and Staff Office (SSO) IR
      Plan are trained within 60 days of assuming their role; following changes to the system or GSA IR
      Plan, when required; and annually thereafter.

      Statements:
      - ir-2_smt.a: GSA has implemented an agency-wide incident response program with formal policies, procedural
      guidelines, and supporting processes managed by the OCISO. Incident Reporting Training is
      implemented as a Hybrid security control with each GSA managed system, per the Incident Response
      training documented by
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR), also known as the “GSA IR Plan.”

      GSA Incident Response Training is provided to GSA personnel who are provisioned with a GSA ENT
      account. Each is required to complete their initial GSA IT Security & Privacy Awareness Training
      within 60 days of account provisioning and annually thereafter.

      The OCISO provides incident response training to members of the GSA Incident Response Team
      within 60 days of onboarding; following changes to the GSA IR Plan, when required; and annually
      thereafter.

      **OCISO Planned Control:** The OCISO is to create and manage GSA IR training curriculum for System
      Owner and personnel delegated to an information system or Service and Staff Office (SSO) incident
      response role. The plan is to require assigned personnel to complete the GSA IR training within 60
      days of IR role assignment; following changes to the GSA IR Plan, when required; and annually
      thereafter. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-2_smt.b: The OCISO reviews and updates the agency’s incident response training content annually and
      following any significant incidents as determined by the GSA Incident Response team. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ir-2-3
    name: 'CRM: IR-2(3) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-2(3) on GSA Common Controls.
      Unfulfilled requirements:

      GSA has implemented an agency-wide incident response program with formal policies, procedural guidelines,
      and supporting processes managed by the OCISO. Incident Response Training specifically for identifying and
      responding to data breaches (i.e., loss of control, compromise, unauthorized disclosure, unauthorized
      acquisition, unauthorized access, or any similar term referring to situations where persons other than
      authorized users with an authorized purpose have access or potential access to Personally Identifiable
      Information (PII), whether physical or electronic) is implemented as a Common control with each GSA managed
      information system, per the Incident Response Training documented by
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR), also known as the “GSA IR Plan.”
  - id: gsa-common-controls-component-definition-crm-ir-3
    name: 'CRM: IR-3 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-3 on GSA Common Controls.
      Unfulfilled requirements:

      Incident Response Testing is implemented as a Hybrid control with each GSA managed information
      system. The GSA Incident Response Plan,
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR), is tested annually by the OCISO following the processes documented by
      [NIST SP 800-61 Revision 2](<REDACTED_URL>),
      “Computer Security Incident Handling Guide,” and
      [NIST SP 800-84](<REDACTED_URL>),
      “Guide to Test, Training, and Exercise Programs for IT Plans and Capabilities.”

      Each GSA Service and Staff Office (SSO) or information system must be covered by a documented and
      tested incident handling process addressing Tier 1 and Tier 2 incident response requirements for
      the systems under their jurisdiction, per the GSA Incident Response Plan.

      **OCISO Planned Control:** The OCISO will provide updated Incident Response Testing guidance
      applicable to Service and Staff Office (SSO) or information systems within CIO-IT Security-01-02.

      **Federal System-Specific Expectation:** GSA information systems classified as either
      Federal Information Processing Standard 199 Moderate or High-impact must perform annual IR testing in
      agreement with GSA Order
      [CIO 2100.1](<REDACTED_URL>),
      “GSA Information Technology (IT) Security Policy,” the Federal Information Security Modernization Act
      of 2014, CIO- IT Security-01-02, and NIST 800-61, Revision 2, to assess IR effectiveness and document
      the results of the test in accordance with the control requirements.
  - id: gsa-common-controls-component-definition-crm-ir-3-2
    name: 'CRM: IR-3(2) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-3(2) on GSA Common Controls.
      Unfulfilled requirements:

      Organizational plans related to incident response testing include, for example, Business Continuity
      Plans, Contingency Plans, Disaster Recovery Plans, Continuity of Operations Plans, Crisis
      Communications Plans, Critical Infrastructure Plans, and Occupant Emergency Plans; for details, refer
      to [CIO-IT Security-06-29](<REDACTED_URL>):
      Contingency Planning (CP).

      OCISO tests the GSA Incident Response Plan--
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR)--biannually following the process documented in
      [NIST SP 800-61 Revision 2](<REDACTED_URL>),
      “Computer Security Incident Handling Guide,” and
      [NIST SP 800-84](<REDACTED_URL>),
      “Guide to Test, Training, and Exercise Programs for IT Plans and Capabilities.”.

      **Federal System-Specific Expectation:** FIPS 199 Moderate and High impact information
      systems must perform annual incident response testing in agreement with CIO-IT Security-01-02.
      GSA Service and Staff Office (SSO) or information system incident response testing should be
      coordinated with the GSA Incident Response Team (<POC_EMAIL>) to ensure end-to-end reporting
      and response action. System level testing can be included as a scenario in the system’s annual
      contingency plan test. Additional integration of the system’s IR testing with other organizational
      or system plans is a system specific consideration.
  - id: gsa-common-controls-component-definition-crm-ir-4
    name: 'CRM: IR-4 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-4 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners are responsible for ensuring
      assigned systems are aligned with either a system-specific or Service Staff Office (SSO) Tier 1
      and 2 Incident Response Plan aligned with Incident Handling and Reporting requirements in CIO-IT
      Security-01-02. System Owners and ISSOs are required to coordinate system-level incident handling
      activities with contingency planning activities and incorporate lessons learned from ongoing
      incident handling activities into incident response procedures, training, and testing/exercises,
      and implement the resulting changes accordingly.

      Statements:
      - ir-4_smt.a: GSA has implemented an agency-wide incident response program with formal policies, procedural
      guidelines, and supporting processes managed by the OCISO. The Incident Handling control
      requirements are implemented as a hybrid control with each GSA managed information system per
      the Incident Response processes, documented by
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR) also known as the “GSA IR Plan.”

      System Owners are responsible for ensuring assigned systems are aligned with either a system-
      specific or Service Staff Office (SSO) Tier 1 and 2 Incident Response Plan that is aligned with
      Incident Handling and Reporting requirements in CIO-IT Security-01-02. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-4_smt.b: The GSA IR Plan is consistent with
      [NIST SP 800-61 Revision 2](<REDACTED_URL>),
      “Computer Security Incident Handling Guide.” The supporting incident response process is performed
      on a “Tiered” basis, including Tier 1 through Tier 3, and is fully defined in section 4 of
      CIO-IT Security-01-02. Key tasks in the Tiers are summarized below:

      * Tier 1 – Observe event/incident, open ticket in ServiceNow, provide data to IR Team, and
      stabilize the system.
      * Tier 2 – Determine seriousness of threat, verify notification and reporting, coordinate with
      Tier 1, collect data, isolate systems as necessary, support Tier 3, and remediate and restore.
      * Tier 3 – Direct data collection, lead response team, conduct detailed technical analysis,
      prepare, and submit reports. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-4_smt.c: For serious incidents or those in which problems in response were identified; an OCISO Lessons
      Learned meeting is conducted where the incident is reviewed to identify necessary improvements
      including people, process, and technology. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-4_smt.d: The OCSIO Incident Response Team, in coordination with the CISO, regularly reviews GSA’s Incident
      Handling activities performed throughout the incident period. Process improvements and
      identification of inefficiencies in the agency’s incident detection, handling, and reporting is
      performed continuously. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ir-4-1
    name: 'CRM: IR-4(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-4(1) on GSA Common Controls.
      Unfulfilled requirements:

      All incident information generated as part of response activities is maintained by the Incident
      Response Team in ServiceNow. Additional automated mechanisms supporting GSA’s incident handling
      processes include:

      **Incident Handling Tools:**

      The GSA Incident Response Team utilizes several automated tools and services that are used to assist
      in incident handling, including:

      * _Enterprise Logging Platform_ - The SIEM Tool that collects and correlates event log data from network devices across the network, including Firewalls, IDP/IPS devices, Web Proxies, and Wireless Access Points.
      * _FireEye Endpoint Security (HX series)_ - An endpoint-based solution that allows security analysts to conduct detailed investigations to identify and contain Indicators of Compromise (IOC) related to APT malware.
      * _Bit9_ - Deployed as an application whitelisting solution that identifies executables on GSA workstations/servers in a central repository for investigation into whether malware was executed on a device.
      * _Palo Alto Wildfire_ - Cloud-based malware detection service which performs static and dynamic analysis of binary executables ingressing the GSA network. Alerts on detection of malware.
      * _MaaS360_ - Software management tool that GSA uses to deploy and inventory software on workstations and mobile devices.
      * _FireEye Managed Defense Portal_ - Allows for access to alerts from FireEye regarding threats.
      * _CenturyLink Portal_ - Allows for access to alerts from the CenturyLink Security Operations Center.
      * _FireEye Intelligence_ - Allows for access to FireEye (formerly iSIGHT Partners) Vulnerability and Threat Reports.

      **Forensic Tool Sources:**

      GSA OCISO uses a combination of commercial and open-source tools to capture cyber-forensic evidence
      as part of a Tier 3 investigation. Detailed forensics investigations are also supported by several
      additional commercial off the shelf (COTS) and open-source tools, including, but not limited to,
      the following:

      * Mobile Forensics Tools
      * _Katana Forensics Lantern_ - Allows image acquisition for mobile devices, specializing in iOS.
      * _viaForensics viaExtract_ - Provides forensic capabilities for Android devices, including image acquisition.
      * General Forensics
      * _FTK Forensic Toolkit_ - Provides the ability to conduct detailed forensic investigations on various platforms, such as hard drives, mobile devices, network data, and internet storage.
      * _EnCase Forensic Imager_ - Provides the ability to acquire forensic images from local disks.
      * Live Response Forensics
      * _FireEye Memoryze_ - Provides ability to acquire and/or analyze memory images, and on live systems, can include the paging file in its analysis.
  - id: gsa-common-controls-component-definition-crm-ir-5
    name: 'CRM: IR-5 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-5 on GSA Common Controls.
      Unfulfilled requirements:

      The OCISO manages the GSA Incident Response Team, which is responsible for tracking all security
      incidents for GSA IT systems (including vendor-owned and -operated systems) reported to the OCISO.
      Incident reports include (as applicable) the status of the incident and any pertinent information
      gathered as part of the overall response process, including but not limited to vulnerability
      details, system information, and forensics evidence.

      Incident information generated as part of response activities is maintained in ServiceNow and
      centrally managed by the Incident Response Team, which coordinates the overall response
      including required reporting to United States Computer Emergency Readiness Team (US-CERT).
  - id: gsa-common-controls-component-definition-crm-ir-6
    name: 'CRM: IR-6 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-6 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners, ISSOs, ISSMs, and system
      custodians are responsible for reporting incidents in accordance with CIO-IT Security-01-02.

      Statements:
      - ir-6_smt.a: GSA has implemented an agency-wide incident response program with formal policies, procedural
      guidelines, and supporting processes managed by the OCISO Security Operations Division (ISO).
      Incident Reporting is implemented as hybrid security control with each GSA managed information
      system per the Incident Response processes, including “How to Report IT Security Incidents” as
      documented in
      [CIO-IT Security-01-02](<REDACTED_URL>): Incident Response (IR).

      The OCISO follows the United States Computer Emergency Readiness Team (US-CERT) Federal
      Incident Reporting Guidelines. These guidelines require agencies to report information security
      incidents, in which the confidentiality, integrity, or availability of a federal information system
      of a civilian Executive Branch agency is potentially compromised, to the National Cybersecurity and
      Communications Integration Center/US-CERT with the required data elements, as well as any other
      available information, within one hour of being identified by the agency’s top-level Computer
      Security Incident Response Team (CSIRT), Security Operations Center (SOC), or information
      technology department. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-6_smt.b: Time is critical. GSA personnel are advised to report incidents to the GSA IT Service Desk immediately
      upon incident identification. After normal business hours, on-call IR support is available
      at 202-501-0980 and the GSA Incident Response team can also be contacted at <POC_EMAIL>. If there
      is no immediate response during business hours, contact the SecOps on-call personnel. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ir-6-1
    name: 'CRM: IR-6(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-6(1) on GSA Common Controls.
      Unfulfilled requirements:

      All GSA IT security incidents are to be reported to the GSA OCISO consistent with the reporting
      requirements described in
      [CIO-IT Security-01-02](<REDACTED_URL>): Incident Response (IR).

      The OCISO provides incident response coordination for all incidents involving GSA systems by
      leveraging GSA’s automated ticketing system ServiceNow. The first line of support is provided by
      the GSA IT Service Desk when an incident is reported and then documented within a ServiceNow incident
      ticket. ServiceNow IR tickets are distributed to OCISO Incident Response personnel to initiate
      incident response and coordinate incident communications. OCISO staff can open ServiceNow IR incident
      tickets upon discovery or upon receiving a report of an incident.
  - id: gsa-common-controls-component-definition-crm-ir-6-3
    name: 'CRM: IR-6(3) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-6(3) on GSA Common Controls.
      Unfulfilled requirements:

      The GSA OCISO has established a Cyber Supply Chain Risk Management (C-SCRM) Program within the
      Identity, Credential, Access Management (ICAM) Shared Services Division (ISI) for any IT security
      incident that involves a potential compromise of the supply chain for a provider of a product or
      service utilized by GSA. The incident information is forwarded to the Shared Services Division (ISI)
      (<POC_EMAIL>). ISI coordinates with the Incident Response Team and ensures all relevant
      incident information is shared with entities within or outside of GSA, as required.
  - id: gsa-common-controls-component-definition-crm-ir-7
    name: 'CRM: IR-7 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-7 on GSA Common Controls.
      Unfulfilled requirements:

      The GSA OCSIO Incident Response Team provides Tier 3 support in response to reported security
      incidents as a common IT Security support service to all GSA managed systems. The first line of
      support is provided through the GSA IT Service Desk when an incident is initially reported.

      The GSA OCISO staffs a 24x7x365 Security Operations Center (SOC) that provides Incident Response (IR)
      support for Tier 3 incident handling. The OCISO Tier 3 Response Team is trained in Security Incident
      Response and Forensic Investigation services. The Tier 3 Response Team coordinates all agency
      incident response investigations with the affected System Owner, ISSO, ISSM, and designated system
      custodians throughout the investigation and response period of the incident. The Tier 3 Response Team
      approves all remedial and return to service actions in consultation with the OCISO. Additional System
      Owner and end user incident response assistance is provided by the OCISO on a case-by-case basis.

      All IT security incidents are to be reported to the GSA OCISO consistent with the reporting
      requirements described within
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR). The OCISO provides incident response coordination for all incidents involving
      GSA IT systems regardless of ownership (internal or external) with GSA management, United States
      Computer Emergency Readiness Team (US-CERT), external law enforcement, and the GSA Inspector General.

      **Federal System-Specific Expectation:** System Owners are responsible for providing
      system supporting resources during an Incident Response investigation when needed.
  - id: gsa-common-controls-component-definition-crm-ir-7-1
    name: 'CRM: IR-7(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-7(1) on GSA Common Controls.
      Unfulfilled requirements:

      All GSA IT security incidents are to be reported to the GSA OCISO consistent with the reporting
      requirements described within
      [CIO-IT Security-01-02](<REDACTED_URL>): Incident Response (IR).

      The OCISO provides incident response coordination for all incidents involving GSA systems by
      leveraging GSA’s automated ticketing system ServiceNow. When an incident is reported, the first line
      of support is provided through the GSA IT Service and documented within a ServiceNow incident ticket.
      ServiceNow IR tickets are distributed to OCISO Incident Response personnel for initiating incident
      response and coordinating incident communications. GSA maintains an Agency System Inventory that
      includes Authorizing Official, System Owner, ISSO, and ISSM
      [points of contacts per Federal Information Security Modernization Act system](<REDACTED_URL>).
      The inventory data is made available to the GSA Incident Response Team for coordinating
      communications per systems affected by a security threat or incident. Additionally, the GSA Incident
      Response Team can submit GSA IR data to the Department of Homeland Security (DHS)/CISO leveraging
      ServiceNow reporting capabilities and for requesting additional incident support if needed.
  - id: gsa-common-controls-component-definition-crm-ir-8
    name: 'CRM: IR-8 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-8 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** GSA IT systems must have or align to a system-
      specific incident response plan that detail their incident response activities and reporting
      requirements to GSA consistent with CIO-IT Security-01-02. Each may be covered by a GSA Service and
      Staff Office (SSO) IR Plan that addresses Tier 1 and Tier 2 incident response requirements for the
      systems under their jurisdiction, per the GSA Incident Response Plan, CIO-IT Security-01-02.

      Statements:
      - ir-8_smt.a: Incident Response Plan is implemented as a Hybrid control with each GSA managed information
      system. The GSA Incident Response Plan,
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR)- is managed by the OCISO GSA IR Team.

      Each GSA Service and Staff Office (SSO) or information system must be covered by a documented IR
      Plan addressing Tier 1 and Tier 2 incident response requirements for the systems under their
      jurisdiction, per the GSA Incident Response Plan.

      The GSA IR Plan (CIO-IT Security-01-02):
      1. Provides the organization with a roadmap for implementing its incident response capability;
      2. Describes the structure and organization of the incident response capability;
      3. Provides a high-level approach for how the incident response capability fits into the overall organization;
      4. Meets the unique requirements of the organization, which relate to mission, size, structure, and functions;
      5. Defines reportable incidents;
      6. Provides metrics for measuring the incident response capability within the organization;
      7. Defines the resources and management support needed to effectively maintain and mature an incident response capability;
      8. Addresses the sharing of incident information;
      9. Is reviewed and approved by CISO annually; and
      10. Explicitly designates responsibility for incident response to the GSA Incident Response Team.

      **OCISO Planned Control:** The OCISO will provide updated IR Plan documentation guidance applicable
      to Service and Staff Office (SSO) or information systems within CIO-IT Security-01-02. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-8_smt.b: The GSA Incident Response Plan is distributed to all GSA IT staff with significant IT security
      responsibilities and is available to all GSA staff via the
      [IT Security Procedural Guides](<REDACTED_URL>) InSite page. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-8_smt.c: The GSA Incident Response Plan is updated following each incident response test as needed. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-8_smt.d: The GSA Incident Response plan is updated to address system/organizational changes or problems
      encountered during plan implementation, execution, or testing. Updates to the GSA Incident
      Response plan are communicated to GSA AOs, ISSMs, ISSOs, System Owners, and the CISO. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ir-8_smt.e: The GSA Incident Response Plan (i.e., the Incident Response guide) is disclosed as necessary, it is
      protected from modification by being a signed PDF document, any editing of the document would
      void the signature. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ir-8-1
    name: 'CRM: IR-8(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IR-8(1) on GSA Common Controls.
      Unfulfilled requirements:

      The GSA OCISO Incident Response (IR) Plan’s Breaches incident reporting procedures are provided as a
      Common Control to all GSA managed information systems that leverage the OCISO’s Incident Response
      reporting authority.
      [CIO-IT Security-01-02](<REDACTED_URL>):
      Incident Response (IR) describes the operational processes the OCISO IR Team and Privacy Office
      (Initial Agency Response Team [IART] and Full Response Team [FRT]) initiate upon identification of
      an incident involving GSA managed PII data.

      [GSA Order CIO 9297.2](<REDACTED_URL>),
      “GSA Information Breach Notification Policy” describes the processes the Initial Agency Response Team
      (IART) follows when it is appropriate to notify potentially affected individuals or an organization
      of any breaches that involve their PII data. The IR Plan includes GSA’s Methodology for Assessing the
      Risk of Harm to determine the extent of the harm when breaches occur. It also describes how guidance
      is provided to Mitigating Risk of Harm and includes reference to the GSA Privacy Office requirements
      and the Privacy Act.

      **Federal System-Specific Expectation:** System Owners are responsible for ensuring all
      system incidents are reported following OCISO incident reporting procedures. For systems that process
      or store PII data, System Owners are responsible for ensuring that the system’s Personally
      Identifiable Information Processing and Transparency (PT control family) documentation requirements
      are maintained and kept current in support of GSA’s IR Breach Notification procedures.
  - id: gsa-common-controls-component-definition-crm-ma-1
    name: 'CRM: MA-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for MA-1 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** None, common control. However, GSA SSOs or System Owners may
      augment the maintenance policies and procedures included in 2100.1 and CIO-IT Security-10-50 to
      address additional organizational or system-specific maintenance requirements. Any such policies and
      procedures must establish timeframes for updating them.

      Statements:
      - ma-1_smt.a: 1. The GSA maintenance policy is defined in GSA Order CIO 2100.1, “GSA Information Technology
      (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities, management
      commitment, coordination among organizational entities, and compliance regarding the
      maintenance of GSA systems. This policy is consistent with applicable laws, executive orders,
      directives, regulations, policies, standards, and guidelines. This policy is disseminated GSA-wide
      via GSA’s InSite centralized agency
      [Directives website](<REDACTED_URL>).
      2. Maintenance procedures are documented in CIO-IT Security-10-50: Maintenance (MA). The
      procedures facilitate the implementation of the maintenance policy and associated controls. This
      guide is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ma-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ma-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or guidance.
      2. CIO-IT Security-10-50 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-mp-1
    name: 'CRM: MP-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for MP-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - mp-1_smt.a: 1. The GSA media protection policy is defined in GSA Order CIO 2100.1, “GSA Information
      Technology (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities,
      management commitment, coordination among organizational entities, and compliance
      regarding the media protection for GSA systems. This policy is consistent with applicable laws,
      executive orders, directives, regulations, policies, standards, and guidelines. This policy is
      disseminated GSA-wide via GSA’s InSite centralized agency
      [Directives website](<REDACTED_URL>).
      2. Media protection procedures are documented in CIO-IT Security-06-32: Media Protection (MP)
      The procedures facilitate the implementation of the media protection policy and associated
      controls. This guide is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - mp-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - mp-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. CIO-IT Security-06-32 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-mp-7
    name: 'CRM: MP-7 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for MP-7 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners or Services/Staff Offices that
      manage physical IT assets. Must define and manage Safeguards used to restrict access and the ability
      to use digital storage devices.

      Statements:
      - mp-7_smt.a: GSA Order [CIO 2100.1](<REDACTED_URL>),
      “GSA Information Technology (IT) Security Policy,” and
      [CIO-IT Security-06-32](<REDACTED_URL>):
      Media Protection state that GSA restricts the use of digital storage devices to devices
      provided by GSA or provided by organizations approved by GSA on GSA information systems. The
      use of portable storage devices when such devices have no identifiable owner is prohibited.
      Restrict access to information system media (e.g., disk drives, diskettes, internal and external
      hard drives, and portable devices), including backup media, removable media, and media
      containing sensitive information to authorized individuals.

      Safeguards used to restrict such access are left to System Owners or Services/Staff Offices to
      define and must be approved by the AO and CISO. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - mp-7_smt.b: CIO 2100.1 and CIO-IT Security-06-32 state that GSA restricts the use of digital storage devices to
      devices provided by GSA or provided by organizations approved by GSA on GSA information
      systems. The use of portable storage devices when such devices have no identifiable owner is
      prohibited. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pe-1
    name: 'CRM: PE-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PE-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pe-1_smt.a: 1. The GSA physical and environmental protection policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance regarding the physical and environmental protection for GSA systems. This policy is
      consistent with applicable laws, executive orders, directives, regulations, policies, standards, and
      guidelines. This policy is disseminated GSA-wide via GSA’s InSite centralized agency
      [Directives website](<REDACTED_URL>).
      2. Media protection procedures are documented in CIO-IT Security-12-64: Physical and
      Environmental Protection (PE). The procedures facilitate the implementation of the physical and
      environmental protection policy and associated controls. This guide is disseminated GSA-wide
      via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pe-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pe-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. CIO-IT Security-12-64 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pl-1
    name: 'CRM: PL-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pl-1_smt.a: 1. The GSA security planning policy is defined in GSA Order CIO 2100.1, “GSA Information
      Technology (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities,
      management commitment, coordination among organizational entities, and compliance
      regarding the security planning for GSA systems. This policy is consistent with applicable laws,
      executive orders, directives, regulations, policies, standards, and guidelines. This policy is
      disseminated GSA-wide via GSA’s InSite centralized agency
      [Directives website](<REDACTED_URL>).
      2. Planning procedures are documented in CIO-IT Security-06-30: Managing Enterprise
      Cybersecurity Risk. The procedures facilitate the implementation of the security planning policy
      and associated controls. This guide is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pl-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pl-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or guidance.
      2. CIO-IT Security-06-30 every three years and following changes to Federal or GSA policies, requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pl-10
    name: 'CRM: PL-10 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-10 on GSA Common Controls.
      Unfulfilled requirements:

      A system’s FIPS 199 security categorization and Privacy Threshold Analysis (PTA) determines the initial set of
      NIST SP 800-53 control requirements an information system must implement. GSA’s baseline selection process,
      “Identifying Appropriate ATU or ATO Process” is defined within [CIO-IT Security-06-30](<REDACTED_URL>): Managing Enterprise Cybersecurity Risk.

      **Federal System-Specific Expectation:** System Owners, Data Owners, ISSOs, and ISSMs
      must first document the system’s FIPS 199 and PTA prior to the baseline selection determination. The System
      Owner collaborates with the AO, ISSM, ISSO, and Privacy Team as necessary to complete the control baseline
      selection.
  - id: gsa-common-controls-component-definition-crm-pl-11
    name: 'CRM: PL-11 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-11 on GSA Common Controls.
      Unfulfilled requirements:

      Once the security control baseline for a system is selected, tailoring of those controls commences. A system’s
      Baseline Tailoring tasks include:

      * Determining the common controls the system inherits;
      * Assigning values to any parameters identified as being left up to the system for assignment and
      requiring GSA AO and CISO approval;
      * Determining if any compensating or supplemental controls are required to address unique
      organizational and/or system specific needs. These needs may be based on a risk assessment (either
      formal or informal), local conditions including environment of operation, organization-specific security
      requirements, specific threat information, cost-benefit analyses, or special circumstances.

      System specific justifications or rationale for tailoring actions is required, especially where the CISO and AO
      must approve assignments and if any controls are identified as not applicable to the system or its environment.

      System teams must complete a [Control Tailoring Workbook](<INTERNAL_GOOGLE_DOC>) (CTW) and provide it as an attachment to the SSPP.
      The CTW identifies the GSA defined values for [NIST SP 800-53](<REDACTED_URL>) control assignments and selections. The selected
      security controls, including all controls or enhancements selected above the baseline for the information
      system, are documented in the SSPP. Both the SSPP and the CTW identify parameter assignments or selections
      deferred to the SSO or contractor for recommendation and approval by the GSA AO and CISO. The CTW
      contains columns for identifying the defined values and GSA approval of the values.

      **Federal System-Specific Expectation:** System Owners are to collaborate with the ISSM,
      ISSO, Privacy Team as necessary, and other System Owners (regarding common/hybrid controls) to complete
      their assigned system’s control tailoring requirements.
  - id: gsa-common-controls-component-definition-crm-pl-4
    name: 'CRM: PL-4 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-4 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** If a managed system does not have system
      specific or unique Rules of Behavior (RoB) requirements, the System Owner may leverage the OCISO PL-4
      control response as a Common Control.

      If a managed system has specific or unique RoB requirements identified, the System Owner is responsible for
      ensuring the unique RoB are documented and are acknowledged in conjunction with GSA’s RoB for meeting the
      system’s specific access and usage requirements, making the control Hybrid. Additional system-specific portions
      of the control are reviewing and updating the system’s unique RoB and documenting of individual
      acknowledgment of them (refer to PS-6 guidance).

      Statements:
      - pl-4_smt.a: GSA has developed the GSA IT Rules of Behavior for General Users as indicated in
      [CIO-IT Security-05-29](<REDACTED_URL>):
      Security and Privacy Awareness and Role Based Training Program. The rules describe a user’s
      responsibilities and expected behavior when using GSA information systems. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pl-4_smt.b: All GSA IT users must sign the GSA IT General Rules of Behavior for General Users within 90 days of
      their entry on duty (EoD). GSA does not require the rules be signed before accessing an information
      system. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pl-4_smt.c: GSA OCISO reviews and updates the GSA IT Rules of Behavior for General Users annually. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pl-4_smt.d: All GSA IT users are required to re-sign the GSA IT Rules of Behavior for General Users annually as
      part of GSA’s annual IT Security and Privacy Awareness training. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pl-4-1
    name: 'CRM: PL-4(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-4(1) on GSA Common Controls.
      Unfulfilled requirements:

      [GSA Order CIO 2104.1](<REDACTED_URL>),
      “GSA Information Technology (IT) General Rules of Behavior,” includes restrictions on
      the use of social media, social networking, and external sites; guidance on posting organizational information on
      public websites; and the use of organization-provided identifiers and authentication secrets external
      sites/applications.
  - id: gsa-common-controls-component-definition-crm-pl-8
    name: 'CRM: PL-8 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-8 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal-Specific Expectation:** System Owners, ISSOs, and ISSMs are responsible for
      ensuring their system architectures are submitted for gaining initial Security and Privacy architectural approval
      and when significant changes to a system’s architecture are planned. System Owners are responsible for ensuring
      all security architecture changes are reflected in their System Security and Privacy Plan (SSPP), Concept of
      Operations (CONOPS), criticality analysis, and organizational procedures and procurements/acquisitions (as
      applicable and/or annually, as part of the system’s annual SSPP review/update processing).

      Statements:
      - pl-8_smt.a: 1. [CIO-IT Security-19-95](<REDACTED_URL>): Security Engineering Architecture Reviews describes GSA’s processes for ensuring systems are built in accordance with the Security Engineering Framework to ensure security architectures meet GSA’s security requirements and protect GSA systems and data.
      2. CIO-IT Security-19-95 includes checklist items that ensure a system’s security architecture aligns with GSA’s Enterprise Architecture and its approved IT standards and identifies how non-IT standards can be proposed for inclusion.
      3. CIO-IT Security-19-95 includes checklist items regarding the use of external services, systems, and interconnections to GSA. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pl-8_smt.b: CIO-IT Security-19-95 describes the process to support utilization of new and emergent technologies
      or when systems undergo major architectural changes to ensure such systems are designed and built or
      continue to be secure. The system ISSO has the responsibility to notify the ISE Division when
      changes occur and, as part of the system’s annual SSPP annual update, consider if any changes have
      occurred that require architectural review. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pl-8_smt.c: System Owners are responsible for ensuring all security architecture changes are reflected in their
      System Security and Privacy Plan (SSPP), Concept of Operations (CONOPS), criticality analysis, and
      organizational procedures and procurements/acquisitions (as applicable and/or annually, as part of
      the system’s annual SSPP review/update processing). ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pl-9
    name: 'CRM: PL-9 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PL-9 on GSA Common Controls.
      Unfulfilled requirements:

      The GSA OCISO and Privacy Office provide the Central Management control requirement as a Common Control
      to all GSA managed information systems that leverage GSA IT management services. The centrally managed GSA
      IT common and hybrid security and privacy controls are communicated and documented by
      [CIO-IT Security-Privacy-18-90](<REDACTED_URL>): Common Control Catalog (CCC).

      **Federal System-Specific Expectation:** System Owners, ISSOs, and ISSMs are to leverage
      the common and hybrid security and privacy controls documented within CIO-IT Security-Privacy-18-90 when
      performing Baseline Tailoring of their System Security and Privacy Plans (SSPP).
  - id: gsa-common-controls-component-definition-crm-pm-1
    name: 'CRM: PM-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-1_smt.a: The OCISO developed CIO-IT Security-Privacy-18-90: Common Control Catalog (CCC) to address the
      following requirements. The CCC is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>).

      1. GSA’s CCC provides implementation details or refers to a separate system/capability that
      provides the details, for common and hybrid controls, including program management controls,
      provided at the enterprise level.
      2. The roles, responsibilities, management commitment, coordination among organizational
      entities, and compliance for the common and hybrid controls with an enterprise component are
      either defined in the procedural guide referenced in the control’s “-1” control or included in the
      implementation details of the referenced guide or the control implementation.
      3. The control implementation details are coordinated with other organizational entities
      responsible for them either as part of the development of the CCC or development of the
      various procedural guides referred to in the “-1” controls for each control family.
      4. The plan is approved by the CISO and is designed to give clear direction as to which GSA division
      or organization is responsible for implementation of the control. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-1_smt.b: The GSA OCISO is responsible for reviewing and updating CIO-IT Security-Privacy-18-90 every three
      years and following changes to Federal or GSA policies, requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-1_smt.c: This guide is only disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>).
      It is protected from modification by being a signed PDF document, any editing of the
      document would void the signature. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-10
    name: 'CRM: PM-10 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-10 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-10_smt.a: The GSA OCISO IST and ISP Divisions manage the security and privacy state of all GSA information
      systems using the security authorization processes described in
      [GSA Order CIO 2100.1](<REDACTED_URL>),
      “GSA Information Technology (IT) Security Policy” and
      [CIO-IT Security-06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk and other authorization process guides identified therein. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-10_smt.b: [CIO-IT Security-18-91](<REDACTED_URL>):
      Risk Management Strategy (RMS), CIO 2100.1, and CIO-IT Security-06-30, designate individual roles and responsibilities within the organizational risk management process. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-10_smt.c: CIO-IT Security-18-91 and CIO-IT Security-06-30 describe how GSA’s security authorization processes
      are integrated into GSA’s risk management program. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-11
    name: 'CRM: PM-11 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-11 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-11_smt.a: All GSA Service and Staff Offices (SSOs) have a defined mission. Each SSO further defines business
      processes supporting the SSO mission. [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT)
      Security Policy” and [CIO-IT Security-06-30](<REDACTED_URL>): Managing Enterprise Cybersecurity Risk and other
      authorization process guides identified therein, require information security and privacy to be
      considered as information systems are used to support GSA’s missions and business processes.
      Additionally, GSA has defined 16 Mission Essential functions (MEFs) and Essential Supporting
      Activities (ESAs) across GSA SSOs. More information on GSA MEFs is available in
      [GSA Order ADM 2430.2](<REDACTED_URL>), “The U.S. General Services Administration Continuity of Operations Mission Essential
      Functions.” ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-11_smt.b: As part of the processes described in CIO-IT Security-06-30, the mission/business process of systems
      is documented in System Security and Privacy Plans (SSPPs). Included within SSPPs is the FIPS 199
      security categorization of the system, which along with the specific A&A process the system is
      following, results in a set of security and privacy controls required to achieve the system’s protection
      needs. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-11_smt.c: The GSA Office of Mission Assurance (OMA), per ADM 2430.2, reviews GSA Mission Essential
      Functions (MEF) and Primary Mission Essential Functions (PMEF) on a biennial basis.
      Correspondingly, GSA information systems supporting these MEFs are also updated. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-12
    name: 'CRM: PM-12 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-12 on GSA Common Controls.
      Unfulfilled requirements:

      [GSA Order ADM 2400.1](<REDACTED_URL>), “Insider Threat Program,” establishes the roles and responsibilities across SSOs to
      prevent, deter, detect, and mitigate actions by insiders. The order further identifies the responsibilities to
      gather, integrate, centrally analyze, and respond appropriately to insider threats and incidents. As appropriate,
      consultation is conducted with records management, legal counsel, civil liberties, and privacy officials to ensure
      legal, privacy, civil rights, and civil liberties issues (including, but not limited to, the use of personally identifiable
      information) are appropriately addressed.
  - id: gsa-common-controls-component-definition-crm-pm-13
    name: 'CRM: PM-13 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-13 on GSA Common Controls.
      Unfulfilled requirements:

      [CIO-IT Security-05-29](<REDACTED_URL>):
      Security and Privacy Awareness and Role Based Training Program identifies information
      security roles within the workforce that require specific role-based security training to further their professional
      development. GSA’s OCISO ISP Division also provides role-based training, as required, on emerging topics or
      technology that help employees in those roles perform their job functions better. [GSA Order HRM 9410.1](<REDACTED_URL>),
      “GSA Workforce Learning and Development Policy,” requires all GSA employees to have and maintain up-to-date
      Individual Development Plans. Additionally, GSA’s OCISO ISP holds monthly Security Exchange meetings to
      evangelize security and discuss challenges and opportunities, and to provide security relevant training to
      individuals within and outside of OCISO.
  - id: gsa-common-controls-component-definition-crm-pm-14
    name: 'CRM: PM-14 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-14 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-14_smt.a: 1. The five Office of the Chief Information Security Officer (OCISO) Divisions--Security Engineering
      (ISE); Security Operations (ISO); Policy and Compliance (ISP); Information System Security Officer
      (ISSO) Support (IST), and Identity, Credential, Access Management (ICAM) Shared Services
      Division (ISI)--provide:

      * Security testing support for assessing GSA systems.
      * Training for various internal GSA processes including but not limited to assessment and authorization processes, Plan of Action and Milestones (POA&M) management, continuous monitoring, vulnerability scanning, and incident response.
      * Monitoring of GSA systems for those same processes (e.g., monitoring Assessment and Authorization (A&A) status and POA&Ms are maintained, monitoring vulnerabilities through scanning, monitoring systems/activities for incidents.)

      1. The OCISO divisions provide the activities described above continuously throughout the year and
      throughout information systems’ lifecycles. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-14_smt.b: As part of the scheduled revisions of CIO-IT Security Procedural and Technical guides, all testing,
      training, and monitoring guidance, activities, and templates are reviewed and updated to align with
      GSA’s risk management strategy and priorities. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-15
    name: 'CRM: PM-15 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-15 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-15_smt.a: The GSA OCISO security divisions establish and maintain contact with relevant Government and
      commercial groups and associations within the security community, including but not limited to the
      United States Computer Emergency Readiness Team (US-CERT), US-CERT Government Forum of
      Incident Response and Security Teams (GFIRST), National Institute of Standards and Technology
      (NIST), SANS, International Information System Security Certification Consortium (ISC2), and FireEye.
      These organizations/associations publish documents, reports, educational seminars, forums, and
      training, which GSA personnel with systems security responsibility may utilize.

      The GSA Privacy Office also maintains contact with relevant Government and commercial groups and
      associations within the privacy community, including but not limited to the Federal Privacy Council,
      NIST, MITRE and the International Association of Privacy Professionals (IAPP). These
      organizations/associations publish documents, reports, educational seminars, forums, and training
      which GSA personnel with privacy responsibility may utilize. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-15_smt.b: Participating in these groups and associations enables the security staff to maintain currency with
      recommended security and privacy practices, techniques, and technologies. OCISO divisions may
      attend seminars, conferences, vendor exhibits, attend training, and read various publications from
      groups and associations within the privacy community to stay current with security-related
      information such as threats, vulnerabilities, and incidents. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-15_smt.c: All noteworthy information obtained (e.g., threats, vulnerabilities, incidents) is shared with
      appropriate agency stakeholders within GSA to facilitate security awareness. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-16
    name: 'CRM: PM-16 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-16 on GSA Common Controls.
      Unfulfilled requirements:

      GSA OCISO manages GSA’s Threat Awareness Program, as described in [CIO-IT Security-01-02](<REDACTED_URL>): Incident Response
      (IR). GSA OCISO reviews indicators of compromise (e.g., domains/Internet Protocol (IP) addresses of known
      malicious actors, hashes of malicious files, traffic excerpts of suspicious activity) from threat intelligence for
      actionable information and shares this information with relevant System Owners, United States Computer
      Emergency Readiness Team (US-CERT), and other government agencies as needed. US-CERT coordinates
      communication of threat intelligence information between GSA and other Federal agencies. GSA OCISO
      implements proactive blocking of IP addresses, Uniform Resource Locators (URLs), hashes, and fraudulent email
      senders, as necessary. Additional details regarding threat sources and the sharing of information are contained
      in CIO-IT Security-01-02.
  - id: gsa-common-controls-component-definition-crm-pm-16-1
    name: 'CRM: PM-16(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-16(1) on GSA Common Controls.
      Unfulfilled requirements:

      On September 21, 2022, GSA’s OCSIO Continuous Diagnostics and Mitigation (CDM) Dashboard became the first
      external agency to exchange “object-level data” with Cybersecurity Infrastructure Security Agency’s (CISA) CDM
      Federal Dashboard. The automated data exchange achieved between the agency’s dashboards enables the
      sharing of GSA’s threat intelligence data with CISA.
  - id: gsa-common-controls-component-definition-crm-pm-17
    name: 'CRM: PM-17 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-17 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-17_smt.a: Pursuant to [GSA Order CIO 2103.2](<REDACTED_URL>), “Controlled Unclassified Information (CUI) Policy,” GSA has
      established a CUI Program Office and has disseminated associated program procedures for ensuring
      the requirements of the protections of CUI data processed, stored, or transmitted on GSA external
      facing systems, are implemented in accordance with applicable laws, executive orders, directives,
      policies, regulations, and standards. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-17_smt.b: The GSA CUI Program Office reviews and updates CIO 2103.2 and associated procedures at least
      every three (3) years and following any changes to Federal or GSA policies, requirements, or
      guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-18
    name: 'CRM: PM-18 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-18 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-18_smt.a: [CIO-IT Privacy-23-01](<REDACTED_URL>): Privacy Personally Identifiable Information (PII) Processing and Transparency
      (PT) provides a comprehensive approach for managing privacy risks associated with GSA information
      systems that contain PII data in accordance with Federal laws, regulations, and requirements. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-18_smt.b: The GSA Privacy Office updates CIO-IT Privacy-23-01 at least every three (3) years and following
      changes to Federal or GSA policies, requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-19
    name: 'CRM: PM-19 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-19 on GSA Common Controls.
      Unfulfilled requirements:

      GSA has a designated Chief Privacy Officer (CPO) and Senior Agency Official for Privacy (SAOP) who have the
      authority to allocate sufficient resources to implement and operate the organization-wide privacy program. The
      CPO leads the GSA Privacy Office which develops privacy policies and manages the [GSA Privacy Program](<REDACTED_URL>).
  - id: gsa-common-controls-component-definition-crm-pm-2
    name: 'CRM: PM-2 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-2 on GSA Common Controls.
      Unfulfilled requirements:

      GSA has an appointed Chief Information Security Officer (CISO), who provides oversight and resources for
      developing, implementing, and maintaining GSA’s enterprise-wide information security program. The GSA CISO
      manages and oversees the operation of the five Offices of the Chief Information Security Officer (OCISO)
      divisions: Security Engineering (ISE), Security Operations (ISO), Policy and Compliance (ISP), Identity, Credential
      and Access Management (ICAM) Shared Services (ISI), and Information System Security Officer (ISSO) Support
      (IST).
  - id: gsa-common-controls-component-definition-crm-pm-20
    name: 'CRM: PM-20 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-20 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-20_smt.a: GSA privacy practices are publicly available at the [GSA Privacy Program](<REDACTED_URL>) web page. The GSA Privacy
      Office manages these resources, providing the public with access to information about GSA’s privacy
      activities and the ability to communicate with GSA’s Chief Privacy Officer (CPO). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-20_smt.b: GSA privacy practices are publicly available at the [GSA Privacy Program](<REDACTED_URL>) web page. The GSA Privacy
      Office manages the publicly available privacy resources ensuring its practices and reports are publicly
      available. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-20_smt.c: GSA privacy practices are publicly available at the [GSA Privacy Program](<REDACTED_URL>) web page. The GSA Privacy
      Office manages these resources to include the GSA Privacy Office email address
      (<POC_EMAIL>). This enables the public to provide feedback and/or submit questions about
      privacy practices directly to the CPO. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-20-1
    name: 'CRM: PM-20(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-20(1) on GSA Common Controls.
      Unfulfilled requirements:

      GSA privacy practices are publicly available at the [GSA Privacy Program](<REDACTED_URL>) web page. The GSA Privacy Act Rules
      provide the public with access to information about GSA privacy activities and the ability to communicate with
      GSA’s Chief Privacy Officer. More information regarding dissemination of privacy program information can be
      found in [41 CFR Part 105-64](<REDACTED_URL>).

      1. The GSA Privacy Program information provided on the [GSA Privacy Program](<REDACTED_URL>) web page is written in plain
      language and organized in a way that is easy to understand and navigate.
      1. Information required by the public to make an informed decision about whether and how to interact with
      GSA Privacy Program is available; and
      1. The online privacy practices are updated whenever GSA makes a substantive change to the practices.
      Changes include a time/date stamp to inform the public when the most recent changes were made.
  - id: gsa-common-controls-component-definition-crm-pm-21
    name: 'CRM: PM-21 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-21 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners are responsible for maintaining
      an accurate accounting of disclosures of PII held in each system of records.

      Statements:
      - pm-21_smt.a: The GSA Privacy Office supports System Owners, who are responsible for maintaining an accurate
      accounting of disclosures of PII held in each system of records under its control including date,
      nature, and purpose of each disclosure of a record and the name and address of the person or
      agency to which the disclosure was made. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-21_smt.b: The GSA Privacy Office supports System Owners, who are responsible for retaining the accounting of
      disclosures for the life of the record or five years after the disclosure is made (whichever is longer).
      Per the National Archives and Records Administration [General Records Schedule 4.2](<REDACTED_URL>),
      “Information Access and Protection Records” Item 50, which covers part a of the control described above, GSA
      System Owners are asked to retain the following for each disclosure:

      * Forms with the subject individual's name
      * Records of the requester's name and address
      * Explanations of the purpose for the request
      * Date of disclosure
      * Proof of subject individual's consent

      Systems owners are notified of this specific retention issue. All GSA employees complete records
      management training each year and are provided with resources for assistance, when needed. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-21_smt.c: The GSA Privacy Office supports System Owners, who are responsible for making the accounting of
      disclosures available to the individual named in the record upon request. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-22
