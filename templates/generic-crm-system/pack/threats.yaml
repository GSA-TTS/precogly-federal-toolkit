  - id: gsa-common-controls-component-definition-crm-pm-28
    name: 'CRM: PM-28 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-28 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-28_smt.a: GSA IT has established an Enterprise Risk and Strategic Initiatives (ERSI) board for strengthening Risk
      Management at GSA. The ERSI Board serves as the governance body for translating enterprise-level
      risk strategies into actionable initiatives and implementing sound risk management principles across
      GSA functions and programs. Key activities of the ERSI board include but are not limited to:

      1. Risk Prioritization and Development of Enterprise Risk Profiles: Identify and prioritize the
      most significant enterprise risks to GSA’s mission for consideration by leadership.
      2. Risk Mitigation: Establish risk owners for enterprise-wide threats and work with them to
      develop and implement mitigation actions.
      3. Monitoring and Communication: Review and monitor the effectiveness of mitigation
      strategies and regularly exchange information to improve leadership understanding about
      ongoing risk actions.
      4. Decision Support: Bring Agency leaders together to integrate risk management practices
      into strategic planning and resource allocation.
      5. Problem Solving: Leverage the experience of a diverse cross-functional team to critically
      think through strategic challenges and opportunities and provide solutions.
      6. Transparency and Accountability: Foster transparency and clear accountability for
      enterprise risks while embedding the tenets of effective risk management into GSA’s
      culture. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-28_smt.b: The risk framing results are distributed to the Co-Chaired by Deputies, Performance Improvement
      Officer (PIO) and Chief Information Security Officer (CISO) with “Risk Leads” from major Services and
      Staff Offices (SSOs), as well as the Chief Data Officer (CDO), Chief Privacy Officer, Evaluation Officer,
      and A-Suite Representative. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-28_smt.c: The GSA IT ERSI board performs risk framing activities annually and as needed to identify, validate,
      and prioritize the most significant enterprise risks to GSA and for ensuring risk owners are effectively
      executing mitigation activities as assigned. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-29
    name: 'CRM: PM-29 Responsibility Gap - GSA Common Controls'
