  - id: gsa-pages-component-definition-crm-ia-5
    name: 'CRM: IA-5 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for IA-5 on GSA Pages.
      Unfulfilled requirements:

      GSA Pages relies on enterprise identity providers (GitHub and cloud.gov UAA) and GSA policy to manage authenticators securely. Passwords are verified against known-breached corpuses, stored using modern salted hashing, never transmitted in clear text, and are changeable only over TLS. Multi-factor authenticators (TOTP and FIDO2/WebAuthn security keys) are required for privileged access and enforced for organization members. Personal access tokens (PATs) and SSH keys used for automation are scoped, rotated, and revocable; classic PATs are disabled in favor of fine‑grained tokens. Recovery flows require re‑authentication and immediate credential reset. These practices align to NIST SP 800‑63B and GSA CIO 2100.1 requirements.

      Statements:
      - ia-5_smt: Authenticator management is implemented via GitHub and cloud.gov UAA: passwords are checked against breach corpuses and stored with salted hashing; MFA (TOTP/security keys) is enforced for admins and org members; recovery requires identity verification and immediate reset; automation credentials (SSH keys, fine‑grained PATs) are least‑privilege, time‑limited, and rotatable.
  - id: gsa-pages-component-definition-crm-ia-5-1
    name: 'CRM: IA-5(1) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for IA-5(1) on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages implements comprehensive security controls for password-based authentication:

      1. **Commonly Used/Compromised Password Lists:**
         - GitHub maintains and regularly updates lists of commonly used and compromised passwords
         - Lists are updated at least monthly and immediately when new password breaches are discovered
         - Password attempts are checked against these lists in real-time
         - Cloud.gov UAA employs similar password checking mechanisms

      2. **Password Verification:**
         - When users create or update passwords, they are checked against known compromised password databases
         - GitHub's password validation includes checks against HaveIBeenPwned and similar databases
         - Password creation/change is rejected if the password appears in known breach corpuses
         - Contextual passwords (containing usernames, service names) are also rejected

      3. **Secure Password Transmission:**
         - All password transmission occurs only over TLS-encrypted channels
         - Passwords are never transmitted in clear text
         - All authentication endpoints enforce HTTPS with strong cipher suites
         - API authentication tokens are also transmitted only over encrypted channels

      4. **Secure Password Storage:**
         - Passwords are stored using modern secure hashing algorithms (bcrypt/Argon2)
         - Each password is salted with a unique random salt
         - Hash algorithms are configured with appropriate work factors to resist brute-force attacks
         - No plaintext or reversibly encrypted passwords are stored

      5. **Account Recovery:**
         - Account recovery procedures require immediate selection of a new password
         - Temporary recovery tokens have short expiration times (15 minutes or less)
         - Recovery flows validate user identity through secondary channels
         - Recovery does not reveal or reuse previous passwords

      6. **Long Passwords and Passphrases:**
         - The system allows passwords up to 128 characters in length
         - All printable characters, including spaces, are permitted
         - Passphrases are encouraged through user guidance
         - No arbitrary maximum password length limitations are imposed

      7. **Password Selection Assistance:**
         - Password strength meters provide real-time feedback during password creation
         - Password guidance suggests using passphrases over complex character substitution
         - Password managers are supported and encouraged
         - Authentication interfaces provide guidance on creating strong passwords

      8. **Password Complexity Rules:**
         - Passwords must be at least 12 characters long
         - Passwords must contain at least one uppercase letter
         - Passwords must contain at least one lowercase letter
         - Passwords must contain at least one number
         - Passwords must contain at least one special character

      These password security measures are complemented by multi-factor authentication requirements for all accounts, providing defense in depth.

