  - id: gsa-pages-component-definition-crm-sr-11-1
    name: 'CRM: SR-11(1) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-11(1) on GSA Pages.
      Unfulfilled requirements:

      GSA has implemented a comprehensive anti-counterfeit training program for relevant personnel to ensure they can effectively detect counterfeit system components:

      GSA provides specialized anti-counterfeit training to:
      - GSA IT system administrators
      - System security engineers
      - Acquisition specialists and contracting officers
      - Logisticians and receiving personnel
      - System and network administrators
      - IT asset managers
      - Anyone handling IT hardware and software

      The training program includes multiple components:

      1. **Core Anti-Counterfeit Training Course:**
         - Required for all identified personnel
         - Covers fundamental concepts and techniques for counterfeit detection
         - Available through GSA Online University (OLU)
         - Includes assessment to verify knowledge acquisition
         - Updated annually to address emerging counterfeit techniques

      2. **Role-Specific Training Modules:**
         - Acquisition specialists receive focused training on procurement controls and supplier validation
         - Technical staff receive in-depth training on hardware and software authentication methods
         - Receiving personnel learn detailed inspection procedures for incoming shipments
         - IT administrators learn to identify counterfeit software and firmware

      3. **Training Content:**
         - Visual identification of counterfeit indicators
         - Authentication of packaging, labels, and documentation
         - Hardware inspection techniques
         - Software and firmware verification methods
         - Digital signature validation
         - Supply chain security concepts
         - Documentation and reporting procedures
         - Legal and regulatory requirements
         - Emerging counterfeit trends and techniques
         - Case studies of actual counterfeit incidents

      4. **Hands-On Components:**
         - Laboratory exercises with actual counterfeit samples
         - Guided inspection of sample hardware components
         - Software verification exercises
         - Simulation of counterfeit detection scenarios
         - Use of inspection tools and equipment

      5. **Continuous Education:**
         - Annual refresher training requirements
         - Just-in-time training bulletins about new counterfeit threats
         - Periodic webinars on emerging counterfeit techniques
         - Access to reference materials and authentication guides
         - Community of practice for sharing experiences and best practices

      6. **Training Effectiveness:**
         - Pre/post assessments to measure knowledge gain
         - Practical exercises to demonstrate skills acquisition
         - Performance metrics tracking counterfeit detection rates
         - Feedback mechanisms to continuously improve training content
         - Periodic evaluation of training program effectiveness

      The GSA OCISO maintains training completion records and ensures that personnel complete required initial and refresher training according to established schedules. The training program is regularly updated based on emerging threats, lessons learned from actual incidents, and feedback from trainees.

        - anti-counterfeit-training



