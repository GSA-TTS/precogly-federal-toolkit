      and maximizing the quality, utility, objectivity, and integrity of disseminated information. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-22_smt.c: The GSA Privacy Office supports System Owners, who are responsible for disseminating notice of
      corrected or deleted PII to individuals or other appropriate entities. The GSA Privacy Office can
      provide technical assistance or guidance as needed. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-22_smt.d: The GSA Privacy Office hears appeals of adverse decisions on correction or deletion requests in
      accordance with [41 C.F.R. Part 105-64](<REDACTED_URL>) - GSA PRIVACY ACT RULES. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pm-23
    name: 'CRM: PM-23 Responsibility Gap - GSA Common Controls'
    description: |-
