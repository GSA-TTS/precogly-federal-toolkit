      A customer responsibility gap exists for PM-9 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pm-9_smt.a: 1. [CIO-IT Security-18-91](<REDACTED_URL>): Risk Management Strategy (RMS) provides a comprehensive approach for
      managing risks associated with GSA information systems in accordance with Federal laws,
      regulations, and requirements.
      2. [CIO-IT Privacy-23-01](<REDACTED_URL>): Privacy Personally Identifiable Information (PII) Processing and
      Transparency (PT) provides a comprehensive approach for managing privacy risks associated
      with GSA information systems that contain PII data in accordance with Federal laws, regulations,
      and requirements. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-9_smt.b: CIO-IT Security-18-91 establishes an integrated, comprehensive approach to identify, measure, and
      manage risk to GSA operations, assets, and individuals associated with the operation and use of GSA
      information systems. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pm-9_smt.c: The GSA OCISO is responsible for reviewing and updating CIO-IT Security-18-91 biennially.
      The GSA Privacy Office is responsible for reviewing and updating CIO-IT Privacy-23-01 biennially. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ps-1
    name: 'CRM: PS-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ps-1_smt.a: 1. The GSA personnel security policy is defined in the GSA Order CIO 2100.1, “GSA Information Technology (IT) Security Policy,” GSA Order ADM 9732.1,
      “Personnel Security and Suitability Program Handbook” and GSA Order ADM 2181.1,
      “Homeland Security Presidential Directive-12, Personal Identity Verification and Credentialing, and Background Investigations for Contractors.”
      which address purpose, scope, roles, responsibilities, management commitment, coordination
      among organizational entities, and compliance for personnel security activities. These policies
      are consistent with applicable laws, executive orders, directives, regulations, policies, standards,
      and guidelines. These policies are disseminated GSA-wide via GSA’s InSite centralized agency
      [Directives website](<REDACTED_URL>).
      2. Personnel security procedures are documented in CIO-IT Security-03-23: Termination and
      Transfer and in CIO-IT Security-Privacy-18-90: Common Control Catalog (CCC). These procedures
      facilitate the implementation of the personnel security policy and associated controls. These
      guides are disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ps-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ps-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. CIO-IT Security-03-23 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ps-2
    name: 'CRM: PS-2 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-2 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ps-2_smt.a: [GSA Order ADM 9732.1](<REDACTED_URL>), “Personnel Security and Suitability Program Handbook” describes the
      process GSA uses to designate the risk levels for positions in GSA. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ps-2_smt.b: ADM 9732.1 provides the screening criteria (i.e., requirements for investigations, suitability
      adjudications, and security clearance determinations for GSA employees). Requirements for
      contractors are contained in [GSA Order ADM 2181.1](<REDACTED_URL>), “Homeland Security Presidential Directive-12,
      Personal Identity Verification and Credentialing, and Background Investigations for Contractors,” and
      [GSA Order ADM 5400.2](<REDACTED_URL>), “General Services Administration Heads of Services and Staff Offices’ and
      Requesting Officials’ Roles and Responsibilities to Implement Homeland Security Presidential Directive-12.” ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ps-2_smt.c: GSA position risk designations are reviewed and updated, as necessary, to meet changing roles,
      responsibilities, and Federal requirements. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ps-3
    name: 'CRM: PS-3 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-3 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ps-3_smt.a: [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy,” requires an initial fitness
      determination as part of the background investigation process prior to users being granted access to
      the GSA network and GSA IT systems. [GSA Order ADM 9732.1](<REDACTED_URL>), “Personnel Security and Suitability
      Program Handbook” provides the screening criteria (e.g., requirements for investigations, suitability
      adjudications, and security clearance determinations for GSA employees). [GSA Order ADM 2181.1](<REDACTED_URL>),
      “Homeland Security Presidential Directive-12, Personal Identity Verification and Credentialing, and
      Background Investigations for Contractors” provides screening criteria and access to IT systems
      guidelines for contractors. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ps-3_smt.b: ADM 9732.1 provides the re-screening criteria (i.e., number of years between investigations) for GSA
      employees. For contractors, ADM 2181.1 states that it must be used in conjunction with ADM 9732.1
      which identifies the time periods for rescreening of individuals. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ps-4
    name: 'CRM: PS-4 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-4 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** The GSA supervisor/CO/COR is responsible for notifying the appropriate
      System Owner/Account Manager about a user’s off-boarding so they can take appropriate action at a
      system/application level. The GSA supervisor/CO/COR is responsible for submitting a GSA off-boarding
      ServiceNow ticket required per assigned personnel.

      Statements:
      - ps-4_smt.a: Disabling GSA account(s)/information system access is initiated and facilitated by an individual’s
      supervisor/Contracting Officer (CO)/Contracting Officer Representative (COR). GSA account access
      (ENT Long-Name Account [LNA] and Short-Name Account [SNA]) is disabled within 24 hours of an
      approved Service Catalog Request indicating personnel termination. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-4_smt.b: Terminating/revoking of all information system-related property which includes HSPD-12 cards,
      authentication tokens (USB for privileged access), laptops, etc. is facilitated by the supervisor and
      sent to GSA IT support personnel based on the Service Catalog Request. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-4_smt.c: Exit interviews are initiated and facilitated by the supervisor/CO/COR of an individual ensuring that
      privacy, disclosure, and confidentiality responsibilities are reviewed with the person leaving. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-4_smt.d: Retrieval of all information system-related property which includes HSPD-12 cards, authentication
      tokens (USB for privileged access), laptops, etc. is facilitated by the supervisor and sent to GSA IT
      support personnel based on the Service Catalog Request. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-4_smt.e: As part of user off-boarding, the supervisor/CO/COR is responsible for coordinating with GSA IT
      support personnel the transfer of organizational information and information systems based on the
      Service Catalog Request. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ps-5
    name: 'CRM: PS-5 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-5 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** Supervisors/CO/COR are responsible for notifying the appropriate System
      Owner/Account Manager of a user’s transfer so they can take appropriate action at a system/application level.

      Statements:
      - ps-5_smt.a: Review of an individual’s ongoing operational need for current logical and physical access is initiated
      and facilitated by the individual’s supervisor/ Contracting Officer (CO)/Contracting Officer
      Representative (COR). The supervisor/CO/COR is responsible for initiating transfer procedures (with
      the individual), such as creating a Service Catalog Request, as necessary, to ensure the user’s access
      is adjusted as appropriate for their new assignment. For additional details, refer to
      [CIO-IT Security-03-23](<REDACTED_URL>): Termination and Transfer. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-5_smt.b: Access is denied or modified within 3 days of an approved Service Catalog Request indicating
      personnel transfer. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-5_smt.c: The supervisor/CO/COR is responsible for coordinating with the user to ensure modifications to the
      user’s access, as appropriate, to their new assignment. If necessary, Service Catalog Request(s) can
      be opened to facilitate access modifications. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-5_smt.d: Supervisors are notified within 24 hours that a personnel transfer Service Catalog Request has been
      serviced. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ps-6
    name: 'CRM: PS-6 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-6 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** If a managed system does not have system
      specific access agreement requirements, the System Owner may leverage the OCISO PS-6 control response as a
      Common Control.

      If a managed system has specific or unique access agreement requirements identified, the System Owner is
      responsible for ensuring the unique access agreement is documented and is acknowledged in conjunction with
      GSA’s access agreement for meeting the system’s specific access and usage requirements, making the control
      Hybrid. Additional system-specific portions of the control are reviewing and updating the system’s unique
      access agreement and documenting acknowledgment of it.

      Any unique access agreement required by a system, a Service, or a Staff Organization must comply with GSA’s IT
      Rules of Behavior (refer to PL-4 guidance).

      Statements:
      - ps-6_smt.a: GSA has developed a common access agreement (i.e., “GSA IT Rules of Behavior for General Users”)
      as indicated in [CIO-IT Security-05-29](<REDACTED_URL>): Security and Privacy Awareness and Role Based Training
      Program. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-6_smt.b: GSA OCISO reviews and updates the GSA IT Rules of Behavior for General Users annually. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-6_smt.c: 1. All GSA IT users must sign the GSA IT General Rules of Behavior for General Users within 90 days
      of their entry on duty (EoD).
      2. All GSA IT users are required to re-sign the GSA IT Rules of Behavior for General Users annually
      as part of GSA’s annual IT Security and Privacy Awareness training. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ps-7
    name: 'CRM: PS-7 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-7 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners must ensure all external provider contracts include GSA’s
      third party personnel security requirements.

      Statements:
      - ps-7_smt.a: All third-party personnel (i.e., Vendors/Contractors) providing services or equipment to GSA must
      adhere to [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy,” regarding
      security roles and responsibilities and personnel security requirements. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-7_smt.b: All third parties must comply with CIO 2100.1, [GSA Order ADM 2181.1](<REDACTED_URL>), “Homeland Security Presidential Directive-12,
      Personal Identity Verification and Credentialing, and Background Investigations for Contractors,”
      [GSA Order ADM 9732.1](<REDACTED_URL>), “Personnel Security and Suitability Program Handbook,” and
      [GSA Order ADM 5400.2](<REDACTED_URL>), “General Services Administration Heads of Services and
      Staff Offices’ and Requesting Officials’ Roles and Responsibilities to Implement Homeland Security
      Presidential Directive-12.” ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-7_smt.c: GSA’s personnel security requirements are documented in CIO 2100.1, ADM 2181.1, ADM 9732.1,
      and ADM 5400.2. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-7_smt.d: CIO 2100.1 and [CIO-IT Security-03-23](<REDACTED_URL>):
      Termination and Transfer require supervisors to notify the
      appropriate personnel of any personnel transfers or terminations within 3 business days. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ps-7_smt.e: GSA monitors third party compliance via contractual requirements and identification of inactive accounts. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ps-8
    name: 'CRM: PS-8 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-8 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ps-8_smt.a: GSA Federal personnel are subject to sanctions as described in [GSA Order HRM 9751.1](<REDACTED_URL>),
      “Maintaining Discipline” regarding delinquency or misconduct, including security violations. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ps-8_smt.b: Supervisors, after coordinating with the servicing human resources office, must notify appropriate
      personnel within three days when a formal sanctions process is initiated, including identifying the
      individual and reason for the sanction if approved by the human resources office. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ps-9
    name: 'CRM: PS-9 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PS-9 on GSA Common Controls.
      Unfulfilled requirements:

      Security and privacy roles and responsibilities and position descriptions are defined within
      [GSA Order CIO 2100.1](<REDACTED_URL>) “GSA Information Technology (IT) Security Policy” and
      [GSA Order CIO 2200.1](<REDACTED_URL>) “GSA Privacy Act Program.”
  - id: gsa-common-controls-component-definition-crm-pt-1
    name: 'CRM: PT-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - pt-1_smt.a: 1. The GSA Privacy Office develops, disseminates, and implements operational privacy policies that
      govern the appropriate privacy and security controls for programs, information systems, or
      technologies involving PII. They are disseminated via the [Privacy InSite page](<REDACTED_URL>).

      a. The policies and procedures on the Privacy page address purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance.
      b. The Privacy policies, procedures, and processes are consistent with Federal laws, orders,
      directives, regulations, policies, standards, and guidelines.

      2. The GSA Privacy Office develops, disseminates, and implements operational privacy procedures
      (e.g., Privacy Threshold Assessment [PTA] and Privacy Impact Assessment [PIA] processes) via
      the Privacy InSite page that provide guidance for processing PII and complying with associated
      privacy controls. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pt-1_smt.b: GSA has a designated Chief Privacy Officer (CPO) and a Senior Agency Official for Privacy (SAOP) and
      allocates sufficient resources to implement and operate the organization-wide privacy program. The
      CPO leads the GSA Privacy Office which develops privacy policies and manages the GSA Privacy
      Program. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - pt-1_smt.c: 1. The GSA Privacy Office develops, disseminates, and implements operational privacy policies that
      govern the appropriate privacy and security controls for programs, information systems, or
      technologies involving PII in accordance with Federal laws, policies, and requirements. They are
      reviewed on an annual basis and updated as necessary.
      2. The GSA Privacy Office develops, disseminates, and implements operational privacy procedures
      (e.g., PTA and PIA processes) that provide guidance for identifying and safeguarding Personally
      Identifiable Information (PII). They are reviewed on an annual basis and updated as necessary. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-pt-2
    name: 'CRM: PT-2 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-2 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners and Data Owners are responsible
      for determining and documenting the legal authority permitting the handling of PII data within a SORN,
      pursuant to [5 U.S.C. §552a (e) (3)](<REDACTED_URL>).
      When drafting a Privacy Act Statement for review by the GSA Privacy Office,
      the System Owner must include the legal authority for collecting the information. System Owners are
      responsible for ensuring only authorized Personally Identifiable Information (PII) data is processed by the
      system per its documented SORN.

      Statements:
      - pt-2_smt.a: The GSA Privacy Office provides guidance and oversight to System Owners and Data Owners in
      documenting their Privacy Act Systems of Records Notices (SORN). The standard format of the GSA
      SORN requires the identification of the specific authority that permits the processing of the
      personally identifiable information. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-2_smt.b: The individual must provide information to verify eligibility to access controlled systems or facilities.
      All collections are voluntary. Collections may be listed as “mandatory” only if the person is required
      by law to provide the data AND the person is subject to a penalty for refusing. Only the minimum
      required information is collected in order to provide access. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pt-3
    name: 'CRM: PT-3 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-3 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Control Expectation:**

      a. When drafting a Privacy Act Statement for review by the GSA Privacy Office, the System Owner must
      include the purpose(s) for collecting the information.
      c. The System Owner is responsible for ensuring that PII is shared only for the authorized purpose(s)
      identified in the Privacy Act and/or in public notices.
      d. The System Owner is responsible for ensuring that the annual PIA updates are made in coordination with
      the ISSO or that if there are no significant changes to the PII in the system, that the PIA is recertified.

      Statements:
      - pt-3_smt.a: The GSA Privacy Office provides guidance and oversight to System Owners in documenting their
      Privacy Act Systems of Records Notices (SORN). The standard format of the GSA SORN requires the
      identification of the purpose for processing of the personally identifiable information. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-3_smt.b: The GSA Privacy Office develops privacy policies and manages the GSA Privacy Program. The GSA
      privacy training and the GSA requirements for Privacy Impact Assessments (PIAs) and SORNs ensure
      that GSA uses Personally Identifiable Information (PII) internally only for the authorized purpose(s)
      identified in the Privacy Act and/or in public notices. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-3_smt.c: The GSA Privacy Office develops and collaborates with necessary Services and Staff Offices (SSOs) to
      develop privacy policies and manage the GSA Privacy Program. [GSA Order CIO 2180.2](<REDACTED_URL>),
      “GSA Rules of Behavior for Handling Personally Identifiable Information (PII),” and within [GSA Order CIO 2100.1](<REDACTED_URL>)
      “GSA Information Technology (IT) Security Policy,” ensure that GSA is in accordance with applicable
      laws and National Institute of Standards and Technology (NIST) recommendations for sharing
      information with third parties. Personal information used to determine employee rights, benefits,
      and privileges is collected directly from the individual of record whenever possible and used only for
      the purpose for which it is intended. Each system of records manager must set up technical,
      administrative, and physical security measures for processing, storing, transmitting, and disposing of
      information in the system. All employees who work with a system's information as part of their job
      must follow these measures. Security measures for paper records include storage in secure cabinets
      or rooms, with access limited to authorized personnel. Electronic records are protected by
      passwords, firewalls, and other administrative, technical, and physical security measures determined
      to be necessary by the system manager and program officials, pursuant to [5 U.S.C. §552a (e) (10)](<REDACTED_URL>). ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-3_smt.d: The Information System Security Officer (ISSO) is responsible for coordinating the annual review and
      updating the system/application PIA in GSA’s Governance, Risk, and Compliance (GRC) system/tool
      (currently Archer). PIAs must be updated when there are significant changes and are required to
      receive stakeholder approvals. SORNs must be updated whenever there is a significant change. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pt-4
    name: 'CRM: PT-4 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-4 on GSA Common Controls.
      Unfulfilled requirements:

      The GSA Privacy Office develops privacy policies and manages the GSA privacy program which provides a
      means, where feasible and appropriate, for individuals to authorize the collection, use, maintaining, and sharing
      of personally identifiable information (PII) prior to its collection.

      GSA Orders CIO 1878.3, “Developing and Maintaining Privacy Threshold Assessments, Privacy Impact
      Assessments, Privacy Act Notices, and System of Records Notices,” and CIO 2180.2, “GSA Rules of Behavior for
      Handling Personally Identifiable Information (PII)” provide appropriate means for individuals to understand the
      consequences of decisions to approve or decline the authorization of the collection, use, dissemination, and
      retention of PII.

      The GSA Privacy Office advises the System Owner on how to obtain consent, where feasible and appropriate,
      from individuals prior to any new uses or disclosure of previously collected PII.

      The GSA Privacy Act Program ensures that individuals are aware of and, where feasible, consent to all uses of PII
      not initially described in the public notice that was in effect at the time the organization collected the PII.

      **Federal System-Specific Expectation:** System Owners are responsible for adding
      Privacy Act Statements to their systems at the point of data collection.
  - id: gsa-common-controls-component-definition-crm-pt-5
    name: 'CRM: PT-5 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-5 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners are responsible for coordinating
      with the Privacy Program to ensure individuals have the ability to access their PII in accordance with GSA
      policies and procedures. Additionally, System Owners are responsible for coordinating with the Privacy Program
      to ensure privacy notices and the rights of individuals are accurate and kept current.

      Statements:
      - pt-5_smt.a: The GSA Privacy Program supplies templates and guidance on to how provide effective notice to the
      public and to individuals regarding:

      a. its activities that impact privacy, including its collection, use, sharing, safeguarding,
      maintenance, and disposal of Personally Identifiable Information (PII);
      b. authority for collecting PII;
      c. the choices, if any, individuals may have regarding how the organization uses PII and the
      consequences of exercising those choices; and
      d. the ability to access and have PII amended or corrected if necessary. The organization
      provides real-time and/or layered notice when it collects PII. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-5_smt.b: GSA complies with the [Plain Writing Act of 2010](<REDACTED_URL>) which requires all federal agencies to write "clear
      government communication that the public can understand and use." ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-5_smt.c: GSA adheres to [Privacy Act of 1974](<REDACTED_URL>) requirements and Office of Management and Budget (OMB)
      policies and guidance for the proper processing of Privacy Act Requests. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-5_smt.d: The GSA Privacy Program provides templates and guidance on how to describe: 1) the PII the
      organization collects and the purpose(s) for which it collects that information; 2) how the
      organization uses PII internally; 3) whether the organization shares PII with external entities and the
      categories of those entities and the purposes for such sharing; 4) whether individuals have the ability
      to consent to specific uses or sharing of PII and how to exercise any such consent; 5) how individuals
      may obtain access to PII; and 6) how the PII is protected.

      Personal information used to determine employee rights, benefits, and privileges must be collected
      directly from the individual of record whenever possible and used only for the purpose for which it is
      intended. If the information needs to come from a third party, the individual's written permission is
      required. Statutory authority must exist for collecting Social Security Numbers (SSNs) for record
      systems that use the SSN for identification purposes. SSNs are not to be collected for systems
      without this specific authority.

      SSNs are not to be collected for systems that were established under a statutory authority in effect
      before January 1, 1975. Systems that were established before January 1, 1975, must be revised to
      avoid the collection and use of the SSNs. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-5_smt.e: The term “Personally Identifiable Information,” as defined in [OMB Circular A-130](<REDACTED_URL>),
      “Managing Information as a Strategic Resource,” means information that can be used to distinguish or trace an
      individual’s identity, either alone or when combined with other information that is linked or linkable
      to a specific individual.” ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pt-5-2
    name: 'CRM: PT-5(2) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-5(2) on GSA Common Controls.
      Unfulfilled requirements:

      The GSA Privacy Office and System Owners include Privacy Act Statements on GSA forms that collect Personally
      Identifiable Information (PII).

      **Federal System-Specific Expectation:** System Owners are responsible for coordinating
      with the GSA Privacy Program to ensure System of Record Notices (SORNs) and Privacy Act notices on forms
      that collect PII are kept current.
  - id: gsa-common-controls-component-definition-crm-pt-6
    name: 'CRM: PT-6 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-6 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners are responsible for coordinating
      with the GSA Privacy Program and Regulatory Secretariat Division to ensure SORNs and Privacy Act notices on
      forms that collect PII are kept current.

      If a significant alteration needs to be made to a system of records, GSA amends the existing SORN for that
      system of records and republish it in the Federal Register to comply with the OMB requirements in
      [OMB Circular A-108](<REDACTED_URL>), “Federal Agency Responsibilities for Review, Reporting, and Publication under the Privacy Act.”

      Statements:
      - pt-6_smt.a: Office of Management and Budget (OMB) [Circular A-130](<REDACTED_URL>) Appendix I, “Responsibilities for Protecting
      and Managing Federal Information Resource,” serves as the baseline for distinguishing between the
      criteria for drafting a new SORN versus amending an existing SORN. A “new” system of records is one
      for which no public notice is currently published in the Federal Register. A new SORN must be
      published when any one of the following criteria is met:

      * A program, authorized by a new or existing statute or Executive order (EO), maintains
      information on an individual and retrieves that information by personal identifier.
      * There is a new organization of records resulting in the consolidation of two or more existing
      systems into one new umbrella system, whenever the consolidation cannot be classified
      under a current SORN.
      * It is discovered that records about individuals are being created and used, and that this
      activity is not covered by a currently published SORN. In this case, OMB requires the
      temporary suspension of data collection and disclosure.
      * A new organization (configuration) of existing records about individuals that was not
      previously subject to the Privacy Act (i.e., was not a system of records) results in the
      creation of a system of records. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-6_smt.b: The GSA Privacy Office publishes System of Records Notices (SORNs) in the Federal Register, subject
      to required oversight processes, for systems containing Personally Identifiable Information (PII).
      When a GSA organization proposes to establish a new system of records or significantly revise an
      existing one, the program manager notifies the GSA Privacy Act Officer, which helps in preparing a
      SORN using the prescribed format, coordinate its review and approval within GSA, and submit it for
      evaluation by OMB and Congress and for publication in the Federal Register. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-6_smt.c: The GSA Privacy Office and System Owners keep SORNs current, perform an annual review of SORNs,
      and include Privacy Act Statements on GSA forms that collect PII. More information regarding System
      of Records Notices and Privacy Act Statements can be found in [41 CFR Part 105-64](<REDACTED_URL>). ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pt-6-1
    name: 'CRM: PT-6(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-6(1) on GSA Common Controls.
      Unfulfilled requirements:

      Routine uses apply to information sharing external to GSA. The term “routine use” is defined, with respect to
      the disclosure of a record, as “the use of such a record for a purpose which is compatible with the purpose for
      which the record was collected.” This section describes each situation in which GSA may share records on
      individuals covered by the SORN under the Privacy Act Section 552a(b)(3). The routine uses must be compatible
      and consistent with the purpose for which the record was collected. This ensures the public receives adequate
      notice of the agency’s planned uses of the information in the system of records. The following language must be
      included prior to the list of routine uses: “In addition to those disclosures generally permitted under 5 U.S.C.
      552a(b) of the Privacy Act, all or a portion of the records or information contained in this system may be
      disclosed to authorized entities, as is determined to be relevant and necessary, outside GSA as a routine use
      pursuant to 5 U.S.C. 552a(b)(3) as follows:”

      Common routine uses for most systems of records include sharing.

      * For audits and oversight.
      * For congressional inquiries.
      * With contractors, grantees, and experts to perform OPM-authorized activities.
      * For investigations of potential violations of law.
      * For intelligence purposes.
      * With the National Archives and Records Administration (NARA) for records management purposes.
      * For litigation purposes.
      * For data breach and mitigation response.

      SORNS must be updated whenever there is a significant change.

      **Federal System-Specific Expectation:** System Owners and Data Owners are responsible
      for coordinating with the GSA Privacy Program to ensure SORNs and Privacy Act notices on forms that collect
      Personally Identifiable Information (PII) are kept current.

      The Privacy Act requires that a notice describing each System of Records proposed for establishment be
      published in the Federal Register for review and comment by the public and other interested parties. The notice
      allows questions to be raised and resolved before the system is put into effect and ensures that privacy
      considerations have been addressed. GSA complies with the Privacy Act requirements.
  - id: gsa-common-controls-component-definition-crm-pt-6-2
    name: 'CRM: PT-6(2) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-6(2) on GSA Common Controls.
      Unfulfilled requirements:

      There are no exceptions to the SORN process. However, certain exemptions to the [Privacy Act of 1974](<REDACTED_URL>) can be
      claimed. The head of GSA may promulgate rules, in accordance with the requirements (including general notice)
      of sections [U.S.C. 553](<REDACTED_URL>)(b)(1), (2), and (3), (c), and (e) of this title, to exempt any system of records within the
      agency from subsections (c)(3), (d), (e)(1), (e)(4)(G), (H), and (I) and (f) of this section.

      **Federal System-Specific Expectation:** System Owners and Data Owners are responsible
      for coordinating with the GSA Privacy Program to ensure that the agency promulgates any Privacy Act
      exemption as a rule per GSA agency rulemaking procedures. At the time rules are adopted under this
      subsection, GSA and/or its contractors shall include in the statement required under section 553(c) of the
      Privacy Act, the reasons why the system of records is to be exempted from a provision of this section of the
      Privacy Act. Any exemptions taken in a Notice of Proposed Rulemaking must be published as a Final Rule before
      they are effective. Refer to OMB SORN Guidance in [Circular A-108](<REDACTED_URL>),
      “Federal Agency Responsibilities for Review, Reporting, and Publication under the Privacy Act” for
      further information and specific criteria regarding submission of exemptions
  - id: gsa-common-controls-component-definition-crm-pt-7-1
    name: 'CRM: PT-7(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-7(1) on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners and Data Owners are responsible
      for eliminating unnecessary collection, maintenance, and use of SSNs, and explore alternatives to their use as a
      personal identifier. When drafting a Privacy Impact Analyst or System of Record Notice for review by the GSA
      Privacy Office, the System Owner must include the legal authority for collecting SSNs and why an alternative
      cannot be used.

      Statements:
      - pt-7.1_smt.a: System Owners and Data Owners are responsible for eliminating unnecessary collection,
      maintenance, and use of Social Security Numbers (SSNs), and exploring alternatives to their use as a
      personal identifier. When drafting a Privacy Impact Analyst or System of Record Notice for review by
      the GSA Privacy Office, the System Owner must include the legal authority for collecting SSNs and
      why an alternative cannot be used. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-7.1_smt.b: Under the [Privacy Act](<REDACTED_URL>), 1677(a), agencies are prohibited from denying an individual any right, benefit,
      or privilege provided by law because of the individual’s refusal to disclose his or her SSN unless
      disclosure is required by federal statute.

      Section 7(a)(1) of the Privacy Act (found at 5 U.S.C. § 552a note [Disclosure of Social Security
      Number]) states, “It shall be unlawful for any Federal, State or local government agency to deny to
      any individual any right, benefit, or privilege provided by law because of such individual’s refusal to
      disclose his social security account number.” GSA is compliant with these regulations. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-7.1_smt.c: GSA Privacy Program supplies templates and guidance on to how provide effective notice to the
      public and to individuals regarding: 1) its activities that impact privacy, including collection of social
      security numbers; 2) whether that disclosure is mandatory or voluntary; 3) authority for collecting
      social security number; and 4) how it will be used. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-pt-7-2
    name: 'CRM: PT-7(2) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-7(2) on GSA Common Controls.
      Unfulfilled requirements:

      The GSA Privacy Office ensures that GSA uses Personally Identifiable Information (PII) internally only for the
      authorized purpose(s) identified, and reviews processing activities to prohibit the processing of information
      describing how an individual exercises rights guaranteed by the First Amendment unless expressly authorized by
      statute or by the individual or unless pertinent to and within the scope of an authorized law enforcement
      activity.

      **Federal System-Specific Expectation:** System Owners are responsible for coordinating
      with the GSA Privacy Program to ensure that processing activities do not describe how an individual exercises
      rights guaranteed by the First Amendment unless expressly authorized by statute or by the individual or unless
      pertinent to and within the scope of an authorized law enforcement activity.
  - id: gsa-common-controls-component-definition-crm-pt-8
    name: 'CRM: PT-8 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PT-8 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Control Expectation:** System Owners must notify the GSA
      Privacy Office in the event that GSA needs to establish a computer matching program or agreement to share
      system of records information with other Federal or non-Federal agencies. A Data Integrity Board (DIB) will be
      created to review and approve such programs and agreements.

      The Computer Matching and Privacy Protection Act of 1988 (the Act), Pub.L.100-503, amends the Privacy Act of
      1974, and establishes procedural safeguards affecting agencies' use of Privacy Act records in performing certain
      types of computerized matching programs. The Act regulates the use of computer matching by federal agencies
      involving personally identifiable records maintained in a system of records subject to the Privacy Act. The Act
      requires agencies to have written agreements in place specifying the terms under which matches are to be
      conducted. The Act applies to the computerized comparison of two or more automated systems of records (or
      federal personnel or payroll systems of records) between federal agencies or between a federal agency and a
      non-federal agency.

      Statements:
      - pt-8_smt.a: System Owners must notify the GSA Privacy Office in the event GSA needs to establish computer
      matching programs or agreements to share system of records information with other Federal or non-
      Federal agencies. A Data Integrity Board (DIB) will be created to review and approve such programs
      and agreements. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-8_smt.b: System Owners and the GSA Privacy Office are responsible for establishing documentation describing
      the sharing of personal information among computerized systems of two or more Federal or non-
      Federal agencies. Generally, the shared information is used to determine the eligibility of individuals
      for Federal benefit programs or to identify delinquencies on obligations. The Privacy Officer is
      responsible for coordinating the development and clearing requests for computer matching systems
      and preparing and submitting Privacy Act, Computer Matching, and other reports to the Office of
      Management and Budget (OMB) as required. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-8_smt.c: The System Owner is responsible for coordinating with the GSA Privacy Act Officer in preparing a
      Privacy Act notice for publication in the Federal Register. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-8_smt.d: The GSA Data Integrity Board, headed by the Senior Agency Official for Privacy, oversees
      organizational Computer Matching Agreements (CMA) and ensures that any such agreements GSA
      may enter into are published on a public GSA website. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - pt-8_smt.e: Appeals of a DIB denial for a CMA must be submitted to the Director of OMB. GSA complies with the
      requirements of the Privacy Act to afford individuals the right to privacy of records that are
      maintained in systems of records and incorporates the provisions of the Computer Matching and
      Privacy Protection Act of 1988 ([Public Law 100-503](<REDACTED_URL>)),
      including the Computer Matching and Privacy Protection Amendments. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-ra-1
    name: 'CRM: RA-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for RA-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ra-1_smt.a: 1. The GSA risk assessment policy is defined in the GSA Order CIO 2100.1, “GSA Information
      Technology (IT) Security Policy,” which addresses purpose, scope, roles, responsibilities,
      management commitment, coordination among organizational entities, and compliance for risk
      assessment activities. This policy is consistent with applicable laws, executive orders, directives,
      regulations, policies, standards, and guidelines. This policy is disseminated GSA-wide via GSA’s
      InSite centralized agency [Directives website](<REDACTED_URL>).
      2. Risk assessment procedures are documented in CIO-IT Security-06-30: Managing Enterprise
      Cybersecurity Risk and other procedural guides referenced in it. The procedures facilitate the
      implementation of the risk assessment policy and associated controls. All GSA procedural guides
      are disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ra-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and GSA IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - ra-1_smt.c: The GSA OCISO is responsible for reviewing and updating:
      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. GSA’s procedural guides are updated at least every three years and following changes to
      Federal or GSA policies, requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ra-3
    name: 'CRM: RA-3 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for RA-3 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** The system ISSO, ISSM, and System Owner are responsible for ensuring
      their system risk assessments are reviewed, updated, and disseminated in accordance with GSA policies and
      guides.

      Statements:
      - ra-3_smt.a: [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy” and
      [CIO-IT Security-06-30](<REDACTED_URL>):
      Managing Enterprise Cybersecurity Risk require risk assessments to be performed as part of the
      initial assessment and authorization (A&A) of GSA information systems, including identifying threats
      and likelihoods of harm an impact to systems. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ra-3_smt.b: [CIO-IT Security-18-91](<REDACTED_URL>): Risk Management Strategy (RMS) describes how GSA integrates risk
      management across the organizational, mission/business, and information system levels. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ra-3_smt.c: CIO-IT Security-06-30 requires a Security Assessment Report (SAR) or similar assessment of risk be
      prepared based on which A&A process a system uses. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ra-3_smt.d: CIO-IT Security-06-30 requires risk assessments to be reviewed in accordance with the GSA
      authorization process used. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ra-3_smt.e: Risk assessment results (e.g., the SAR) are provided to security personnel responsible for the security
      of a GSA system as part of the A&A package during initial authorization and subsequent updates to
      the system’s authorization and operation. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - ra-3_smt.f: CIO-IT Security-06-30 requires risk assessments to be updated based on which A&A process a system
      uses and if a significant change to the system, its environment, or its risk posture is identified during
      monitoring or annual updates of the system’s A&A package. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-sa-1
    name: 'CRM: SA-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SA-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - sa-1_smt.a: 1. The GSA system and services acquisition policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance for system and services acquisition activities. This policy is consistent with applicable
      laws, executive orders, directives, regulations, policies, standards, and guidelines. This policy is
      disseminated GSA-wide via GSA’s InSite centralized agency [Directives website](<REDACTED_URL>).
      2. System and services acquisition procedures are documented in CIO-IT Security-09-48: Security
      and Privacy Requirements for IT Acquisition Efforts. The procedures facilitate the
      implementation of the system and services acquisition policy and associated controls. This guide
      is disseminated GSA-wide via GSA’s InSite centralized agency
      [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - sa-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - sa-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. CIO-IT Security-09-48 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-sa-4
    name: 'CRM: SA-4 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SA-4 on GSA Common Controls.
      Unfulfilled requirements:

      [GSA CIO-IT Security-09-48](<REDACTED_URL>): Security and Privacy Requirements for IT Acquisition Efforts provides
      contract language that must be included in contracts involving the acquisition of information systems
      to ensure compliance with the appropriate provisions of the Federal Information Security
      Modernization Act (FISMA), Office of Management and budget (OMB) [Circular A-130](<REDACTED_URL>),
      “Managing Information as a Strategic Resource,” [Federal Information Processing Standard (FIPS)](<REDACTED_URL>), and
      [National Institute of Technology (NIST) Special Publication (SP) 800-53, Revision 5](<REDACTED_URL>). The contract language
      specifies that acquisitions must meet the NIST SP 800-53 security controls specified per FIPS 199
      security categorization, including all SA-4 requirements which are applicable at all FIPS 199 levels.

      **Federal System-Specific Expectation:** System Owners are responsible for coordinating with Acquisition
      personnel to ensure the standardized contract language from CIO-IT Security-09-48 is included in their managed
      system’s acquisition contracts.
  - id: gsa-common-controls-component-definition-crm-sa-4-10
    name: 'CRM: SA-4(10) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SA-4(10) on GSA Common Controls.
      Unfulfilled requirements:

      GSA CIO-IT Security-09-48: Security and Privacy Requirements for IT Acquisition Efforts provides contract
      language that must be included in acquisition contracts involving the acquisition of information systems to
      ensure compliance with the appropriate provisions of Federal Information Security Modernization Act (FISMA),
      Office of Management and budget (OMB) [Circular A-130](<REDACTED_URL>), “Managing Information as a Strategic Resource,”
      [Federal Information Processing Standard (FIPS)](<REDACTED_URL>), and
      [National Institute of Technology (NIST) Special Publication (SP) 800-53, Revision 5](<REDACTED_URL>).

      **OCSIO Planned Control:** Update CIO-IT Security-09-48 guidance to specify only information technology products
      on the FIPS 201-approved products list for Personal Identity Verification (PIV) capability implemented within
      organizational systems.
  - id: gsa-common-controls-component-definition-crm-sa-8
    name: 'CRM: SA-8 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SA-8 on GSA Common Controls.
      Unfulfilled requirements:

      [CIO-IT Security-09-48](<REDACTED_URL>): Security and Privacy Requirements for IT Acquisition Efforts and [CIO-IT Security-19-95](<REDACTED_URL>):
      Security Engineering Architecture Reviews require security architectures to be reviewed and approved by the
      OCISO Security Engineering (ISE) Division.

      **Federal System-Specific Expectation:** The system’s ISSO, ISSM, and System Owner are
      responsible for ensuring system architectures are submitted to ISE for obtaining initial deployment approval
      and, as major changes occur, are planned for implementation approval.
  - id: gsa-common-controls-component-definition-crm-sa-9
    name: 'CRM: SA-9 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SA-9 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners and Contracting Officers/
      Contracting Officer Representatives (CORs) are responsible for ensuring external system services comply with
      organizational security and privacy requirements. They are responsible for defining and documenting
      organizational oversight and user roles and responsibilities within their external system service’s contract
      language, ISA, and service level agreements.

      Statements:
      - sa-9_smt.a: [CIO-IT Security-09-48](<REDACTED_URL>): Security and Privacy Requirements for IT Acquisition Efforts requires all GSA
      IT acquisitions to comply with [CIO-IT Security-06-30](<REDACTED_URL>): Managing Enterprise Cybersecurity Risk, which
      requires systems to meet the requirements of Federal Information Security Modernization Act
      (FISMA), Office of Management and Budget (OMB), and National Institute of Standards and
      Technology (NIST) as part of the Authorization to Operate (ATO) process. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - sa-9_smt.b: Per [GSA Order CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy, all interconnections
      between GSA and external entities, including off site contractors or Federal agency/departments,
      must be documented in an Interconnection Security Agreement (ISA) that is approved by the AOs
      and concurred by the GSA CISO. The approved ISA shall define and document the organizational
      oversight and user roles and responsibilities regarding the external system services provided. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - sa-9_smt.c: CIO-IT Security-09-48 specifies the required contractual language. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-sc-1
    name: 'CRM: SC-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SC-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - sc-1_smt.a: 1. The GSA system and communications protection policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance for system and communications protection activities. This policy is consistent with
      applicable laws, executive orders, directives, regulations, policies, standards, and guidelines. This
      policy is disseminated GSA-wide via GSA’s InSite centralized agency [Directives website](<REDACTED_URL>).
      2. GSA OCISO Policy and Compliance (ISP), Security Engineering (ISE), and the Security Operations
      (ISO) Divisions (ISO) have developed, in collaboration, several technical and procedural guides
      addressing securely configuring components, access control, key management, Transport Layer
      Security/Secure Sockets Layer, firewall changes, etc. which address procedures involving
      systems and communication protection. These guides are disseminated GSA-wide via GSA’s
      InSite centralized agency websites for [IT Security Procedural Guides](<REDACTED_URL>) and
      [IT Security Technical Guides and Standards](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - sc-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - sc-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
      guidance.
      2. Technical and procedural guides every three years and following changes to Federal or GSA
      policies. SC controls are covered in multiple procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-sc-18
    name: 'CRM: SC-18 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SC-18 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners must ensure only acceptable
      mobile code technologies approved by the GSA IT Standards Software Approval Process are utilized and tracked
      per the system’s software inventory.

      Statements:
      - sc-18_smt.a: The Office of the Chief Technology Officer (OCTO) is responsible for GSA’s enterprise architecture,
      part of which is the GSA IT Standards list that identifies acceptable and unacceptable software usage,
      including mobile code technologies. The CTO has final approval authority for any software used to
      process, store, or transmit GSA's data. Software usage approval begins with security and accessibility
      assessments at a minimum, and is followed by the OCTO’s review for alignment with the Federal
      Information Technology Acquisition Reform Act ([FITARA]()) and GSA's [Digital Strategy](). Final
