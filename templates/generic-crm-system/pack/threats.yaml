      The tailoring process included:

      1. Identifying inherited common controls from GSA enterprise systems and cloud.gov
      2. Applying appropriate scoping considerations based on the system architecture
      3. Providing implementation specifications for organization-defined parameters
      4. Adding controls beyond the baseline where necessary to address specific risks
