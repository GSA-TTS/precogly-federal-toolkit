    name: 'CRM: AU-8 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-8 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github uses internal system clocks to generate timestamps for all audit records. These timestamps use Coordinated Universal Time (UTC) and are synchronized with authoritative time sources. For this FIPS 199 Low system, time synchronization occurs at minimum daily, and timestamps have a granularity of seconds, meeting GSA requirements.

      Statements:
      - au-8_smt: **GSA Pages Tenant:** GSA Github uses internal system clocks to generate timestamps for all audit records. These timestamps use Coordinated Universal Time (UTC) and are synchronized with authoritative time sources. For this FIPS 199 Low system, time synchronization occurs at minimum daily, and timestamps have a granularity of seconds, meeting GSA requirements.
  - id: gsa-pages-component-definition-crm-au-9
    name: 'CRM: AU-9 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-9 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github protects audit logs through several mechanisms:

      1. Access controls restrict the viewing and management of audit logs to authorized administrators only
      2. Read-only audit logs prevent modification of log entries once they are recorded
      3. Tamper-evident mechanisms ensure that any attempt to modify logs would be detected
      4. Encryption protects log data at rest and in transit

      Github has alerting mechanisms in place to notify administrators upon detection of unauthorized access, modification, or deletion attempts against audit information. These alerts are sent to designated GSA personnel in accordance with GSA's security policies.

      Statements:
