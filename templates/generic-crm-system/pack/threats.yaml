      This System:
  - id: gsa-pages-component-definition-crm-sr-8
    name: 'CRM: SR-8 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-8 on GSA Pages.
      Unfulfilled requirements:

      GSA has established comprehensive notification agreements and procedures with its supply chain entities to ensure timely awareness of security issues that may impact GSA systems and services:

      a. **Agreements Established with Supply Chain Entities:**

         GSA incorporates notification requirements into contractual agreements with vendors, suppliers, and service providers through:

         - Standard contract clauses requiring prompt notification of security incidents and vulnerabilities
         - Supplemental agreements with critical technology providers specifying detailed notification procedures
         - Service Level Agreements (SLAs) that include security notification requirements
         - Memoranda of Understanding (MOUs) with key vendors defining security notification obligations
         - Non-disclosure agreements facilitating the sharing of sensitive vulnerability information

      b. **Notification Procedures:**

         GSA has established procedures that:

         - Define timeframes for notification based on the severity and potential impact of the issue
         - Specify secure communication channels for reporting security incidents
         - Outline the required content and format for notifications
         - Establish points of contact within both GSA and supplier organizations
         - Detail escalation procedures for critical security events
         - Include verification protocols to authenticate notifications
         - Provide templates for consistent reporting

      c. **Scope of Required Notifications:**

         These agreements and procedures specifically address notification of:

         - Supply chain compromises affecting GSA systems or data
         - System security compromises that may impact GSA operations
         - Information system vulnerabilities discovered in products and services
         - Unauthorized configuration changes to delivered products
         - Discovery of counterfeit or tampered components
         - Detection of malicious software in delivered products
         - Hardware tampering or unauthorized modifications
         - Third-party dependencies that become compromised
         - Changes in company ownership or control that may affect security
         - Breaches affecting supplier development or delivery systems

      For systems where a Security Impact Analysis has been completed, GSA requires enhanced notification procedures with more stringent timeframes and detailed reporting requirements. The GSA OCISO C-SCRM team maintains oversight of these notification agreements and regularly reviews their effectiveness through compliance checks, tabletop exercises, and analysis of actual notification events.

        - notification-agreements



