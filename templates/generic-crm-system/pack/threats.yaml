  - id: gsa-pages-component-definition-crm-ca-9
    name: 'CRM: CA-9 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CA-9 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages authorizes and documents internal system connections between its components. The system primarily consists of GitHub for source code management and the cloud.gov Pages publishing platform. These internal connections have been explicitly authorized as part of the system's security authorization process.

      For each internal connection, GSA Pages maintains documentation that includes:

      1. Interface characteristics - Details of the API calls, service connections, and data exchange methods between components
      2. Security requirements - Authentication methods, encryption requirements, and other security controls for internal connections
      3. Privacy requirements - Controls to protect any sensitive information that may traverse internal connections
      4. Nature of information communicated - Description of the data types and content that flow between internal components

      Internal connections to system components are reviewed annually and whenever significant changes occur to the system to evaluate their continued need. These reviews are conducted by the system owner and security team to ensure that only necessary connections remain active. Any connection that is no longer required is terminated in accordance with GSA policy.

      The system monitors internal connections for unusual or suspicious activity, and automated termination of inactive connections occurs after the AO-approved time period.

      Statements:
