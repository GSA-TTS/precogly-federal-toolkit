  - id: gsa-pages-component-definition-crm-sr-3
    name: 'CRM: SR-3 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-3 on GSA Pages.
      Unfulfilled requirements:

      GSA has established comprehensive processes and controls to address supply chain risks across the lifecycle of its IT systems, components, and services:

      a. GSA OCISO C-SCRM has established a structured process to identify and address weaknesses in the supply chain elements and processes through:

         - Regular assessments of supplier security practices using standardized questionnaires and evaluation criteria
         - Security reviews of system components and software prior to acquisition
         - Continuous monitoring of vendors and product security vulnerabilities
         - Coordination with cross-functional stakeholders including the Privacy Office, Enterprise Architecture, Security Engineering, System Owners, ISSOs, ISMs, AOs, and Contracting Officers
         - Regular threat intelligence sharing related to supply chain risks
         - Supplier performance monitoring and tracking
         - Documentation of identified weaknesses and remediation plans in the GSA Continuous Monitoring Management Platform

      b. GSA employs the following controls to protect against supply chain risks:

         - Implementation of FISMA-required minimum-security controls as documented in applicable GSA SSPP templates
         - Tailoring of controls in accordance with the NIST Risk Management Framework based on system categorization and risk assessment
         - Supplier contractual requirements for security controls and practices
         - Software composition analysis and vulnerability scanning for third-party components
         - Hardware verification and validation procedures
         - Secure configuration management practices
         - Multifactor authentication for access to critical supply chain systems
         - Least privilege access controls for supply chain management systems
         - Incident management procedures specific to supply chain events
         - Contingency planning for supply chain disruptions
         - Secure development practices requirements for custom software

      c. GSA documents all selected and implemented supply chain processes and controls in:
         - The GSA C-SCRM Plan
         - System Security and Privacy Plans (SSPPs) for affected systems
         - Acquisition security requirements and documentation
         - Vendor management documentation
         - Risk assessment reports
         - Continuous monitoring plans

      The GSA OCISO C-SCRM team regularly reviews and updates these processes and controls to address emerging supply chain threats and vulnerabilities, changing federal requirements, and lessons learned from supply chain incidents or exercises.

        - supply-chain-controls-and-processes



