  - id: gsa-pages-component-definition-crm-au-12
    name: 'CRM: AU-12 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-12 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github provides comprehensive audit record generation capability for the security-relevant event types identified in AU-2. Github administrators can select which event types are logged for specific components of the system, allowing for appropriate coverage based on security requirements.

      The audit records generated include all required content as defined in AU-3, including what event occurred, when and where it happened, the source, outcome, and identity of individuals associated with the event.

      Event types logged include:
      - Repository creation, modification, and deletion
      - Code commits and changes
      - Branch protection rule modifications
      - User access changes and permission updates
      - Authentication events (successful and failed)
      - Administrative actions

      Statements:
