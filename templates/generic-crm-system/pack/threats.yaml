  - id: gsa-pages-component-definition-crm-ca-8
    name: 'CRM: CA-8 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CA-8 on GSA Pages.
      Unfulfilled requirements:

      This System:

      For systems in scope per the defined parameter, the GSA OCISO PEN Testing team can provide penetration
      testing in support of GSA information systems’ A&A activities and annually per testing requirements defined by
      CIO-IT Security-06-30: Managing Enterprise Cybersecurity Risk and CIO-IT Security-11-51: Conducting
      Penetration Test Exercises. If the GSA OCISO PEN Testing team is used:

      * This control becomes hybrid between the GSA OCISO PEN Testing team and the system.
      * A Penetration Test Rules of Engagement (RoE) is documented prior to starting testing activities to
      minimize the potential for service disruptions, damage, or loss of system integrity. The RoE outlines the
      responsibilities and limitations of the GSA OCISO PEN Testing team and system personnel throughout
      the testing processes.

      **Federal System-Specific Expectation:** For systems that do not have an applicable
      penetration testing requirement, control CA-8 must be documented as not required in the system’s CA-8
      control response.

      If the GSA OCISO PEN Testing team performs a system’s penetration testing, the System Owner, ISSO, and ISSM
      must coordinate with the OCISO PEN Testing team’s penetration testing services.

      AOs/System Owners may elect to contract an external penetration testing vendor for meeting their system’s
      penetration testing requirements, making the control system specific. The third party must complete the
      minimum requirements set forth by CIO-IT Security-11-51. If the penetration testing is performed by an external
      vendor, the resultant report must reflect the external vendor penetration testing of the system boundary.

        - hybrid-control

