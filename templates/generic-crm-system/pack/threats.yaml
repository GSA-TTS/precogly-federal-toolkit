  - id: gsa-pages-component-definition-crm-cm-11
    name: 'CRM: CM-11 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CM-11 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages implements strict controls for user-installed software in accordance with GSA IT Security Procedural Guide 01-05 Configuration Management:

      1. **Software Installation Policies:**
         - Software installation on GSA Pages servers follows a controlled deployment process through CI/CD pipelines
         - Only approved software packages can be included in application deployments
         - Software dependencies are managed through package managers with explicit versioning
         - All software installations require code review and approval through pull requests

      2. **Policy Enforcement Methods:**
         - Container-based deployments with immutable infrastructure prevent runtime software installation
         - GitHub Actions workflows enforce approved dependency installation processes
         - Infrastructure-as-code templates define allowed software components
         - Repository branch protection prevents unauthorized code modifications
         - Dependency management tools enforce approved sources and versions

      3. **Compliance Monitoring:**
         - Continuous monitoring of deployed software through automated scanning tools
         - Scheduled vulnerability scans to identify unauthorized software
         - Dependency audit logs to track package installations
         - Git commit history provides an audit trail of software changes
         - File integrity monitoring detects unauthorized modifications

      4. **Response to Unauthorized Software:**
         - Unauthorized software is promptly removed when discovered
         - The system is restored to a known-good state using automated deployment pipelines
         - Incidents are documented in accordance with GSA Incident Response Handbook
         - Root cause analysis is performed to identify and address process gaps
         - Controls are updated as needed to prevent similar occurrences

      This approach ensures that all software used within GSA Pages is properly vetted, approved, and securely installed according to GSA policies.

