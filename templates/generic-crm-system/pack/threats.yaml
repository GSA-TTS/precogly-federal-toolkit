  - id: gsa-pages-component-definition-crm-sc-12
    name: 'CRM: SC-12 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SC-12 on GSA Pages.
      Unfulfilled requirements:

      This System:

      Cloud.gov manages cryptographic keys in accordance with FIPS 140-2 requirements and GSA policies. The platform utilizes AWS Key Management Service (KMS) for key management operations, ensuring that all keys used for data encryption are properly secured, rotated, and backed up according to federal standards.

      For TLS certificates, Cloud.gov leverages automated certificate management through Let's Encrypt, ensuring that certificates are properly issued, validated, and renewed before expiration. This automated approach prevents disruptions due to expired certificates and maintains continuous availability of encrypted services.

      To ensure information availability in the event of key loss, Cloud.gov:
      1. Implements automated key backup procedures
      2. Maintains secure key escrow capabilities
      3. Uses hierarchical key management structures to allow for key recovery
      4. Ensures redundant storage of encryption keys

      All cryptographic operations within Cloud.gov utilize FIPS 140-2 validated cryptographic modules, and key management operations follow NIST SP 800-57 recommendations.

        - crypto-key-management

      Statements:
      - sc-12_smt: This System:

      Cloud.gov manages cryptographic keys in accordance with FIPS 140-2 requirements and GSA policies. The platform utilizes AWS Key Management Service (KMS) for key management operations, ensuring that all keys used for data encryption are properly secured, rotated, and backed up according to federal standards.

