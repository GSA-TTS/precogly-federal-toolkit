    name: 'CRM: SA-8 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SA-8 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages incorporates security and privacy engineering principles throughout the specification, design, development, implementation, and modification of the system. The following principles are applied:

      1. **Least Privilege:**
         - Role-based access control is implemented for administrative functions
         - Access permissions are granted based on job responsibilities
         - Administrative access is limited to authorized personnel

      2. **Least Functionality:**
         - System components are configured to provide only essential capabilities
         - Unnecessary services and features are disabled
         - Default configurations are modified to remove unnecessary functionality

      3. **Economy of Mechanism:**
         - The system architecture is kept as simple as possible
         - Complex solutions are avoided when simpler alternatives are available
         - Static site generation reduces the attack surface by eliminating dynamic components

      4. **Layered Protection:**
         - Multiple security controls are implemented at different levels
         - Network security, application security, and data security measures are combined
         - Defense-in-depth approach is used throughout the system architecture

      5. **Open Design:**
         - Security mechanisms do not rely on secrecy of the design
         - Open source components are used where possible to enable community review
         - Documentation clearly describes security controls and implementation

      6. **Human Factored Security:**
         - User interfaces are designed to minimize security errors
         - Security functions are intuitive and user-friendly
         - Clear feedback is provided on security-related actions

      7. **Secure Defaults:**
         - Default configurations are secure without requiring user modifications
         - Security features are enabled by default
         - Permissive settings require explicit configuration

      8. **Trusted Components:**
         - Only approved and verified components are used in the system
         - Third-party dependencies are managed and regularly updated
         - Components are obtained from trusted sources

      9. **Defense in Depth:**
         - Security controls are layered to provide multiple protection mechanisms
         - Compensating controls are implemented where primary controls may fail
         - Multiple validation points are used throughout the system

      10. **Secure Failure:**
          - System components fail securely without exposing sensitive information
          - Error handling is designed to prevent information disclosure
          - System recovers to a secure state after failures

      These principles are applied during all stages of the system lifecycle, including during the continuous integration and delivery process. Security and privacy reviews are conducted during design and code reviews to ensure adherence to these principles.

