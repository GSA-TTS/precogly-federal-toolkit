  - id: gsa-pages-component-definition-crm-au-2
    name: 'CRM: AU-2 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-2 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** Cloud.gov Github leverages GSA Github and provides extensive audit logging capabilities including all user activity, security changes, and git repository events. GSA Website Managers are responsible for regularly reviewing the audit logs within their GSA Github organization repositories. Github activity logs include full detail for security-relevant activities including user identity, timestamp, action performed, and affected resources.

      Statements:
