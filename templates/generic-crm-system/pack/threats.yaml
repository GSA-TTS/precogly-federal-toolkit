    name: 'CRM: CM-5 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CM-5 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages enforces access restrictions associated with changes to the system through a combination of physical and logical controls:

      1. **Physical access restrictions:**
         - All system hardware components are hosted in cloud.gov FedRAMP-authorized AWS environments
         - Physical access controls to these facilities are inherited from cloud.gov and AWS

      2. **Logical access restrictions:**
         - All system changes follow a structured workflow using GitHub repositories
         - Branch protection rules are enforced on all production repositories:
           - Direct commits to the main/production branch are prohibited
           - Pull requests require at least one review from another team member
           - Automated tests must pass before changes can be merged
         - Access to GitHub repositories is managed through GitHub teams with defined roles
         - Only authorized GSA Website Managers can add or remove content contributors
         - All access to repositories follows the principle of least privilege

