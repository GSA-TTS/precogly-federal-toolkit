      1. CIO-IT Security-06-29 every three years and following changes to Federal or GSA policies,
      requirements, or guidance. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
  - id: gsa-common-controls-component-definition-crm-ia-1
    name: 'CRM: IA-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for IA-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - ia-1_smt.a: 1. The GSA identification and authentication policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
