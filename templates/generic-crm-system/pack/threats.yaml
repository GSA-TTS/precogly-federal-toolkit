      b. GSA verifies that all non-escorted personnel performing maintenance on information systems have the required access authorizations. This verification occurs through various means including:
         - Checking personnel identification against the list of authorized maintenance personnel
         - Verifying appropriate background investigation status
         - Confirming technical qualifications
         - Ensuring proper security clearance levels when required

      c. When maintenance personnel do not have required access authorizations, GSA designates organizational personnel with appropriate access authorizations and technical competence to supervise maintenance activities. These supervisors:
         - Must have the appropriate level of access authorization
