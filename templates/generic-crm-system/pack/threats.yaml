  - id: gsa-pages-component-definition-crm-ia-2-8
    name: 'CRM: IA-2(8) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for IA-2(8) on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages implements replay-resistant authentication mechanisms for both privileged and non-privileged accounts by leveraging the authentication services provided by GitHub and cloud.gov UAA. These mechanisms include:

      1. **Time-based One-Time Password (TOTP):**
         - GitHub and cloud.gov UAA support TOTP authenticators for multi-factor authentication
         - TOTP generates a temporary numeric code based on the current time and a shared secret
         - Each code is valid only for a short period (typically 30 seconds)
         - Once used, a TOTP code cannot be reused for authentication

      2. **Challenge-Response Mechanisms:**
         - Hardware security keys (FIDO U2F/WebAuthn) generate unique cryptographic responses for each authentication challenge
         - Each response is specific to the current authentication session and cannot be replayed

      3. **Token-based Authentication:**
         - OAuth 2.0 and OpenID Connect protocols using short-lived access tokens
         - Tokens include timestamps and unique session identifiers
         - Once expired, tokens cannot be reused for authentication

      4. **Transport Layer Security:**
         - All authentication traffic is encrypted using TLS
         - TLS session identifiers and timestamps help prevent replay attacks

      For GSA staff, additional replay resistance is provided through GSA GSAauth integration, which implements similar time-based and challenge-response mechanisms. These replay-resistant authentication mechanisms are enforced for all users accessing the GSA Pages system, regardless of privilege level.

      Statements:
      - ia-2.8_smt: **GSA Pages Tenant:** GSA Pages implements replay-resistant authentication mechanisms for both privileged and non-privileged accounts by leveraging the authentication services provided by GitHub and cloud.gov UAA. These mechanisms include:

