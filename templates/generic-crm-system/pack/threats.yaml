      - cp-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - cp-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
