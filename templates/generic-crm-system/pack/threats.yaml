  - id: gsa-pages-component-definition-crm-ca-7-4
    name: 'CRM: CA-7(4) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for CA-7(4) on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Pages incorporates risk monitoring as part of its continuous monitoring strategy through the following activities:

      **Effectiveness Monitoring:**
      - Regular vulnerability scans and security assessments to evaluate the effectiveness of implemented security controls
      - Analysis of security incident data and metrics to determine if existing controls are effectively mitigating identified risks
      - Review of threat intelligence to evaluate if current security posture is effective against emerging threats
      - Code scanning during the CI/CD process to validate the effectiveness of secure development practices

      **Compliance Monitoring:**
      - Regular reviews to ensure adherence to GSA security policies and requirements
      - Validation that required controls are properly implemented and functioning
      - Periodic self-assessment of control implementation to verify compliance with FISMA, NIST, and GSA security requirements
      - Monitoring to ensure that all website content published through GSA Pages meets federal website requirements

      **Change Monitoring:**
      - Change management processes to track and evaluate system changes that could impact security posture
      - Monitoring of GitHub repository activities to detect unauthorized or unusual changes
      - Tracking of environmental changes (cloud infrastructure, dependencies) that might affect security risk
      - Review of proposed changes to ensure they do not introduce new security vulnerabilities

      The results of these monitoring activities are documented and used to inform risk-based decisions about the system. Regular reports on the status of risk monitoring activities are provided to system stakeholders and management.

      Statements:
      - ca-7.4_smt: **GSA Pages Tenant:** GSA Pages incorporates risk monitoring as part of its continuous monitoring strategy through the following activities:

      **Effectiveness Monitoring:**
