    name: 'CRM: SR-10 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-10 on GSA Pages.
      Unfulfilled requirements:

      GSA has implemented a comprehensive inspection program for systems and components to detect tampering before they are deployed in GSA environments:

      GSA OCISO C-SCRM conducts targeted inspections of selected incoming IT equipment, firmware, software, hardware, and system services using a risk-based approach. The inspection process includes:

      1. **Hardware and Physical Component Inspection**:
         - Visual inspection of packaging for signs of tampering or counterfeiting
         - Verification of warranty seals, holograms, and anti-counterfeit markings
         - Examination of components for unexpected materials, discoloration, or physical alterations
         - Checking for broken/uneven labels, missing screws, or other physical irregularities
         - Verification of serial numbers and part numbers against manufacturer records
         - Weight comparison with manufacturer specifications
         - Inspection of circuit boards for unauthorized components or modifications

      2. **Software and Firmware Verification**:
         - Digital signature verification of software packages and firmware images
         - Cryptographic hash verification against vendor-provided baselines
         - Binary analysis to identify potentially malicious code
         - Automated scanning for known vulnerabilities and backdoors
         - Verification of version numbers and build dates against vendor records
         - Analysis of installation packages for unexpected components or behavior

      3. **Documentation and Process Controls**:
         - Verification of chain of custody documentation for high-risk components
         - Secure receiving and storage procedures to prevent post-delivery tampering
         - Documentation of inspection results with photographs or other evidence
         - Segregation of duties between those performing inspections and system administrators
         - Controlled access to components awaiting inspection and after inspection
         - Secure facilities for conducting inspections of sensitive components

      4. **Risk-Based Selection Process**:
         - Critical infrastructure components receive the most rigorous inspection
         - Components from higher-risk suppliers undergo enhanced scrutiny
         - New vendors or supply sources trigger additional inspection requirements
         - Random sampling of components from established, trusted suppliers
         - Full inspection of any components where anomalies are reported

      For particularly sensitive systems or components, GSA may employ specialized third-party testing services to conduct more in-depth analysis, including x-ray inspection, advanced electronic testing, or destructive testing of sample components.

      Any components that fail inspection or show signs of tampering are quarantined, documented, reported to the supplier, and subject to further investigation by security personnel before being returned or destroyed.

        - inspection-of-systems-or-components



      This System:

      Statements:
      - sr-10_smt: GSA has implemented a comprehensive inspection program for systems and components to detect tampering before they are deployed in GSA environments:

      GSA OCISO C-SCRM conducts targeted inspections of selected incoming IT equipment, firmware, software, hardware, and system services using a risk-based approach. The inspection process includes:

      1. **Hardware and Physical Component Inspection**:
         - Visual inspection of packaging for signs of tampering or counterfeiting
         - Verification of warranty seals, holograms, and anti-counterfeit markings
         - Examination of components for unexpected materials, discoloration, or physical alterations
         - Checking for broken/uneven labels, missing screws, or other physical irregularities
         - Verification of serial numbers and part numbers against manufacturer records
         - Weight comparison with manufacturer specifications
         - Inspection of circuit boards for unauthorized components or modifications

      2. **Software and Firmware Verification**:
         - Digital signature verification of software packages and firmware images
         - Cryptographic hash verification against vendor-provided baselines
         - Binary analysis to identify potentially malicious code
         - Automated scanning for known vulnerabilities and backdoors
         - Verification of version numbers and build dates against vendor records
         - Analysis of installation packages for unexpected components or behavior

      3. **Documentation and Process Controls**:
         - Verification of chain of custody documentation for high-risk components
         - Secure receiving and storage procedures to prevent post-delivery tampering
         - Documentation of inspection results with photographs or other evidence
         - Segregation of duties between those performing inspections and system administrators
         - Controlled access to components awaiting inspection and after inspection
         - Secure facilities for conducting inspections of sensitive components

      4. **Risk-Based Selection Process**:
         - Critical infrastructure components receive the most rigorous inspection
         - Components from higher-risk suppliers undergo enhanced scrutiny
         - New vendors or supply sources trigger additional inspection requirements
         - Random sampling of components from established, trusted suppliers
         - Full inspection of any components where anomalies are reported

      For particularly sensitive systems or components, GSA may employ specialized third-party testing services to conduct more in-depth analysis, including x-ray inspection, advanced electronic testing, or destructive testing of sample components.

      Any components that fail inspection or show signs of tampering are quarantined, documented, reported to the supplier, and subject to further investigation by security personnel before being returned or destroyed.

        - inspection-of-systems-or-components



      This System:
  - id: gsa-pages-component-definition-crm-sr-11
    name: 'CRM: SR-11 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-11 on GSA Pages.
      Unfulfilled requirements:

      GSA has developed and implemented comprehensive anti-counterfeit policies and procedures to ensure the authenticity of components used in GSA systems:

      a. Anti-counterfeit policy and procedures:

         **Policy Elements:**
         - Formal anti-counterfeit policy documented in GSA IT Security Policy 2100.1
         - Requirements for purchasing from authorized suppliers and distributors
         - Risk-based approach to component verification based on criticality and sensitivity
         - Clear roles and responsibilities for counterfeit prevention
         - Integration with GSA's overall supply chain risk management program
         - Compliance requirements for contractors and vendors supplying IT components

         **Detection Procedures:**
         - Visual inspection protocols for identifying counterfeit components
         - Authentication of product identifiers, serial numbers, and other markings
         - Verification of packaging, documentation, and certificates of conformance
         - Testing procedures for component functionality and performance
         - Digital signature verification for software and firmware
         - Security scanning of components before deployment
         - Staff training on counterfeit identification techniques
         - Maintenance of a reference library of authentic components for comparison

         **Prevention Procedures:**
         - Approved vendor lists and preferred supplier programs
         - Contractual requirements for suppliers to implement anti-counterfeit measures
         - Chain of custody documentation requirements
         - Secure transportation and storage requirements
         - Supplier qualification and assessment processes
         - Traceability requirements from original component manufacturers
         - Advanced procurement planning to avoid emergency purchases from unauthorized sources
         - Security controls for disposal to prevent reintroduction of used components as new

      b. Reporting procedures:

         When counterfeit components are detected, GSA personnel are required to:
         - Report immediately to the GSA OCISO
         - Document the counterfeit finding with evidence (photographs, test results)
         - Report to the source of the counterfeit component
         - Report to the Federal Acquisition Security Council (FASC)
         - Report to the Government-wide Cyber Acquisition and Supply Chain Risk Management Program (govCAP)
         - Report to US-CERT
         - Quarantine the counterfeit components to prevent use
         - Preserve evidence for potential investigation or legal action
         - Conduct root cause analysis to identify process improvements

         GSA maintains templates and procedures for each reporting channel to ensure complete and consistent information sharing. The OCISO tracks all counterfeit incidents and coordinates appropriate responses with internal stakeholders and external agencies.

        - component-authenticity



