      platform. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - sc-18_smt.b: The GSA IT Standards list identifies if software is proposed, approved, approved as an exception, or
      denied, including any mobile code technologies. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-si-1
    name: 'CRM: SI-1 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SI-1 on GSA Common Controls.
      Unfulfilled requirements:

      Statements:
      - si-1_smt.a: 1. The GSA system and information integrity policy is defined in GSA Order CIO 2100.1, “GSA
      Information Technology (IT) Security Policy,” which addresses purpose, scope, roles,
      responsibilities, management commitment, coordination among organizational entities, and
      compliance for system and information integrity activities. This policy is consistent with
      applicable laws, executive orders, directives, regulations, policies, standards, and guidelines. This
      policy is disseminated GSA-wide via GSA’s InSite centralized agency [Directives website](<REDACTED_URL>).

      2. System and information integrity procedures are documented in CIO-IT Security-12-63: System
      and Information Integrity (SI). The procedures facilitate the implementation of the system and
      information integrity policy and associated controls. This guide is disseminated GSA-wide via
      GSA’s InSite centralized agency [IT Security Procedural Guides website](<REDACTED_URL>). ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - si-1_smt.b: Per 2100.1, the CISO is responsible for managing the development and publishing of all security
      policies and IT security procedural guides. ([common-control] Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs.)
      - si-1_smt.c: The GSA OCISO is responsible for reviewing and updating:

      1. CIO 2100.1 annually and following changes to Federal or GSA policies, requirements, or
