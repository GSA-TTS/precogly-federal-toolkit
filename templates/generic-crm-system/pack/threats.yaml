  - id: gsa-pages-component-definition-crm-au-4
    name: 'CRM: AU-4 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-4 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github provides sufficient audit log storage capacity to accommodate audit log retention requirements. GSA Github maintains audit logs for at least 90 days, which aligns with GSA requirements for audit log retention.

      Statements:
      - au-4_smt: **GSA Pages Tenant:** GSA Github provides sufficient audit log storage capacity to accommodate audit log retention requirements. GSA Github maintains audit logs for at least 90 days, which aligns with GSA requirements for audit log retention.
  - id: gsa-pages-component-definition-crm-au-5
    name: 'CRM: AU-5 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-5 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github handles audit processing failures by notifying Github system administrators. For low-impact systems like GSA Pages, the notification timeframe is weekly, as required by GSA policy. When storage capacity issues occur, Github implements a FIFO (first-in, first-out) approach, overwriting the oldest logs to make space for new audit records.

      Statements:
      - au-5_smt: **GSA Pages Tenant:** GSA Github handles audit processing failures by notifying Github system administrators. For low-impact systems like GSA Pages, the notification timeframe is weekly, as required by GSA policy. When storage capacity issues occur, Github implements a FIFO (first-in, first-out) approach, overwriting the oldest logs to make space for new audit records.
  - id: gsa-pages-component-definition-crm-au-6
    name: 'CRM: AU-6 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-6 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github audit logs are reviewed weekly by GSA Website Managers for their respective repositories to identify any unauthorized or unusual activity. Any suspicious findings or potential security violations are reported to the GSA OCISO (Office of the Chief Information Security Officer) through established GSA security incident reporting channels.

      The audit review process includes examining account management activities, code repository changes, permission modifications, and authentication events. Special attention is given to failed login attempts, privilege escalation, and unusual access patterns.

      Statements:
      - au-6_smt: **GSA Pages Tenant:** GSA Github audit logs are reviewed by GSA Website Managers for their respective repositories to identify any unauthorized or unusual activity. Any suspicious findings or potential security violations are reported to the GSA OCISO (Office of the Chief Information Security Officer) through established GSA security incident reporting channels.

