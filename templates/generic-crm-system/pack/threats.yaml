  - id: gsa-common-controls-component-definition-crm-sr-11
    name: 'CRM: SR-11 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SR-11 on GSA Common Controls.
      Unfulfilled requirements:

      **Federal System-Specific Expectation:** System Owners must establish system-specific Component Authenticity
      procedures consistent with [NIST SP 800-161, Revision 1](<REDACTED_URL>), “Cybersecurity Supply Chain Risk Management
      Practices for Systems and Organizations” and [CIO-IT Security-Privacy-18-90](<REDACTED_URL>): Common Control Catalog (CCC).

      Statements:
      - sr-11_smt.a: [CIO 2100.1](<REDACTED_URL>), “GSA Information Technology (IT) Security Policy,” requires anti-counterfeit
      procedures be developed to include detection of counterfeit hardware or software components
      consistent with [National Institute of Technology (NIST) Special Publication (SP) 800-53, Revision 5](<REDACTED_URL>),
      if applicable. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
      - sr-11_smt.b: System Owners, ISSOs and ISSMs or system custodians on behalf of their System Owner are
      advised, per the [GSAM](<REDACTED_URL>) and GSA’s Incident Reporting (IR-6) guidance, to report the detection of a
      counterfeit system component to the GSA IT Service Desk as an incident. ([hybrid-control] Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system specific)
  - id: gsa-common-controls-component-definition-crm-sr-11-1
    name: 'CRM: SR-11(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SR-11(1) on GSA Common Controls.
      Unfulfilled requirements:

      GSA OCISO has established “Detecting Counterfeit Products” training. This anti-counterfeit training has been
      made available to all personnel who have a role in security operations, system development, and who perform
      the installation of IT components on behalf of a System Owner at GSA. The training is available to all personnel
      with access to GSA Online University and covers detection of counterfeit system components for software,
      hardware, and firmware.

      **Federal System-Specific Expectation:** System Owners must identify staff who perform the installation and
      development of IT system components (including hardware, software, and firmware) per their managed system
      boundary. System Owners must ensure their identified staff completes the anti-counterfeit training available on
      GSA Online University upon onboarding and annually thereafter.
  - id: gsa-common-controls-component-definition-crm-sr-2-1
    name: 'CRM: SR-2(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SR-2(1) on GSA Common Controls.
      Unfulfilled requirements:

      As defined by GSA’s SCRM Executive Board Charter, GSA has established a supply chain risk management team
      consisting of SCRM Senior Accountable Officials who form GSA’s SCRM Executive Board. The board provides
      oversight to any GSA SCRM working group(s) established to accomplish the following SCRM activities:

      * Analyze GSA’s supply chain and use risk-based approaches to address supply chain risks (including, but
      not limited to emerging risk information related to communications technology) to inform strategic
      and operational management decisions and investments.
      * Ensure policy development and resource management efforts include planning for and consideration
      of incident management, contingency, continuity, and response requirements.
      * Facilitate the coordinated alignment of GSA’s Government-wide responsibilities (e.g., policy, training,
      shared services, interagency engagement, customer agency-facing service, product offerings, real
      estate) with the internal GSA Enterprise responsibilities to safeguard and manage risk to GSA’s mission
      and its portfolio of assets.
      * Integrate SCRM policies, processes, and oversight activities into GSA’s internal acquisition processes
      and information and communication technology (ICT) investment and lifecycle management processes.
      * Provide guidance to internal GSA employees on supply chain risks and incorporate SCRM-relevant
      responsibilities and duties, where applicable.
      * Develop processes and procedures for supporting implementation of new statutory and regulatory
      requirements related to SCRM.
      * Develop processes and procedures for interfacing with external stakeholders on SCRM issues as
      defined in the SCRM Executive Board Charter. Stakeholders include the Federal Acquisition Security
      Council (FASC) Information Sharing, and Risk Management Task Force and the Department of
      Homeland Security ICT SCRM Working Group.

      The OCISO C-SCRM Team that exists within the ICAM Shared Services Division (ISI) serves as the C-SCRM Team
      for all GSA IT systems.

      **Non-GSA IT Federal System-Specific Expectation:** Establish a SCRM Team for the managed system(s) or
      organization for implementing a SCRM plan for the managed system(s) or organization consistent with
      [NIST SP 800-161, Revision 1](<REDACTED_URL>), “Cybersecurity Supply Chain Risk Management Practices for Systems and Organizations” and
      [CIO-IT Security-Privacy-18-90](<REDACTED_URL>): Common Control Catalog(CCC).
  - id: gsa-common-controls-component-definition-crm-sr-5
    name: 'CRM: SR-5 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for SR-5 on GSA Common Controls.
      Unfulfilled requirements:

      GSA acquisition requirements are defined in the General Services Administration Acquisition Manual ([GSAM](<REDACTED_URL>)),
      consistent with Federal Acquisition Regulations. These requirements are defined by the SCRM SAO and SCRM
      Review Board and are detailed on GSA’s internal [Cyber Supply Chain Risk Management (C-SCRM) web page](<REDACTED_URL>).
  - id: gsa-pages-component-definition-crm-ac-2
    name: 'CRM: AC-2 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AC-2 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** AC-2 is implemented as a hybrid control across cloud.gov Pages (platform), the GSA Pages Tech Team, and each GSA Pages Tenant, consistent with the Low SSP.

      1. **Platform Access (cloud.gov Pages/UAA):** MFA is required for all administrative users. Platform authentication and authorization leverage UAA and agency IdP integration; org/space roles are managed per tenant. Customer application accounts (outside UAA) remain the tenant’s responsibility.

      2. **GSA Pages Tech Team:** Manages platform organizations for tenants and approves partner access per IAA/MOU. Performs annual user recertification for system members and monthly separation-driven access reviews. Coordinates with TTS onboarding for staff access and enforces branch protections for production workflows.

      3. **GSA Pages Tenant (Website Managers):** Manages GitHub teams and repository permissions; onboards/offboards content contributors; reviews permissions at least annually; enforces peer review and protected branches. No direct access to deployed site storage—changes flow through GitHub and CI/CD pipelines.

      Account management activities include approvals, creation/enabling/modifying/disabling, monitoring usage, notifications for separations/transfers/role changes within 14 days, and alignment with GSA CIO 2100.1, CIO-IT Security-01-01, and CIO-IT Security-01-07.

      Statements:
      - ac-2_smt: **GSA Pages Tenant:** AC-2 is implemented as a hybrid control across cloud.gov Pages (platform), the GSA Pages Tech Team, and each GSA Pages Tenant, consistent with the Low SSP.

      1. **Platform Access (cloud.gov Pages/UAA):** MFA is required for all administrative users. Platform authentication and authorization leverage UAA and agency IdP integration; org/space roles are managed per tenant. Customer application accounts (outside UAA) remain the tenant’s responsibility.

      2. **GSA Pages Tech Team:** Manages platform organizations for tenants and approves partner access per IAA/MOU. Performs annual user recertification for system members and monthly separation-driven access reviews. Coordinates with TTS onboarding for staff access and enforces branch protections for production workflows.

      3. **GSA Pages Tenant (Website Managers):** Manages GitHub teams and repository permissions; onboards/offboards content contributors; reviews permissions at least annually; enforces peer review and protected branches. No direct access to deployed site storage—changes flow through GitHub and CI/CD pipelines.

      Account management activities include approvals, creation/enabling/modifying/disabling, monitoring usage, notifications for separations/transfers/role changes within 14 days, and alignment with GSA CIO 2100.1, CIO-IT Security-01-01, and CIO-IT Security-01-07.
  - id: gsa-pages-component-definition-crm-ac-3
    name: 'CRM: AC-3 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AC-3 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** Logical access to information and system resources is enforced per approved authorizations.

      **cloud.gov Pages:** The service has a single authorization model for the application; customer-configurable policies are limited to membership and role assignment in UAA-managed groups.

      **GSA Pages Tenant:** Users authenticate to cloud.gov UAA (with MFA) and are authorized via membership in the Cloud.gov Pages users group and organization roles (member/manager). Organization managers can invite new users, which also invites them to UAA and the Cloud.gov Pages users group.

      **GSA Website Managers:** Enforce repository access in GitHub via teams and branch protections as described in AC-2.

      This implementation aligns with the Low SSP description for AC-3 and is treated as a hybrid control across cloud.gov Pages and the tenant.

      Statements:
      - ac-3_smt: **GSA Pages Tenant:** Logical access to information and system resources is enforced per approved authorizations.

      **cloud.gov Pages:** The service has a single authorization model for the application; customer-configurable policies are limited to membership and role assignment in UAA-managed groups.

      **GSA Pages Tenant:** Users authenticate to cloud.gov UAA (with MFA) and are authorized via membership in the Cloud.gov Pages users group and organization roles (member/manager). Organization managers can invite new users, which also invites them to UAA and the Cloud.gov Pages users group.

      **GSA Website Managers:** Enforce repository access in GitHub via teams and branch protections as described in AC-2.

      This implementation aligns with the Low SSP description for AC-3 and is treated as a hybrid control across cloud.gov Pages and the tenant.
  - id: gsa-pages-component-definition-crm-ac-6-5
    name: 'CRM: AC-6(5) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AC-6(5) on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** Least privilege enforcement for privileged functions is supported via role scoping.

      **cloud.gov Pages:** Defines roles; customers must assign roles to enforce least privilege.

      **GSA Pages Tenant:** Website Managers assign GitHub teams and repository permissions to limit privileged functions (e.g., branch protection, required reviews). Administrative access to Cloud.gov Pages is restricted to managers; member roles cannot modify org membership.

      This is treated as a hybrid control; tenant configuration is required.

      Statements:
      - ac-6.5_smt: **GSA Pages Tenant:** Assign least-privilege roles in UAA (manager vs member) and GitHub (teams with minimal permissions), enforce branch protections and required reviews to constrain privileged functions.
  - id: gsa-pages-component-definition-crm-au-11
    name: 'CRM: AU-11 Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for AU-11 on GSA Pages.
      Unfulfilled requirements:

      **GSA Pages Tenant:** GSA Github retains audit logs for at least 90 days, which meets the requirements for a FIPS 199 Low impact system. These retained audit records provide support for after-the-fact investigations of security incidents and comply with GSA's organizational information retention requirements.

      Statements:
