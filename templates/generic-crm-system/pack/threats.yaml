      Unfulfilled requirements:

      The OCISO C-SCRM team develops, maintains, and annually updates a list of critical suppliers for GSA IT. The list
      is based on input from various sources for GSA-IT managed systems and includes software inventories,
      hardware inventories, and financials related to acquisitions. Supply chain risks that are unique for the most
      critical vendors are then incorporated into final determinations. Supplier assessments are conducted for the
      resultant set of critical vendors, and significant risks are addressed. The specific controls for maintaining the
      critical supplier list and conducting supplier reviews are identified within the C-SCRM Program’s SOPs.
