  - id: gsa-common-controls-component-definition-crm-pm-5
    name: 'CRM: PM-5 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-5 on GSA Common Controls.
      Unfulfilled requirements:

      The OCISO manages an up-to-date inventory of system inventory data within the GSA System Inventory hosted
      by its implementation of Archer Governance, Risk, and Compliance (GRC). Read-Only inventory data is
      replicated to GSA’s EA Analytics and Reporting (GEAR) site and made available for internal GSA usage. Inventory
      data managed for each information system includes, but is not limited to the following attributes:

      * System Name
      * System Alias/Acronym
      * FISMA System Identifier/Tag
      * Responsible IT Organization
      * Federal or Contractor Designation
      * FIPS 199 Impact level
      * Authority-to-Operate (ATO) Type
      * ATO Date
      * ATO Renewal Date
      * Contains Personally Identifiable Information (PII)
      * Cloud Hosted
  - id: gsa-common-controls-component-definition-crm-pm-5-1
    name: 'CRM: PM-5(1) Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-5(1) on GSA Common Controls.
      Unfulfilled requirements:

      The GSA OCISO and the GSA Privacy Office leverage the Archer GRC Agency System Inventory for maintaining an
      up-to-date inventory of GSA information systems, applications, and/or projects that process Personally
      Identifiable Information (PII). The GSA Privacy Office annually validates that the Agency System Inventory
      properly reflects all systems, applications and/or projects that process PII data. GSA FISMA systems that process
      PII are reflected in GEAR with an attribute of “Contains PII” for easy reporting.
  - id: gsa-common-controls-component-definition-crm-pm-6
    name: 'CRM: PM-6 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-6 on GSA Common Controls.
      Unfulfilled requirements:

      The GSA leadership team develops Information Security and Privacy Performance measures for each Fiscal year.
      These performance metrics are aligned with the GSA IT goals to operate efficiently, to deliver business value, to
      lead IT innovation across the Federal Government, and to continue to transform GSA IT. Performance metrics
      for each fiscal year are also influenced by external Office of Management and Budget (OMB) and Department of
      Homeland Security (DHS) reporting requirements and Federal Information Security Modernization Act (FISMA)
      metrics. The IS and ID performance metric progress and accomplishments are required to be reported to GSA
      leadership on a quarterly basis.

      GSA also provides security and privacy performance progress updates on GSA’s Information Security and Privacy
      Programs by responding to periodic OMB and DHS data calls. GSA currently provides responses to quarterly and
      annual FISMA metrics, Cybersecurity and Infrastructure Security Agency (CISA) Binding Operational Directives
      (BOD) and Emergency Directives (EDs), data calls and reporting within CyberScope, and reporting as required for
      actions within OMB Memorandums.
  - id: gsa-common-controls-component-definition-crm-pm-7
    name: 'CRM: PM-7 Responsibility Gap - GSA Common Controls'
    description: |-
      A customer responsibility gap exists for PM-7 on GSA Common Controls.
      Unfulfilled requirements:

      GSA’s Office of Enterprise Planning and Governance (IDR) in GSA IT is responsible for GSA’s enterprise
      architecture and for:

      * Developing and maintaining GSA’s current (As-Is) and target (To-Be) architecture and working with GSA
      business units to develop segment and solution architecture plans.
      * Developing the IT service strategy, design, and transition planning.
      * Developing and implementing IT Policy.

      [GSA Order CIO 2160.1](<REDACTED_URL>), “GSA Information Technology (IT) Standards Profile” ensures GSA acquisitions and use of
      information technology adhere to the IT Standards Profile. The IT Standards Profile is the official GSA repository
      of all approved software applications. It is managed by GSA IT and can be found at [ea.gsa.gov](<REDACTED_URL>).

      [GSA Order CIO 2110.4](<REDACTED_URL>), “GSA Enterprise Architecture Policy” utilizes GSA’s strategic goals, mission and support
      services, data, and enabling technologies to communicate the business vision and target architecture in
      conjunction with the GSA Performance Management, Capital Planning, and Investment Control (CPIC), and
      Solutions Life Cycle (SLC) processes.

      The GSA Enterprise Architecture follows GSA’s SLC methodology, which ensures holistic security, including
      enterprise architecture and governance, is incorporated into the system from inception rather than retrofitted
      after the fact.

      The following are security integration points with Enterprise Architecture:

      * Providing a common repository for application and FISMA inventory management
      * Reviewing of system architectures to ensure security compliance
      * Facilitating all testing needed for initial ATO and periodic reauthorizations
      * Providing on-request security consulting

      The Privacy Office and Security Engineering Division (ISE) in OCISO works closely with IDR and other Service and
      Staff Offices to facilitate integration of security standards/requirements into development efforts, ensuring
      secure outcomes as a matter of routine. Information Technology contracts are reviewed by the OCISO and
      Privacy Office before release to the public. System architectures are reviewed and approved as part of the ATO
      process. Architecture reviews are performed to ensure alignment of system architecture with current and to be
      enterprise architecture, meets requirements for critical controls (“show-stopper” controls) and adopts overall
      philosophy/approach for cyber security best practices and cyber hygiene.
  - id: gsa-common-controls-component-definition-crm-pm-7-1
    name: 'CRM: PM-7(1) Responsibility Gap - GSA Common Controls'
