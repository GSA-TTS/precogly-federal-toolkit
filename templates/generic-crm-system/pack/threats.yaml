      This System:
  - id: gsa-pages-component-definition-crm-sr-11-2
    name: 'CRM: SR-11(2) Responsibility Gap - GSA Pages'
    description: |-
      A customer responsibility gap exists for SR-11(2) on GSA Pages.
      Unfulfilled requirements:

      cloud.gov Pages maintains configuration control over technology equipment awaiting service or repair and those awaiting return to service through a comprehensive asset and configuration management process:

      1. **Pre-Service Configuration Control:**
         - Detailed documentation of hardware and software configurations before equipment is removed for service
         - Creation of configuration baselines for all equipment requiring service
         - Secure backup of configuration settings and data where applicable
         - Inventory tracking system to monitor equipment status throughout the repair process
         - Chain of custody documentation for equipment sent for external repairs
         - Sanitization of sensitive data before equipment leaves GSA control when possible

      2. **During-Service Tracking:**
         - Continuous monitoring of repair status through ticketing system
         - Verification that only authorized repairs and modifications are performed
         - Regular status updates on repair progress
         - Clear documentation of any parts replacements or configuration changes
         - Approval process for any significant modifications or upgrades
         - Secure transportation and storage requirements for equipment in transit

      3. **Post-Service Verification:**
         - Detailed inspection upon return from service
         - Configuration verification against pre-service baseline
         - Testing to ensure proper functionality and security
         - Assessment for any unauthorized modifications or tampering
         - Scanning for malware or unauthorized software before reconnection
         - Verification that all security controls and settings remain intact
         - Documentation of any authorized changes made during service

      4. **Special Handling for Sensitive Equipment:**
         - Enhanced processes for equipment that has processed sensitive data
         - On-site repair requirements for particularly sensitive systems
         - GSA personnel supervision of repair activities when required
         - Use of approved repair facilities with appropriate security clearances
         - Secure wipe procedures for storage media before external repair
         - Physical security controls for equipment awaiting service

      5. **Documentation and Tracking:**
         - Complete audit trail of all service and repair activities
         - Documentation of all configuration changes during repair
         - Updated asset inventory records following service completion
         - Secure retention of service records for accountability
         - Regular reconciliation of equipment in repair status

      Through these processes, cloud.gov Pages ensures that GSA technology equipment, including printers, scanners, and any IT component that has interacted with GSA system data, maintains proper configuration control throughout the service and repair lifecycle, protecting against unauthorized modifications or tampering.

        - configuration-control-for-component-service-and-repair



