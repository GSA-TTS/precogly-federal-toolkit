countermeasures:
  - id: cloudgov-credhub-secrets
    name: Use CredHub for Application Secrets
    description: |
      Bind all application secrets through Cloud.gov CredHub service or
      cf set-env injection from CI/CD vault. Never commit credentials to
      manifest.yml, application source, or CF environment directly.
    control_type: preventive
    cost: low

  - id: cloudgov-internal-routes
    name: Use Internal Routes for Non-Public Services
    description: |
      Expose backend services only on Cloud Foundry internal routes
      (apps.internal) rather than public routes. Only CDN-fronted or
      explicitly public apps should have external routes.
    control_type: preventive
    cost: low

  - id: cloudgov-per-app-service-binding
    name: One Service Instance per Application (Least Privilege)
    description: |
      Create a separate Cloud.gov managed service instance for each application
      that requires it. Do not share a single RDS/S3/Redis binding across
      multiple apps.
    control_type: preventive
    cost: low

  - id: cloudgov-buildpack-currency
    name: Keep Buildpacks and Dependencies Current
    description: |
      Use Cloud Foundry's platform buildpack update mechanism. Pin
      buildpack versions in manifest.yml and run regular cf restage cycles
      after platform buildpack updates. Scan application dependencies with
      Dependabot or equivalent.
    control_type: preventive
    cost: low

  - id: cloudgov-container-image-digest
    name: Pin and Verify Container Image Digests
    description: |
      Reference reviewed OCI images by immutable digest or controlled release tag.
      Verify provenance and vulnerability scan results before deployment, and
      require a new review when the image digest changes.
    control_type: preventive
    cost: low

  - id: cloudgov-registry-credential-management
    name: Scope Container Registry Credentials
    description: |
      Store registry credentials in an approved secret manager or CI environment,
      use least-privilege pull scopes, and do not commit registry credentials to
      manifest.yml or source control.
    control_type: preventive
    cost: low

  - id: cloudgov-space-roles
    name: Enforce Least-Privilege CF Space Roles
    description: |
      Assign Cloud Foundry roles at the narrowest scope needed. Use
      SpaceDeveloper only for deploy-time automation; use SpaceAuditor for
      read-only monitoring. Review space membership at least quarterly.
    control_type: preventive
    cost: low

  - id: cloudgov-crm-review
    name: Cloud.gov CRM/CIS Tenant Responsibility Review
    description: |
      Review the Cloud.gov PaaS CRM/CIS during SSPP authoring. Document
      implementation for all controls where tenant bears responsibility or
      shared responsibility. Verify "can_be_inherited" flags before claiming
      inheritance in the SSPP.
    control_type: preventive
    cost: low

  - id: cloudgov-pages-branch-protection
    name: GSA Pages Branch Protection and Required Peer Review
    description: |
      Enforce branch protection on the GSA Pages publication branch:
      require at least one approving peer review, require status checks to pass,
      and disable force pushes. Pin GitHub Actions to commit SHA.
    control_type: preventive
    cost: low

  - id: cloudgov-pages-github-team-ci-governance
    name: Enforce GitHub Users/Teams Access and CodeQL/Dependabot CI
    description: |
      Administer repository access through least-privilege GitHub users and
      teams, review membership regularly, and require CodeQL static analysis
      and Dependabot dependency scanning CI checks before merge.
    control_type: preventive
    cost: low

  - id: cloudgov-pages-security-headers
    name: Enforce Pages Proxy Security Headers
    description: |
      Route public static-site traffic through the Cloud.gov CDN and Pages Proxy
      with encrypted transport, HSTS, Content-Security-Policy, and appropriate
      content-type protections.
    control_type: preventive
    cost: low

  - id: cloudgov-pages-atu-continuous-monitoring
    name: Automated Static-Site Continuous Monitoring
    description: |
      Run scheduled checks for branch protection, collaborator access,
      dependency scanning, transport posture, security headers, and approved
      third-party asset usage.
    control_type: detective
    cost: low

  - id: cloudgov-log-drain
    name: Configure Cloud.gov Log Draining to SIEM
    description: |
      Set up Cloud.gov log draining to forward application and platform logs
      to GSA's SIEM or a centralized log aggregation service for audit
      trail retention and alerting.
    control_type: detective
    cost: low
  - id: cloudgov-separate-egress-space
    name: Separate Public Egress from Restricted Workloads
    description: Keep client workloads in closed-egress or trusted-local-egress spaces when feasible. Place only the controlled proxy in a separately administered public-egress space and document the required application security groups.
    control_type: preventive
    cost: low
  - id: cloudgov-egress-deny-by-default
    name: Enforce Per-Client Deny-by-Default Egress Policy
    description: Store reviewed client-specific deny lists, allow lists, and allowed ports in version control. Evaluate explicit deny rules first, explicit allow rules second, and deny destinations that match neither.
    control_type: preventive
    cost: low
  - id: cloudgov-egress-network-policy
    name: Restrict Client-to-Proxy Network Policy
    description: Use Cloud Foundry container-to-container network policy to allow only named client apps to reach the proxy internal route and listener; review changes with the egress-policy change record.
    control_type: preventive
    cost: low
  - id: cloudgov-egress-credential-rotation
    name: Protect and Rotate Egress Proxy Credentials
    description: Issue distinct proxy credentials per client, deliver them through approved service bindings or secret injection, redact them from logs, and rotate or revoke them when access changes.
    control_type: preventive
    cost: low
  - id: cloudgov-service-account-least-privilege
    name: Scope and Rotate Cloud.gov Service Accounts
    description: Use a space-deployer account only for deployment automation and a space-auditor account for read-only review. Store service keys securely and rotate them before their password-expiry interval.
    control_type: preventive
    cost: low
  - id: cloudgov-egress-log-review
    name: Monitor Proxy Decisions and Egress Failures
    description: Forward proxy decision logs and client egress failures to the authorized monitoring path. Alert on unexpected denial spikes, policy changes, and authentication failures without logging credentials.
    control_type: detective
    cost: low
