template:
  slug: gsa-cloudgov-buildpack-deployment
  name: Cloud.gov Buildpack Deployment
  description: Cloud.gov deployment using tenant source, manifest.yaml, and buildpack staging with managed RDS, Redis, and
    object storage.
  category: federal-platform
  diagram_type: level1
canvas_data:
  nodes:
  - id: internet-user
    type: humanActor
    position:
      x: 40
      y: 280
    data:
      label: Public User
      actorType: user
  - id: cloudgov-boundary
    type: systemScope
    position:
      x: 240
      y: 40
    style:
      width: 1120
      height: 500
    data:
      label: Cloud.gov Tenant Boundary
  - id: cloudgov-edge
    type: trustZone
    parentId: cloudgov-boundary
    position:
      x: 25
      y: 40
    style:
      width: 220
      height: 400
    data:
      label: Public Edge
      zoneType: network
  - id: cloudgov-app-zone
    type: trustZone
    parentId: cloudgov-boundary
    position:
      x: 275
      y: 40
    style:
      width: 250
      height: 400
    data:
      label: Tenant Application
      zoneType: trust
  - id: cloudgov-data-zone
    type: trustZone
    parentId: cloudgov-boundary
    position:
      x: 745
      y: 40
    style:
      width: 300
      height: 400
    data:
      label: Managed Data Services
      zoneType: trust
  - id: cloudgov-cdn
    type: process
    parentId: cloudgov-edge
    position:
      x: 30
      y: 130
    data:
      label: Cloud.gov CDN
      component_ref: cloudgov-cdn
  - id: cloudgov-app
    type: process
    parentId: cloudgov-app-zone
    position:
      x: 40
      y: 130
    data:
      label: Tenant Application
      component_ref: cloudgov-apps
  - id: cloudgov-rds
    type: datastore
    parentId: cloudgov-data-zone
    position:
      x: 30
      y: 90
    data:
      label: Managed RDS
      component_ref: cloudgov-rds
  - id: cloudgov-object-store
    type: datastore
    parentId: cloudgov-data-zone
    position:
      x: 150
      y: 240
    data:
      label: Managed Object Storage
      component_ref: cloudgov-s3
  - id: cloudgov-redis
    type: datastore
    parentId: cloudgov-data-zone
    position:
      x: 150
      y: 90
    data:
      label: Managed Redis Cache
      component_ref: cloudgov-redis
  - id: cloudgov-deployment-zone
    type: trustZone
    parentId: cloudgov-boundary
    position:
      x: 555
      y: 40
    style:
      width: 155
      height: 400
    data:
      label: Deployment Staging
      zoneType: trust
  - id: source-repository
    type: systemActor
    position:
      x: 35
      y: 70
    data:
      label: Source Repository
      systemType: service
  - id: cloudgov-manifest
    type: datastore
    parentId: cloudgov-deployment-zone
    position:
      x: 15
      y: 55
    data:
      label: manifest.yaml
      component_ref: cloudgov-manifest
  - id: cloudgov-buildpack
    type: process
    parentId: cloudgov-deployment-zone
    position:
      x: 15
      y: 230
    data:
      label: Buildpack Staging
      component_ref: cloudgov-buildpack
  edges:
  - id: user-to-cdn
    source: internet-user
    target: cloudgov-cdn
    type: dataFlow
    data:
      label: HTTPS
      protocol: HTTPS
      encrypted: true
  - id: cdn-to-app
    source: cloudgov-cdn
    target: cloudgov-app
    type: dataFlow
    data:
      label: HTTPS
      protocol: HTTPS
      encrypted: true
  - id: app-to-rds
    source: cloudgov-app
    target: cloudgov-rds
    type: dataFlow
    data:
      label: TLS database connection
      protocol: TLS
      encrypted: true
  - id: app-to-object-store
    source: cloudgov-app
    target: cloudgov-object-store
    type: dataFlow
    data:
      label: TLS object access
      protocol: HTTPS
      encrypted: true
  - id: app-to-redis
    source: cloudgov-app
    target: cloudgov-redis
    type: dataFlow
    data:
      label: TLS cache connection
      protocol: TLS
      encrypted: true
  - id: source-to-manifest
    source: source-repository
    target: cloudgov-manifest
    type: dataFlow
    data:
      label: Reviewed source and manifest
      protocol: Git/HTTPS
      encrypted: true
  - id: manifest-to-buildpack
    source: cloudgov-manifest
    target: cloudgov-buildpack
    type: dataFlow
    data:
      label: Buildpack declaration
      protocol: Cloud Foundry API
      encrypted: true
  - id: buildpack-to-app
    source: cloudgov-buildpack
    target: cloudgov-app
    type: dataFlow
    data:
      label: Staged application
      protocol: Cloud Foundry API
      encrypted: true
