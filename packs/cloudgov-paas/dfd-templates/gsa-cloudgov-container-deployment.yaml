template:
  slug: gsa-cloudgov-container-deployment
  name: Cloud.gov Container Deployment
  description: Cloud.gov deployment using manifest.yaml and a reviewed OCI image from an approved container registry, with
    managed RDS, Redis, and object storage.
  category: federal-platform
  diagram_type: level1
canvas_data:
  nodes:
    - id: internet-user
      type: humanActor
      position:
        x: 40
        y: 280
      data:
        label: Public User
        actorType: user
        component_ref: cloudgov-public-user
    - id: cloudgov-boundary
      type: systemScope
      position:
        x: 240
        y: 40
      style:
        width: 1120
        height: 500
      data:
        label: Cloud.gov Tenant Boundary
    - id: cloudgov-edge
      type: trustZone
      parentId: cloudgov-boundary
      position:
        x: 25
        y: 40
      style:
        width: 220
        height: 400
      data:
        label: Public Edge
        zoneType: network
    - id: cloudgov-app-zone
      type: trustZone
      parentId: cloudgov-boundary
      position:
        x: 275
        y: 40
      style:
        width: 250
        height: 400
      data:
        label: Tenant Application
        zoneType: trust
    - id: cloudgov-data-zone
      type: trustZone
      parentId: cloudgov-boundary
      position:
        x: 745
        y: 40
      style:
        width: 300
        height: 400
      data:
        label: Managed Data Services
        zoneType: trust
    - id: cloudgov-cdn
      type: process
      parentId: cloudgov-edge
      position:
        x: 30
        y: 130
      data:
        label: Cloud.gov CDN
        component_ref: cloudgov-cdn
    - id: cloudgov-app
      type: process
      parentId: cloudgov-app-zone
      position:
        x: 40
        y: 130
      data:
        label: Tenant Application
        component_ref: cloudgov-apps
    - id: cloudgov-rds
      type: datastore
      parentId: cloudgov-data-zone
      position:
        x: 30
        y: 90
      data:
        label: Managed RDS
        component_ref: cloudgov-rds
    - id: cloudgov-object-store
      type: datastore
      parentId: cloudgov-data-zone
      position:
        x: 150
        y: 240
      data:
        label: Managed Object Storage
        component_ref: cloudgov-s3
    - id: cloudgov-redis
      type: datastore
      parentId: cloudgov-data-zone
      position:
        x: 150
        y: 90
      data:
        label: Managed Redis Cache
        component_ref: cloudgov-redis
    - id: cloudgov-deployment-zone
      type: trustZone
      parentId: cloudgov-boundary
      position:
        x: 555
        y: 40
      style:
        width: 155
        height: 400
      data:
        label: Deployment Staging
        zoneType: trust
    - id: source-repository
      type: systemActor
      position:
        x: 35
        y: 70
      data:
        label: Source Repository
        systemType: service
        component_ref: cloudgov-source-repository
    - id: cloudgov-manifest
      type: datastore
      parentId: cloudgov-deployment-zone
      position:
        x: 15
        y: 30
      data:
        label: manifest.yaml
        component_ref: cloudgov-manifest
    - id: cloudgov-image
      type: datastore
      parentId: cloudgov-deployment-zone
      position:
        x: 15
        y: 145
      data:
        label: Container Image Digest
        component_ref: cloudgov-container-image
    - id: cloudgov-registry
      type: process
      parentId: cloudgov-deployment-zone
      position:
        x: 15
        y: 260
      data:
        label: Approved Registry
        component_ref: cloudgov-container-registry
  edges:
    - id: user-to-cdn
      source: internet-user
      target: cloudgov-cdn
      type: dataFlow
      data:
        label: HTTPS
        protocol: HTTPS
        encrypted: true
    - id: cdn-to-app
      source: cloudgov-cdn
      target: cloudgov-app
      type: dataFlow
      data:
        label: HTTPS
        protocol: HTTPS
        encrypted: true
    - id: app-to-rds
      source: cloudgov-app
      target: cloudgov-rds
      type: dataFlow
      data:
        label: TLS database connection
        protocol: TLS
        encrypted: true
    - id: app-to-object-store
      source: cloudgov-app
      target: cloudgov-object-store
      type: dataFlow
      data:
        label: TLS object access
        protocol: HTTPS
        encrypted: true
    - id: app-to-redis
      source: cloudgov-app
      target: cloudgov-redis
      type: dataFlow
      data:
        label: TLS cache connection
        protocol: TLS
        encrypted: true
    - id: source-to-container-manifest
      source: source-repository
      target: cloudgov-manifest
      type: dataFlow
      data:
        label: Reviewed manifest
        protocol: Git/HTTPS
        encrypted: true
    - id: registry-to-image
      source: cloudgov-registry
      target: cloudgov-image
      type: dataFlow
      data:
        label: Reviewed OCI image
        protocol: HTTPS
        encrypted: true
    - id: manifest-to-app
      source: cloudgov-manifest
      target: cloudgov-app
      type: dataFlow
      data:
        label: Deployment declaration
        protocol: Cloud Foundry API
        encrypted: true
    - id: image-to-app
      source: cloudgov-image
      target: cloudgov-app
      type: dataFlow
      data:
        label: Immutable image deployment
        protocol: Cloud Foundry API
        encrypted: true
