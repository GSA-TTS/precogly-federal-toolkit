template:
  slug: cloudgov-paas-web-app
  name: Cloud.gov PaaS Web Application
  description: Public web application on Cloud.gov with a tenant application and managed data services.
  category: federal-platform
  diagram_type: level1
canvas_data:
  nodes:
    - id: internet-user
      type: humanActor
      position: { x: 40, y: 250 }
      data: { label: Public User, actorType: user }
    - id: cloudgov-boundary
      type: systemScope
      position: { x: 240, y: 40 }
      style: { width: 900, height: 500 }
      data: { label: Cloud.gov Tenant Boundary }
    - id: cloudgov-edge
      type: trustZone
      parentId: cloudgov-boundary
      position: { x: 25, y: 40 }
      style: { width: 220, height: 400 }
      data: { label: Public Edge, zoneType: network }
    - id: cloudgov-app-zone
      type: trustZone
      parentId: cloudgov-boundary
      position: { x: 275, y: 40 }
      style: { width: 250, height: 400 }
      data: { label: Tenant Application, zoneType: trust }
    - id: cloudgov-data-zone
      type: trustZone
      parentId: cloudgov-boundary
      position: { x: 555, y: 40 }
      style: { width: 300, height: 400 }
      data: { label: Managed Data Services, zoneType: trust }
    - id: cloudgov-cdn
      type: process
      parentId: cloudgov-edge
      position: { x: 30, y: 130 }
      data: { label: Cloud.gov CDN, component_ref: cloudgov-cdn }
    - id: cloudgov-app
      type: process
      parentId: cloudgov-app-zone
      position: { x: 40, y: 130 }
      data: { label: Tenant Application, component_ref: cloudgov-apps }
    - id: cloudgov-rds
      type: datastore
      parentId: cloudgov-data-zone
      position: { x: 30, y: 90 }
      data: { label: Managed RDS, component_ref: cloudgov-rds }
    - id: cloudgov-object-store
      type: datastore
      parentId: cloudgov-data-zone
      position: { x: 150, y: 240 }
      data: { label: Managed Object Storage, component_ref: cloudgov-s3 }
  edges:
    - { id: user-to-cdn, source: internet-user, target: cloudgov-cdn, type: dataFlow, data: { label: HTTPS, protocol: HTTPS, encrypted: true } }
    - { id: cdn-to-app, source: cloudgov-cdn, target: cloudgov-app, type: dataFlow, data: { label: HTTPS, protocol: HTTPS, encrypted: true } }
    - { id: app-to-rds, source: cloudgov-app, target: cloudgov-rds, type: dataFlow, data: { label: TLS database connection, protocol: TLS, encrypted: true } }
    - { id: app-to-object-store, source: cloudgov-app, target: cloudgov-object-store, type: dataFlow, data: { label: TLS object access, protocol: HTTPS, encrypted: true } }
