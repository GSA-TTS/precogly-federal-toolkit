components:
  # ── Platform Layer ────────────────────────────────────────────────────────────
  - id: cloudgov-platform
    name: Cloud.gov Platform (PaaS Runtime)
    category: process
    type: PaaS Platform
    provider: gsa
    description: |
      GSA-operated Cloud Foundry PaaS on AWS GovCloud. FedRAMP High authorized.
      Provides managed Diego cell compute, BOSH-managed infrastructure, UAA
      identity, CredHub secrets, and platform-level controls inherited by all
      tenant applications. GSA applications may inherit Cloud.gov's control
      implementations; non-GSA agencies must inherit separately.

  - id: cloudgov-apps
    name: Cloud.gov Application (Tenant Workload)
    category: process
    type: Hosted Application
    provider: gsa
    description: |
      Tenant application running within a Cloud.gov org/space. Inherits
      platform controls from Cloud.gov. Tenant team remains responsible for
      application-layer controls: code security, dependency management,
      application-level access control, and configuration of bound services.

  # ── Deployment Models ───────────────────────────────────────────────────────
  - id: cloudgov-manifest
    name: Cloud.gov manifest.yaml
    category: datastore
    type: Deployment Manifest
    provider: tenant
    description: |
      Cloud Foundry deployment manifest declaring the application name, routes,
      service bindings, environment references, and either a buildpack or an OCI
      container image. It is tenant-managed source configuration and must not
      contain plaintext credentials.

  - id: cloudgov-buildpack
    name: Cloud.gov Buildpack Staging
    category: process
    type: Buildpack Staging
    provider: gsa
    description: |
      Cloud.gov staging process that applies an approved Cloud Foundry buildpack
      to tenant application source before deployment to the tenant workload.

  - id: cloudgov-container-image
    name: Cloud.gov Container Image Reference
    category: datastore
    type: OCI Image Artifact
    provider: tenant
    description: |
      Tenant-declared OCI image reference consumed by Cloud.gov container staging.
      Use an immutable digest or controlled version tag and record image
      provenance before deployment.

  - id: cloudgov-container-registry
    name: Approved Container Registry
    category: process
    type: OCI Registry
    provider: external
    description: |
      Authorized registry serving reviewed OCI images to a Cloud.gov deployment.
      Registry credentials, image provenance, and vulnerability remediation
       remain tenant responsibilities.

  # ── Controlled egress ────────────────────────────────────────────────────────
  - id: cloudgov-restricted-space
    name: Cloud.gov Restricted Workload Space
    category: process
    type: Cloud Foundry Space
    provider: tenant
    description: |
      Tenant Cloud Foundry space for workload instances using the default closed
      egress posture or trusted-local egress for brokered services. It should not
      receive unrestricted public egress merely because one dependency needs it.

  - id: cloudgov-egress-space
    name: Cloud.gov Public-Egress Proxy Space
    category: process
    type: Cloud Foundry Space
    provider: tenant
    description: |
      Separate tenant space for a controlled forward proxy that needs public
      egress. Separating this space from the workload bounds the public-egress
      application security group to the proxy rather than every client workload.

  - id: cloudgov-egress-proxy
    name: Authenticated Internal-Route Egress Proxy
    category: process
    type: Forward Proxy
    provider: tenant
    description: |
      Tenant-operated authenticated HTTP/S forward proxy on an apps.internal
      route. The reference pattern evaluates client-specific deny rules, then
      allow rules, then denies unmatched destinations. It is not a cloud.gov
      managed service and requires tenant operations, patching, and review.

  - id: cloudgov-egress-policy
    name: Per-Client Egress Allow and Deny Policy
    category: datastore
    type: Egress Policy Configuration
    provider: tenant
    description: |
      Reviewed, version-controlled client destination and port allow/deny policy.
      It is intentionally deny-by-default and must not contain proxy credentials.

  - id: cloudgov-network-policy
    name: Cloud Foundry App-to-Proxy Network Policy
    category: process
    type: Container-to-Container Network Policy
    provider: tenant
    description: |
      Explicit Cloud Foundry network policy that permits only the intended client
      application to reach the internal proxy listener. Internal routes do not by
      themselves create least-privilege connectivity.

  - id: cloudgov-route-service
    name: Nginx Buildpack Ingress Route Service
    category: process
    type: Reverse Proxy Route Service
    provider: tenant
    description: |
      Optional tenant-operated route service, commonly built with the nginx
      buildpack, that filters inbound requests before the Cloud Foundry router
      delivers them to an application. This is an ingress pattern, not a
      replacement for controlled outbound egress.

  - id: cloudgov-deploy-service-account
    name: Cloud.gov Deployer Service Account
    category: external_system_actor
    type: Deployment Machine Identity
    provider: cloud.gov
    description: |
      Non-human space-deployer service account for deployment automation. Its
      credentials are obtained through a service key, require protected storage,
      and must be rotated before password expiry. Do not use it for human login.

  - id: cloudgov-audit-service-account
    name: Cloud.gov Auditor Service Account
    category: external_system_actor
    type: Read-Only Audit Machine Identity
    provider: cloud.gov
    description: |
      Non-human space-auditor service account for read-only configuration and
      event review. Scope it to the minimum space and rotate its service-key
      credentials before expiry.

  # ── Managed Service Tiers ─────────────────────────────────────────────────────
  - id: cloudgov-rds
    name: Cloud.gov RDS (Managed PostgreSQL / MySQL)
    category: datastore
    type: Managed Relational Database
    provider: gsa
    description: |
      Cloud.gov managed RDS service plan providing PostgreSQL or MySQL databases
      on AWS GovCloud. Encryption at rest (KMS) and in transit (TLS) provided
      by platform. Tenant is responsible for application-level data access
      control and backup retention policy selection.

  - id: cloudgov-s3
    name: Cloud.gov S3 (Managed Object Storage)
    category: datastore
    type: Managed Object Storage
    provider: gsa
    description: |
      Cloud.gov managed S3 service plan providing GovCloud S3 buckets with
      server-side encryption (SSE-KMS) and IAM-scoped access credentials.
      Tenant is responsible for bucket-level data classification and access
      patterns.

  - id: cloudgov-redis
    name: Cloud.gov Redis (Managed Cache)
    category: datastore
    type: Managed Cache
    provider: gsa
    description: |
      Cloud.gov managed Redis service plan providing ElastiCache Redis on
      GovCloud with encryption at rest and in transit. Tenant is responsible
      for application-level session and cache data classification.

  - id: cloudgov-elasticsearch
    name: Cloud.gov Elasticsearch (Managed Search)
    category: datastore
    type: Managed Search
    provider: gsa
    description: |
      Cloud.gov managed Elasticsearch/OpenSearch service plan on GovCloud.
      Encryption at rest and in transit provided by platform. Tenant is
      responsible for index-level access control and data sensitivity review.

  - id: cloudgov-cdn
    name: Cloud.gov CDN / External Domain Service
    category: process
    type: CDN / TLS Termination
    provider: gsa
    description: |
      Cloud.gov CDN service routing traffic through CloudFront with automatic
      TLS certificate management (Let's Encrypt). Provides WAF-level edge
      caching and DDoS mitigation via AWS Shield Standard. Tenant is
      responsible for configuring custom domains and origin headers.

  # ── GSA Pages (built on Cloud.gov) ──────────────────────────────────────────
  - id: cloudgov-pages-github-admin
    name: GSA Pages GitHub Administration & CI Governance
    category: process
    type: Repository Governance & CI
    provider: tenant
    description: |
      GitHub administration and CI governance for GSA Pages repositories.
      Administers users and teams, enforces branch protections with required
      peer review on publication branches, and runs CodeQL and Dependabot CI
      checks before changes trigger a GSA Pages build.

  - id: cloudgov-pages
    name: GSA Pages (Static Site Hosting)
    category: process
    type: Static Hosting
    provider: gsa
    description: |
      GSA Pages (formerly Federalist) static site publishing platform built on
      Cloud.gov infrastructure. Builds and serves Jekyll/Hugo/static sites from
      GitHub. FedRAMP Moderate authorized. Tenant (website manager) is
      responsible for content, GitHub branch protection, and contributor access
      management per GSA Pages CRM.

  - id: cloudgov-pages-builder
    name: GSA Pages Ephemeral Build Container
    category: process
    type: Static Site Builder
    provider: gsa
    description: |
      Isolated, ephemeral Cloud.gov Pages build container that checks out a
      reviewed source revision, runs the static-site generator, and publishes
      compiled static assets to managed object storage.

  - id: cloudgov-pages-proxy
    name: Cloud.gov Pages Proxy
    category: process
    type: Reverse Proxy / Header Enforcement
    provider: gsa
    description: |
      Cloud.gov Pages reverse proxy fronting published static-site storage.
      Enforces encrypted access and applies configured security response-header
      policy before serving static content.
