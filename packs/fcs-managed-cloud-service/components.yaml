components:
  # ── Shared Foundation ────────────────────────────────────────────────────────
  - id: fcs-core
    name: FCS Core (Shared Infrastructure)
    category: process
    type: Inherited Control Provider
    provider: gsa
    description: |
      GSA Federal Collaboration Space shared infrastructure layer. Provides
      fully-inherited common controls to all managed cloud service service tiers. Operates on
      AWS GovCloud. Inherits from OCISO. All tenant systems transitively inherit
      FCS Core controls through their chosen service tier.

  # ── Service Tiers ─────────────────────────────────────────────────────────────
  - id: managed-cloud-service-platform
    name: managed cloud service (Managed Cloud as a Service)
    category: process
    type: Managed PaaS Platform
    provider: gsa
    description: |
      GSA managed cloud service managed application platform tier. Provides hybrid and
      fully-inherited FedRAMP Moderate controls to tenant application systems.
      Tenants receive managed compute, networking, IAM, and baseline security
      controls. Tenant responsibilities documented in managed cloud service CRM v6.
      Inherits from FCS Core.

  - id: managed-cloud-service-caas
    name: CaaS (Container as a Service)
    category: process
    type: Managed Container Platform
    provider: gsa
    description: |
      GSA FCS Container as a Service tier. Provides managed Kubernetes/ECS
      container orchestration with hybrid FedRAMP Moderate controls. Tenant
      teams deploy containerized workloads; CaaS manages node security,
      cluster updates, and networking. Inherits from FCS Core via managed cloud service.

  - id: managed-cloud-service-vpcaas
    name: VPCaaS (VPC as a Service)
    category: process
    type: Network Isolation
    provider: gsa
    description: |
      GSA FCS VPC as a Service tier. Provides tenant-isolated VPC environments
      on AWS GovCloud. All controls are system-specific — tenant assumes full
      responsibility for controls within the VPC boundary. No inheritance
      from FCS Core for control implementation.

  - id: managed-cloud-service-data
    name: Data (Data as a Service)
    category: datastore
    type: Managed Data Services
    provider: gsa
    description: |
      GSA FCS Data as a Service tier. Provides managed data storage and
      processing services (S3, RDS, managed databases) with hybrid FedRAMP
      Moderate controls. Tenants inherit data-layer controls; tenant-specific
      data classification and access control remain tenant responsibilities.
      Inherits from FCS Core.

  - id: managed-cloud-service-ebta
    name: EBTA (Emerging Business Technology Applications)
    category: process
    type: Emerging Tech Platform
    provider: gsa
    description: |
      GSA FCS Emerging Business Technology Application tier for novel or
      non-standard workloads. Provides hybrid FedRAMP Moderate controls from
      FCS Core. Appropriate for AI/ML, experimental, or specialized workloads
      that don't fit standard managed cloud service/CaaS tiers. Inherits from FCS Core.

  - id: managed-cloud-service-data-platform
    name: FCS data platform (Analytics / ML)
    category: datastore
    type: Managed Analytics / ML Platform
    provider: gsa
    description: |
      GSA Federal Collaboration Space data platform workspace operating on AWS
      GovCloud within the FCS managed cloud service boundary. Provides managed Apache Spark,
      Delta Lake, and ML workflows for GSA data programs. Tenant access
      governed by managed cloud service CRM and Unity Catalog / Table ACLs.
      Inherits FedRAMP Moderate controls from FCS managed cloud service service tier.
