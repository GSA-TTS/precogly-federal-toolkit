      icon: server
    - component: managed-cloud-service-platform
      icon: cloud
    - component: managed-cloud-service-caas
      icon: containers
    - component: managed-cloud-service-vpcaas
      icon: network
    - component: managed-cloud-service-data
      icon: database
    - component: managed-cloud-service-ebta
      icon: flask
    - component: managed-cloud-service-data-platform
      icon: analytics
  tags:
